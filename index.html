<style>
/* ============================================================
   NUTRI-BOY 3000 — DESIGN TOKENS
   Palette: phosphor CRT green, amber caution, rad orange-red
   ============================================================ */
:root{
  --p-void:#04120A;      /* deep chassis black-green */
  --p-deep:#07200F;      /* screen base */
  --p-dim:#0F4A28;       /* inactive stroke */
  --p-mid:#1E9455;       /* secondary text */
  --p-lit:#3CFF8E;       /* PRIMARY phosphor */
  --p-hot:#CFFFE4;       /* highlight / hot white-green */
  --amber:#FFB000;       /* caution */
  --rad:#FF5033;         /* over budget / danger */
  --steel:#0A1A12;
  --glow: 0 0 4px rgba(60,255,142,.55), 0 0 12px rgba(60,255,142,.22);
  --glow-soft: 0 0 6px rgba(60,255,142,.28);
  --mono:'Share Tech Mono', ui-monospace, 'Courier New', monospace;
  --thai:'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  padding-top:max(10px, env(safe-area-inset-top));
  padding-bottom:max(10px, env(safe-area-inset-bottom));
  background:
    radial-gradient(ellipse at 50% 0%, #0b2416 0%, #030b06 60%, #010402 100%);
  font-family:var(--mono);
  color:var(--p-lit);
  min-height:100dvh;
  padding:10px;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
}
:lang(th),.th{font-family:var(--thai)}

/* ---------- CHASSIS ---------- */
#chassis{
  width:100%;max-width:1080px;
  background:linear-gradient(180deg,#132018,#0a130d 40%,#070d09);
  border:2px solid #1c3226;
  border-radius:16px;
  padding:12px;
  box-shadow:0 0 0 1px #000, 0 24px 60px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;
}
#chassis::before,#chassis::after{
  content:'';position:absolute;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#42604f,#101a14);top:6px;
}
#chassis::before{left:8px}
#chassis::after{right:8px}

#screen{
  position:relative;
  background:radial-gradient(ellipse at 50% 45%, #0b2c17 0%, var(--p-deep) 55%, #030f07 100%);
  border-radius:10px;
  border:1px solid #163a24;
  overflow:hidden;
  min-height:70dvh;
  display:flex;flex-direction:column;
}
/* CRT overlays */
#screen .scan,#screen .vig,#screen .flick{position:absolute;inset:0;pointer-events:none;z-index:50}
.scan{background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.28) 3px,rgba(0,0,0,.28) 4px);mix-blend-mode:multiply}
.scan::after{content:'';position:absolute;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(60,255,142,0),rgba(60,255,142,.045),rgba(60,255,142,0));animation:sweep 7s linear infinite}
@keyframes sweep{0%{top:-140px}100%{top:100%}}
.vig{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%);box-shadow:inset 0 0 90px rgba(0,0,0,.9)}
.flick{background:rgba(60,255,142,.03);animation:flick 3.1s steps(2) infinite;opacity:.6}
@keyframes flick{0%,96%{opacity:.25}97%{opacity:.7}98%{opacity:.15}100%{opacity:.4}}
body.noCRT .scan,body.noCRT .flick{display:none}
body.noCRT .vig{opacity:.35}

/* ---------- BOOT ---------- */
#boot{position:absolute;inset:0;background:#020a05;z-index:99;padding:26px 20px;font-size:13px;line-height:1.7;overflow:hidden}
#boot b{color:var(--p-hot);font-weight:400}
#bootlog{white-space:pre-wrap;text-shadow:var(--glow)}
#boot.done{animation:crtOff .5s ease forwards}
@keyframes crtOff{60%{transform:scaleY(.02);opacity:1;filter:brightness(3)}100%{transform:scaleY(0) scaleX(0);opacity:0;visibility:hidden}}

/* ---------- HEADER / TABS ---------- */
header{padding:10px 14px 0;position:relative;z-index:10}
.brand{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:1px solid var(--p-dim);padding-bottom:6px;flex-wrap:wrap}
.brand h1{font-size:15px;letter-spacing:2px;font-weight:400;text-shadow:var(--glow)}
.brand h1 small{display:block;font-size:9px;color:var(--p-mid);letter-spacing:3px}
.hdr-r{font-size:11px;color:var(--p-mid);text-align:right;line-height:1.5}
.hdr-r b{color:var(--p-lit);font-weight:400}

nav{display:flex;gap:0;margin-top:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:1 0 auto;min-width:74px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--p-dim);font-family:var(--mono);font-size:13px;letter-spacing:2px;
  padding:8px 10px 6px;cursor:pointer;transition:color .12s,border-color .12s;
}
nav button:hover{color:var(--p-mid)}
nav button.on{color:var(--p-hot);border-bottom-color:var(--p-lit);text-shadow:var(--glow)}
nav button:focus-visible{outline:1px dashed var(--p-lit);outline-offset:-3px}

/* ---------- PANEL / CONTENT ---------- */
main{flex:1;padding:12px 14px 16px;position:relative;z-index:10;overflow-y:auto;max-height:none}
.page{display:none;animation:fade .18s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1}}

.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}

.box{border:1px solid var(--p-dim);border-radius:var(--r);padding:10px 12px;background:linear-gradient(180deg,rgba(60,255,142,.035),rgba(0,0,0,0))}
.box>h2{font-size:11px;letter-spacing:3px;color:var(--p-mid);font-weight:400;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.box{min-width:0}
.box>h2 span{color:rgba(60,255,142,.5);letter-spacing:1px;text-align:right}

/* ---------- VITALS (SIGNATURE) ---------- */
#vitals{border:1px solid var(--p-lit);box-shadow:var(--glow-soft);border-radius:var(--r);padding:12px;background:linear-gradient(180deg,rgba(60,255,142,.07),rgba(0,0,0,.2))}
.vrow{display:flex;align-items:center;gap:12px}
#mascot{width:92px;flex:0 0 92px}
#mascot svg{width:100%;height:auto;filter:drop-shadow(0 0 5px rgba(60,255,142,.5))}
.vmeters{flex:1;min-width:0}
.meter{margin-bottom:9px}
.meter label{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--p-mid);margin-bottom:3px}
.meter label b{color:var(--p-hot);font-weight:400;letter-spacing:1px}
.bar{height:13px;border:1px solid var(--p-dim);position:relative;overflow:hidden;background:rgba(0,0,0,.45)}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(90deg,var(--p-lit) 0 5px,rgba(0,0,0,.35) 5px 7px);transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:var(--glow-soft)}
.bar.amber i{background:repeating-linear-gradient(90deg,var(--amber) 0 5px,rgba(0,0,0,.35) 5px 7px)}
.bar.rad i{background:repeating-linear-gradient(90deg,var(--rad) 0 5px,rgba(0,0,0,.35) 5px 7px)}
.bar.thin{height:9px}

.bignum{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
.bignum em{font-style:normal;font-size:40px;line-height:1;color:var(--p-hot);text-shadow:var(--glow)}
.bignum u{text-decoration:none;font-size:11px;color:var(--p-mid);letter-spacing:2px}
.bignum.over em{color:var(--rad);text-shadow:0 0 8px rgba(255,80,51,.6)}

.stat4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--p-dim);border:1px solid var(--p-dim);margin-top:10px}
@media(min-width:520px){.stat4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat4 div{background:var(--p-deep);padding:7px 8px;text-align:center}
.stat4 s{text-decoration:none;display:block;font-size:9px;letter-spacing:2px;color:var(--p-mid)}
.stat4 b{font-weight:400;font-size:19px;color:var(--p-hot)}
.stat4 i{font-style:normal;display:block;font-size:9px;color:rgba(30,148,85,.95)}

/* ---------- SPECIAL macro bars ---------- */
.spec{display:flex;flex-direction:column;gap:7px}
.sp{display:grid;grid-template-columns:78px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:11px}
.sp em{font-style:normal;letter-spacing:2px;color:var(--p-mid)}
.sp u{text-decoration:none;text-align:right;color:var(--p-hot);font-size:11px}
.sp .bar i{transition:width .6s ease}

/* ---------- LISTS / TABLE ---------- */
.mealhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--p-dim);padding:6px 2px;margin-top:10px;font-size:11px;letter-spacing:2px;color:var(--p-mid)}
.mealhead b{color:var(--p-lit);font-weight:400}
ul.items{list-style:none}
ul.items li{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px dotted rgba(30,148,85,.35);font-size:12px}
ul.items li .nm{color:var(--p-hot);font-family:var(--thai);font-size:13px;line-height:1.25}
ul.items li .nm s{text-decoration:none;display:block;font-family:var(--mono);font-size:9.5px;color:var(--p-mid);letter-spacing:.5px;margin-top:1px}
ul.items li .kc{color:var(--p-lit);font-size:14px}
.xbtn{background:none;border:1px solid var(--p-dim);color:var(--p-mid);width:22px;height:22px;line-height:1;cursor:pointer;border-radius:2px;font-family:var(--mono)}
.xbtn:hover{border-color:var(--rad);color:var(--rad)}
.empty{color:rgba(30,148,85,.8);font-size:11px;padding:10px 2px;letter-spacing:1px;font-family:var(--thai);min-width:0;overflow-wrap:anywhere}

/* ---------- FORM ---------- */
label.f{display:block;font-size:10px;letter-spacing:2px;color:var(--p-mid);margin:8px 0 3px}
input,select,textarea,button.btn{
  font-family:var(--mono);font-size:14px;color:var(--p-hot);
  background:rgba(0,0,0,.45);border:1px solid var(--p-dim);border-radius:2px;
  padding:7px 9px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p-lit);box-shadow:var(--glow-soft)}
input[type=number]{font-size:15px}
textarea{resize:vertical;min-height:72px;line-height:1.5;font-size:12px}
select option{background:#07200f}
.row{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
@media(min-width:520px){.row.r2{grid-template-columns:repeat(2,minmax(0,1fr))}.row.r3{grid-template-columns:repeat(3,minmax(0,1fr))}.row.r4{grid-template-columns:repeat(4,minmax(0,1fr))}}
button.btn{cursor:pointer;letter-spacing:2px;text-align:center;background:rgba(60,255,142,.07);transition:.12s}
button.btn:hover{background:rgba(60,255,142,.2);border-color:var(--p-lit);color:#031307}
button.btn:active{transform:translateY(1px)}
button.btn.pri{border-color:var(--p-lit);box-shadow:var(--glow-soft)}
button.btn.sm{font-size:11px;padding:5px 8px;width:auto}
button.btn.danger:hover{background:rgba(255,80,51,.25);border-color:var(--rad);color:var(--p-hot)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:168px;overflow-y:auto;padding-right:2px}
.chip{font-family:var(--thai);font-size:12px;padding:5px 9px;border:1px solid var(--p-dim);border-radius:14px;cursor:pointer;color:var(--p-mid);background:rgba(0,0,0,.3);white-space:nowrap}
.chip:hover{border-color:var(--p-lit);color:var(--p-hot);box-shadow:var(--glow-soft)}
.chip b{font-weight:400;color:rgba(60,255,142,.6);font-family:var(--mono);font-size:10px;margin-left:4px}

/* ---------- DIAGNOSTICS ---------- */
ul.diag{list-style:none;font-size:12px;font-family:var(--thai);line-height:1.45}
ul.diag li{padding:7px 8px 7px 26px;position:relative;border-left:2px solid var(--p-dim);margin-bottom:6px;background:rgba(0,0,0,.25)}
ul.diag li::before{content:'›';position:absolute;left:9px;top:6px;font-family:var(--mono);font-size:14px}
ul.diag li.ok{border-left-color:var(--p-lit);color:var(--p-lit)}
ul.diag li.warn{border-left-color:var(--amber);color:var(--amber)}
ul.diag li.bad{border-left-color:var(--rad);color:var(--rad)}
ul.diag li b{font-weight:600}

canvas{width:100%;display:block;border:1px solid var(--p-dim);background:rgba(0,0,0,.35);border-radius:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--p-mid);margin-top:6px;letter-spacing:1px}
.legend s{text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.legend s::before{content:'';width:14px;height:2px;background:currentColor}
.legend s.dash::before{background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px)}

/* ---------- FOOTER STATUS ---------- */
footer{border-top:1px solid var(--p-dim);padding:6px 14px;display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--p-mid);letter-spacing:1px;position:relative;z-index:10;flex-wrap:wrap}
footer b{color:var(--p-lit);font-weight:400}
.blink{animation:bl 1.1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

.note{font-size:11px;color:var(--p-mid);font-family:var(--thai);line-height:1.55;margin-top:6px;overflow-wrap:anywhere}
.note b{color:var(--amber);font-weight:600}
.warnbox{border:1px solid var(--amber);color:var(--amber);padding:8px 10px;font-family:var(--thai);font-size:12px;line-height:1.5;border-radius:2px;background:rgba(255,176,0,.07);margin-top:8px}
.warnbox.rad{border-color:var(--rad);color:var(--rad);background:rgba(255,80,51,.07)}
code{font-family:var(--mono);font-size:11px;color:var(--amber);background:rgba(0,0,0,.5);padding:1px 4px;border-radius:2px}
pre{font-family:var(--mono);font-size:10.5px;color:var(--p-mid);background:rgba(0,0,0,.5);padding:8px;border:1px solid var(--p-dim);border-radius:2px;overflow-x:auto;line-height:1.5;margin-top:6px}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#04120a;border:1px solid var(--p-lit);color:var(--p-hot);padding:9px 16px;font-size:12px;letter-spacing:1px;z-index:200;opacity:0;transition:.25s;box-shadow:var(--glow);pointer-events:none;border-radius:2px;max-width:90vw;text-align:center;font-family:var(--thai)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- SEGMENTED OPTION CONTROL ---------- */
.seg{display:flex;gap:0;border:1px solid var(--p-dim);border-radius:2px;overflow:hidden;margin-top:3px}
.seg button{flex:1;background:rgba(0,0,0,.35);border:none;border-right:1px solid var(--p-dim);
  color:var(--p-mid);font-family:var(--thai);font-size:12px;padding:7px 4px;cursor:pointer;transition:.12s;white-space:nowrap}
.seg button:last-child{border-right:none}
.seg button:hover{background:rgba(60,255,142,.12);color:var(--p-hot)}
.seg button.on{background:rgba(60,255,142,.22);color:var(--p-hot);text-shadow:var(--glow)}
.seg button:focus-visible{outline:1px dashed var(--p-lit);outline-offset:-3px}

/* ---------- ITEM CONFIG PANEL ---------- */
#cfg{border:1px solid var(--p-lit);box-shadow:var(--glow-soft);padding:11px;border-radius:var(--r);background:linear-gradient(180deg,rgba(60,255,142,.08),rgba(0,0,0,.3))}
#cfg .cname{font-family:var(--thai);font-size:16px;color:var(--p-hot);text-shadow:var(--glow);line-height:1.3}
#cfg .cprev{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--p-dim);border:1px solid var(--p-dim);margin-top:10px}
#cfg .cprev div{background:var(--p-deep);padding:6px 4px;text-align:center}
#cfg .cprev s{text-decoration:none;display:block;font-size:8.5px;letter-spacing:1px;color:var(--p-mid)}
#cfg .cprev b{font-weight:400;font-size:16px;color:var(--p-hot)}
.qstep{display:flex;align-items:center;gap:8px;margin-top:3px}
.qstep b{font-weight:400;font-size:19px;color:var(--p-hot);min-width:34px;text-align:center}
.qstep button{width:34px;height:32px;flex:0 0 34px;font-size:16px;padding:0}

/* qty controls inside inventory rows */
ul.items li .qc{display:flex;gap:3px;align-items:center}
.qbtn{background:rgba(0,0,0,.4);border:1px solid var(--p-dim);color:var(--p-mid);width:20px;height:20px;
  line-height:1;cursor:pointer;border-radius:2px;font-family:var(--mono);font-size:12px;padding:0}
.qbtn:hover{border-color:var(--p-lit);color:var(--p-hot)}

/* ---------- ADVISOR ---------- */
.adv{border-left:3px solid var(--p-dim);background:rgba(0,0,0,.28);padding:9px 11px;margin-bottom:8px;border-radius:0 2px 2px 0}
.adv h3{font-size:12px;font-weight:600;font-family:var(--thai);margin-bottom:4px;letter-spacing:0;display:flex;gap:7px;align-items:baseline}
.adv h3 s{text-decoration:none;font-family:var(--mono);font-size:9px;letter-spacing:2px;opacity:.75}
.adv p{font-family:var(--thai);font-size:12px;line-height:1.55;color:var(--p-mid)}
.adv p b{color:var(--p-hot);font-weight:600}
.adv.ok{border-left-color:var(--p-lit)} .adv.ok h3{color:var(--p-lit)}
.adv.warn{border-left-color:var(--amber)} .adv.warn h3{color:var(--amber)} .adv.warn p b{color:var(--amber)}
.adv.bad{border-left-color:var(--rad)} .adv.bad h3{color:var(--rad)} .adv.bad p b{color:var(--rad)}
.adv ul{margin:6px 0 0 16px;font-family:var(--thai);font-size:12px;line-height:1.6;color:var(--p-mid)}
.adv ul li{margin-bottom:2px}
.adv ul li::marker{color:var(--p-dim)}

/* ---------- BURN PLAN ---------- */
.burn{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--p-dim);
  border-radius:2px;margin-bottom:7px;background:rgba(0,0,0,.25)}
.burn.best{border-color:var(--p-lit);box-shadow:var(--glow-soft);background:rgba(60,255,142,.07)}
.burn .bn{font-family:var(--thai);font-size:13px;color:var(--p-hot)}
.burn .bn s{text-decoration:none;display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--p-mid);margin-top:2px}
.burn .bt{text-align:right;white-space:nowrap}
.burn .bt em{font-style:normal;font-size:23px;color:var(--p-lit);text-shadow:var(--glow)}
.burn .bt u{text-decoration:none;font-size:10px;color:var(--p-mid);display:block;letter-spacing:1px}
.burn.hard .bt em{color:var(--amber);text-shadow:0 0 6px rgba(255,176,0,.5)}
.burn.impossible .bt em{color:var(--rad);font-size:16px}

/* ---------- MISC ---------- */
.pill{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:1px;border:1px solid var(--p-dim);
  border-radius:10px;padding:1px 7px;color:var(--p-mid);margin-left:6px;vertical-align:middle}
.pill.hot{border-color:var(--rad);color:var(--rad)}
.pill.mid{border-color:var(--amber);color:var(--amber)}
.streak{font-size:26px;color:var(--p-hot);text-shadow:var(--glow)}
.tmpl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px dotted rgba(30,148,85,.35);font-family:var(--thai);font-size:12.5px;color:var(--p-hot)}
.tmpl s{text-decoration:none;display:block;font-family:var(--mono);font-size:10px;color:var(--p-mid)}
.catbar{display:flex;gap:5px;overflow-x:auto;margin:8px 0 4px;scrollbar-width:none;padding-bottom:2px}
.catbar::-webkit-scrollbar{display:none}
.catbar button{flex:0 0 auto;background:rgba(0,0,0,.3);border:1px solid var(--p-dim);color:var(--p-mid);
  font-family:var(--thai);font-size:11.5px;padding:4px 10px;border-radius:12px;cursor:pointer;white-space:nowrap}
.catbar button.on{border-color:var(--p-lit);color:var(--p-hot);background:rgba(60,255,142,.14)}


.qstep input{width:86px;text-align:center;font-size:17px;padding:6px;flex:0 0 86px}
.chip.mine{border-color:var(--p-mid);color:var(--p-hot);background:rgba(60,255,142,.09)}
.chip.mine::before{content:'\2605';color:var(--amber);margin-right:5px;font-size:10px}
.tmpl{align-items:flex-start}
.tmpl .pill{margin-left:4px}

/* ---------- SUPPLEMENT CARDS ---------- */
.supp{border:1px solid var(--p-dim);border-radius:var(--r);margin-bottom:9px;background:rgba(0,0,0,.25);overflow:hidden}
.supp.took{border-color:var(--p-mid);background:rgba(60,255,142,.06)}
.supphead{display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center;padding:9px 11px}
.tick{width:26px;height:26px;flex:0 0 26px;border:1px solid var(--p-dim);background:rgba(0,0,0,.45);
  color:var(--p-lit);border-radius:3px;cursor:pointer;font-family:var(--mono);font-size:15px;line-height:1;padding:0}
.tick.on{border-color:var(--p-lit);background:rgba(60,255,142,.22);box-shadow:var(--glow-soft)}
.suppname{font-family:var(--thai);font-size:13.5px;color:var(--p-hot);line-height:1.25;min-width:0}
.suppname s{text-decoration:none;display:block;font-family:var(--mono);font-size:9.5px;color:var(--p-mid);letter-spacing:.5px;margin-top:2px}
.suppbody{padding:2px 11px 12px;border-top:1px dotted rgba(30,148,85,.4)}
.suppbody h4{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;color:var(--p-mid);font-weight:400;margin:10px 0 3px}
.suppbody p{font-family:var(--thai);font-size:12px;line-height:1.55;color:var(--p-lit)}
.suppbody p b{color:var(--p-hot)}
.suppbody ul{margin:4px 0 0 16px;font-family:var(--thai);font-size:12px;line-height:1.6;color:var(--amber)}
.suppbody ul li{margin-bottom:3px}
.suppbody ul li::marker{color:var(--p-dim)}
.suppbody ul li b{color:var(--rad)}
.cyc{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;padding:0 11px 9px}
.cyc span{font-family:var(--thai);font-size:11px;color:var(--p-mid);white-space:nowrap}
@media(max-width:520px){
  .supphead{grid-template-columns:auto 1fr auto;row-gap:6px}
  .supphead .pill{grid-column:2/4;justify-self:start;margin-left:0}
  .cyc{grid-template-columns:1fr;row-gap:6px}
}


.chip.est{border-style:dashed}
.chip.est b:last-child{color:var(--amber)}


.datenav{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:7px;align-items:center;margin-bottom:9px}
.datenav .btn{width:auto;padding:6px 11px}
.datenav button[disabled]{opacity:.3;pointer-events:none}
.dncur{font-family:var(--thai);font-size:13.5px;color:var(--p-hot);text-align:center;line-height:1.25;min-width:0}
.dncur s{text-decoration:none;display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--p-mid);margin-top:1px}
.dncur.past{color:var(--amber)}
.dncur.past s{color:var(--amber)}


/* checklist */
.ck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:flex-start;padding:9px 10px;margin-bottom:6px;
  border-left:3px solid var(--p-dim);background:rgba(0,0,0,.28);border-radius:0 2px 2px 0;cursor:pointer;transition:.12s}
.ck:hover{background:rgba(60,255,142,.07)}
.ck.p1{border-left-color:var(--rad)}
.ck.p2{border-left-color:var(--amber)}
.ck.p3{border-left-color:var(--p-dim)}
.ckbox{width:22px;height:22px;flex:0 0 22px;border:1px solid var(--p-dim);border-radius:2px;display:flex;
  align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;color:var(--p-lit);background:rgba(0,0,0,.4)}
.cktx{font-family:var(--thai);font-size:12.5px;line-height:1.45;color:var(--p-hot);min-width:0}
.ck.on{opacity:.45;border-left-color:var(--p-mid)}
.ck.on .ckbox{border-color:var(--p-lit);background:rgba(60,255,142,.22)}
.ck.on .cktx{text-decoration:line-through;color:var(--p-mid)}
/* day type */
.daytype{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:11px;
  border-top:1px solid var(--p-dim);padding-top:10px}
.dtlab{font-family:var(--thai);font-size:12px;color:var(--p-mid)}
.dtlab s{text-decoration:none;display:block;font-family:var(--mono);font-size:10px;color:var(--p-hot);letter-spacing:1px}
@media(max-width:520px){.daytype{grid-template-columns:minmax(0,1fr);row-gap:8px}.daytype .seg{max-width:none!important}}
/* price input */
.pxin{width:74px;padding:4px 6px;font-size:13px;text-align:right}


.rmck{display:flex;align-items:center;gap:9px;padding:7px 2px;font-family:var(--thai);font-size:12.5px;color:var(--p-hot);cursor:pointer}
.rmck input{width:18px;height:18px;flex:0 0 18px;accent-color:#3CFF8E;margin:0;padding:0}
#printHost{display:none}


/* ---------- COLLAPSIBLE ---------- */
.box>h2.colh{cursor:pointer;user-select:none;-webkit-user-select:none}
.box>h2.colh:hover{color:var(--p-lit)}
.box>h2 .chev{font-style:normal;font-size:11px;color:var(--p-lit);margin-left:auto;padding-left:8px;flex:0 0 auto}
.box.shut>*:not(h2){display:none!important}
.box.shut{padding-bottom:8px;opacity:.8}
.box.shut>h2{margin-bottom:0}
/* ---------- FLOATING NAV ---------- */
#fab{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:150;
  display:flex;flex-direction:column;gap:7px;align-items:flex-end}
#fab>button{width:42px;height:42px;border-radius:50%;border:1px solid var(--p-lit);
  background:rgba(4,18,10,.93);color:var(--p-lit);font-family:var(--mono);font-size:15px;cursor:pointer;
  box-shadow:var(--glow-soft),0 3px 12px rgba(0,0,0,.7);padding:0;line-height:1}
#fab>button:active{transform:translateY(1px)}
#fabMenu{display:none;position:absolute;right:0;bottom:52px;width:212px;max-height:64dvh;overflow-y:auto;
  background:#04120a;border:1px solid var(--p-lit);border-radius:4px;padding:6px;
  box-shadow:var(--glow-soft),0 8px 26px rgba(0,0,0,.85)}
#fab.open #fabMenu{display:block}
#fabMenu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--p-mid);
  font-family:var(--mono);font-size:12px;letter-spacing:1px;padding:7px 9px;cursor:pointer;border-radius:2px}
#fabMenu button:hover{background:rgba(60,255,142,.14);color:var(--p-hot)}
#fabMenu button.on{color:var(--p-hot);background:rgba(60,255,142,.1)}
#fabMenu .fabsec{border-top:1px solid var(--p-dim);margin-top:5px;padding-top:5px}
#fabMenu .fabsec button{font-family:var(--thai);font-size:11.5px;letter-spacing:0;color:var(--p-dim)}
#fabMenu .fabsec button:hover{color:var(--p-lit)}
/* ---------- POSE ART ---------- */
.posewrap{display:flex;justify-content:center;padding:4px 0 8px;color:var(--p-lit)}
.posewrap.sm{padding:0 0 6px}
.pose{width:96px;height:auto;filter:drop-shadow(0 0 5px rgba(60,255,142,.45))}
.posewrap.sm .pose{width:60px}
.pose .pA,.pose .pB{animation:poseSwap 1.5s steps(1) infinite}
.pose .pB{animation-delay:.75s}
@keyframes poseSwap{0%,49%{opacity:1}50%,100%{opacity:0}}
.pose{animation:poseHop 1.5s ease-in-out infinite}
@keyframes poseHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mascotSvg{filter:drop-shadow(0 0 6px rgba(60,255,142,.5))}
/* ---------- QUICK LINKS ---------- */
.qlrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:6px 2px;border-bottom:1px dotted rgba(30,148,85,.35)}
.qln{font-family:var(--thai);font-size:12.5px;color:var(--p-hot);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


.dncur.plan{color:#9BDFFF}
.dncur.plan s{color:#5AC8FF}
input[type=file]{font-family:var(--mono);font-size:11px;padding:6px;color:var(--p-mid)}
input[type=file]::file-selector-button{font-family:var(--mono);font-size:11px;background:rgba(60,255,142,.1);
  color:var(--p-hot);border:1px solid var(--p-dim);border-radius:2px;padding:5px 9px;margin-right:8px;cursor:pointer}


/* ---------- KAOMOJI AVATAR ---------- */
.kao{animation:kaoBob 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes kaoBob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(-1.5deg)}}
.kao .blink{transform-box:fill-box;transform-origin:center;animation:kaoBlink 4.4s infinite}
@keyframes kaoBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.kao.rad{animation:kaoShake .5s ease-in-out infinite}
@keyframes kaoShake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-2.5px) rotate(-2deg)}75%{transform:translateX(2.5px) rotate(2deg)}}
.kao .sweat{transform-box:fill-box;transform-origin:center;animation:kaoSweat 2.4s ease-in infinite}
@keyframes kaoSweat{0%{opacity:0;transform:translateY(-5px) scale(.7)}22%{opacity:1;transform:translateY(0) scale(1)}
  78%{opacity:1;transform:translateY(11px) scale(1)}100%{opacity:0;transform:translateY(16px) scale(.8)}}
.kao .spark{transform-box:fill-box;transform-origin:center;animation:kaoSpark 1.9s ease-in-out infinite}
@keyframes kaoSpark{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
.kao .anger{transform-box:fill-box;transform-origin:center;animation:kaoAnger .9s ease-in-out infinite}
@keyframes kaoAnger{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
.kaotext{font-family:var(--mono);font-size:13px;letter-spacing:1px;color:var(--p-lit);
  text-align:center;margin-top:2px;text-shadow:var(--glow);white-space:nowrap}
.avprev{display:flex;gap:10px;justify-content:center;margin-top:10px;color:var(--p-lit)}
.avprev svg{width:56px;height:auto}


/* avatar extras */
.kao .zzz text{animation:kaoZ 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.kao .zzz .z2{animation-delay:.45s}.kao .zzz .z3{animation-delay:.9s}
@keyframes kaoZ{0%{opacity:0;transform:translateY(4px) scale(.6)}30%{opacity:1}70%{opacity:.9;transform:translateY(-6px) scale(1)}100%{opacity:0;transform:translateY(-12px) scale(1.1)}}
.kao .steam path{animation:kaoSteam 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
.kao .steam path:nth-child(2){animation-delay:.7s}
@keyframes kaoSteam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-8px)}}
.kao.celebrate{animation:kaoJump 1.1s ease-in-out infinite}
@keyframes kaoJump{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.06,.94)}55%{transform:translateY(-11px) scale(.96,1.05)}80%{transform:translateY(0) scale(1.04,.96)}}
.kao.workout{animation:kaoBob 1.1s ease-in-out infinite}
.kao svg,svg.hop{will-change:transform}
svg.hop{animation:kaoHop .5s ease-out 1!important}
@keyframes kaoHop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-10px) scale(.94,1.08)}60%{transform:translateY(0) scale(1.07,.93)}100%{transform:translateY(0) scale(1,1)}}
#mascot{position:relative;cursor:pointer}
#kaobub{position:absolute;left:50%;bottom:100%;transform:translateX(-50%) translateY(6px);
  background:#04120a;border:1px solid var(--p-lit);border-radius:10px;padding:5px 10px;
  font-family:var(--thai);font-size:11.5px;color:var(--p-hot);white-space:nowrap;
  box-shadow:var(--glow-soft);opacity:0;pointer-events:none;z-index:30;transition:none}
#kaobub.show{animation:bubPop 2.8s ease forwards}
@keyframes bubPop{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.85)}
  12%{opacity:1;transform:translateX(-50%) translateY(-2px) scale(1)}
  80%{opacity:1;transform:translateX(-50%) translateY(-2px) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-6px) scale(.95)}}
/* live digestion strip */
.dgnow{margin-top:11px;border-top:1px solid var(--p-dim);padding-top:9px}
.dgnow.done .dgv{color:var(--p-lit)}
.dgtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.dgn{font-family:var(--thai);font-size:12.5px;color:var(--p-hot);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dgn s{text-decoration:none;font-family:var(--mono);font-size:9.5px;color:var(--p-mid);letter-spacing:.5px}
.dgv{font-family:var(--mono);font-size:13px;color:var(--amber);white-space:nowrap}
.dgsub{font-family:var(--thai);font-size:11px;color:var(--p-mid);margin-top:5px;line-height:1.5}
.dgsub b{color:var(--p-hot)}


.quickmodes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qm{font-family:var(--thai);font-size:12.5px;padding:7px 14px;border-radius:16px;cursor:pointer;
  border:1px solid var(--p-dim);background:rgba(0,0,0,.3);color:var(--p-mid)}
.qm.on{border-color:var(--amber);color:var(--amber);background:rgba(255,176,0,.12);box-shadow:0 0 8px rgba(255,176,0,.25)}
.wrow{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin:2px 0 6px}
.wbig{font-family:var(--mono);font-size:27px;color:var(--p-hot);text-shadow:var(--glow);line-height:1}
.wu{font-family:var(--mono);font-size:11px;color:var(--p-mid);letter-spacing:2px}
.wsub{font-family:var(--thai);font-size:11.5px;color:var(--p-mid);margin-left:2px}
.wsub b{color:var(--p-hot)}


.suppbody h4,.adv h4{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;color:var(--p-mid);font-weight:400;margin:9px 0 3px}
.adv h4{color:var(--p-hot)}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media(max-width:520px){
  body{padding:4px}
  #chassis{padding:7px;border-radius:11px}
  .bignum em{font-size:34px}
  nav button{font-size:12px;min-width:66px;letter-spacing:1px}
  main{padding:10px}
}

/* ---------- PRINT / PDF ---------- */
@media print{
  #fab{display:none!important}
  body{background:#fff!important;color:#000!important;padding:0!important;display:block!important}
  #chassis,#toast{display:none!important}
  body.printing #printHost{display:block!important}
  #printHost{font-family:'IBM Plex Sans Thai',sans-serif;color:#000;padding:14mm 12mm;max-width:100%}
  #printHost h1{font-size:17pt;margin:0 0 3mm;border-bottom:2px solid #000;padding-bottom:2mm}
  #printHost h2{font-size:12pt;margin:6mm 0 2mm;border-left:3px solid #000;padding-left:3mm}
  #printHost p{font-size:10pt;line-height:1.6;margin:0 0 2mm}
  #printHost p.sub{font-size:9pt;color:#444}
  #printHost table{width:100%;border-collapse:collapse;margin:2mm 0 3mm;font-size:9.5pt}
  #printHost th,#printHost td{border:1px solid #999;padding:1.6mm 2.5mm;text-align:left}
  #printHost th{background:#eee;font-weight:600}
  #printHost ul{font-size:9.5pt;line-height:1.6;margin:0 0 3mm 6mm}
  #printHost li{margin-bottom:1.5mm}
  #printHost p.sig{margin-top:12mm;font-size:10pt}
  @page{margin:0}
}

 </div>

<script>
/* ==========================================================
   ART — SVG รายละเอียดสูง + แอนิเมชัน
   ใช้ currentColor ทั้งหมด เพื่อให้เปลี่ยนสีตามสถานะได้
   ========================================================== */

/* ---------- KAOMOJI CHIBI ---------- */
const KAO_TEXT = {
  good:'( ･ω･ )', warn:'( ￣ω￣;)', rad:'( &gt;﹏&lt; )',
  celebrate:'✧ ヽ( ⁀ω⁀ )ﾉ ✧', full:'( ＾ω＾ )', workout:'( ･`ω´･ )', sleepy:'( －ω－ ) zZ'
};
/* คำพูดตามสถานะ — สุ่มตอนแตะตัวละคร */
const KAO_SAY = {
  good:['วันนี้ไปได้สวยนะ','เก่งมาก ทำต่อไป','ตัวเลขสวยแบบนี้ชอบ','อย่าลืมดื่มน้ำด้วย'],
  celebrate:['ครบทุกข้อแล้ว!','วันนี้เพอร์เฟกต์เลย','เยี่ยมมาก ภูมิใจนะ'],
  full:['อิ่มแล้ว ขอพักแป๊บ','อร่อยมั้ยเมื่อกี้','ย่อยอยู่ อย่าเพิ่งนอนนะ'],
  workout:['เพิ่งขยับมา เท่มาก','เหงื่อออกแล้ว ดี!','กล้ามมาแน่'],
  sleepy:['ง่วงแล้ว...','ดึกแล้วนะ ไปนอนเถอะ','พรุ่งนี้ยังต้องตื่นเช้า'],
  warn:['ใกล้เต็มงบแล้วนะ','ระวังนิดนึง','เหลืออีกไม่เยอะแล้ว'],
  rad:['เกินงบแล้วน้า','ไม่เป็นไร พรุ่งนี้เอาใหม่','วันนี้แค่วันเดียว ไม่พัง']
};
function kaoSay(state){
  const a = KAO_SAY[state] || KAO_SAY.good;
  return a[Math.floor(Math.random()*a.length)];
}
function mascotKao(state){
  const W = 'stroke-width="2.2"', T = 'stroke-width="1.6"';
  let eyes, mouth, extra = '', blush = '', arms = null, body = null;

  const BLUSH_ON = '<g opacity=".55"><ellipse cx="28" cy="63" rx="7" ry="4"/><ellipse cx="92" cy="63" rx="7" ry="4"/>'
    + '<path d="M24 62h8M22 65h8M88 62h8M86 65h8" '+T+'/></g>';

  if(state === 'celebrate'){
    eyes = '<path d="M35 55q7.5-11 15 0M70 55q7.5-11 15 0" fill="none" '+W+'/>';
    mouth = '<path d="M50 66q10 12 20 0q-10 5-20 0z" fill="currentColor" stroke="none"/>'
      + '<path d="M50 66q10 12 20 0" fill="none" '+W+'/>';
    blush = BLUSH_ON;
    arms = '<path d="M42 100c-9-6-14-14-15-24" '+W+'/><path d="M78 100c9-6 14-14 15-24" '+W+'/>';
    extra = '<g class="spark" fill="currentColor" stroke="none">'
      + '<path d="M108 20l1.9 5 5 1.9-5 1.9L108 34l-1.9-5.2-5-1.9 5-1.9z"/>'
      + '<path d="M9 30l1.5 4 4 1.5-4 1.5L9 41l-1.5-4-4-1.5 4-1.5z" opacity=".8"/>'
      + '<path d="M100 62l1.2 3.2 3.2 1.2-3.2 1.2L100 71l-1.2-3.4-3.2-1.2 3.2-1.2z" opacity=".6"/></g>';
  } else if(state === 'full'){
    eyes = '<path d="M36 54q7-8 14 0M70 54q7-8 14 0" fill="none" '+W+'/>';
    mouth = '<path d="M53 67c2 4.5 5.5 4.5 7 .5 1.5 4 5 4 7-.5" fill="none" '+W+'/>';
    blush = BLUSH_ON;
    body = 'full';
    arms = '<path d="M42 106c-7 1-11 5-12 10" '+W+'/><path d="M78 106c7 1 11 5 12 10" '+W+'/>';
    extra = '<g class="steam" opacity=".6" '+T+'><path d="M96 52q5-5 0-10t0-9"/><path d="M105 56q4-4 0-8t0-7"/></g>';
  } else if(state === 'workout'){
    eyes = '<path d="M35 50l14 5-14 5M85 50l-14 5 14 5" fill="none" '+W+'/>';
    mouth = '<path d="M50 68q10 9 20 0" fill="none" '+W+'/>';
    blush = BLUSH_ON;
    arms = '<path d="M42 100c-10-2-15-8-14-16" '+W+'/><path d="M78 100c10-2 15-8 14-16" '+W+'/>'
      + '<circle cx="27" cy="82" r="4.5" '+T+'/><circle cx="93" cy="82" r="4.5" '+T+'/>';
    extra = '<path class="sweat" d="M107 30c0 0-6 8.5-6 12a6 6 0 0012 0c0-3.5-6-12-6-12z" fill="none" '+T+'/>'
      + '<path d="M22 22h76" '+T+' opacity=".7"/><path d="M22 22v6M98 22v6" '+T+' opacity=".7"/>';
  } else if(state === 'sleepy'){
    eyes = '<path d="M36 54q7 6 14 0M70 54q7 6 14 0" fill="none" '+W+'/>';
    mouth = '<ellipse cx="60" cy="70" rx="5" ry="6" fill="none" '+W+'/>';
    blush = '<g opacity=".35"><ellipse cx="28" cy="63" rx="6" ry="3.4"/><ellipse cx="92" cy="63" rx="6" ry="3.4"/></g>';
    arms = '<path d="M42 104c-8 2-12 7-13 13" '+W+'/><path d="M78 104c8 2 12 7 13 13" '+W+'/>';
    extra = '<g class="zzz" fill="currentColor" stroke="none" font-family="monospace">'
      + '<text x="98" y="30" font-size="13" class="z1">z</text>'
      + '<text x="106" y="20" font-size="10" class="z2">z</text>'
      + '<text x="93" y="16" font-size="8" class="z3">z</text></g>';
  } else if(state === 'good'){
    eyes = '<g class="blink">'
      + '<ellipse cx="43" cy="52" rx="6.5" ry="7.5" fill="currentColor" stroke="none"/>'
      + '<ellipse cx="77" cy="52" rx="6.5" ry="7.5" fill="currentColor" stroke="none"/>'
      + '<circle cx="45.4" cy="49.4" r="2.2" fill="#04120A" stroke="none"/>'
      + '<circle cx="79.4" cy="49.4" r="2.2" fill="#04120A" stroke="none"/></g>';
    mouth = '<path d="M51 68c2.5 5.5 6.5 5.5 9 .5 2.5 5 6.5 5 9-.5" fill="none" '+W+'/>';
    blush = '<g opacity=".55"><ellipse cx="28" cy="63" rx="7" ry="4"/><ellipse cx="92" cy="63" rx="7" ry="4"/>'
      + '<path d="M24 62h8M22 65h8M88 62h8M86 65h8" '+T+'/></g>';
    extra = '<g class="spark" fill="currentColor" stroke="none">'
      + '<path d="M108 24l1.8 4.8 4.8 1.8-4.8 1.8L108 37l-1.8-4.6-4.8-1.8 4.8-1.8z"/>'
      + '<path d="M9 36l1.3 3.4 3.4 1.3-3.4 1.3L9 45.4l-1.3-3.4L4.3 40.7l3.4-1.3z" opacity=".7"/></g>';
  } else if(state === 'warn'){
    eyes = '<path d="M35 53h15M70 53h15" fill="none" '+W+' stroke-linecap="round"/>';
    mouth = '<path d="M52 69q4 3 8 0t8 0" fill="none" '+W+'/>';
    blush = '<g opacity=".4"><ellipse cx="28" cy="63" rx="6" ry="3.4"/><ellipse cx="92" cy="63" rx="6" ry="3.4"/></g>';
    extra = '<path class="sweat" d="M107 30c0 0-6 8.5-6 12a6 6 0 0012 0c0-3.5-6-12-6-12z" fill="none" '+T+'/>';
  } else {
    eyes = '<path d="M34 46l14 9-14 9M86 46l-14 9 14 9" fill="none" '+W+' stroke-linecap="round"/>';
    mouth = '<path d="M49 70q4-5 7 0t7 0 7-1" fill="none" '+W+'/>';
    extra = '<g class="anger" '+T+' fill="none">'
      + '<path d="M101 14l6 6M107 14l-6 6M101 24l6 6M107 24l-6 6"/>'
      + '<path d="M97 19h14M104 12v14" opacity=".5"/></g>'
      + '<path class="sweat" d="M11 36c0 0-5.5 7.5-5.5 11a5.5 5.5 0 0011 0c0-3.5-5.5-11-5.5-11z" fill="none" '+T+'/>';
  }

  return '<svg viewBox="0 0 120 152" aria-hidden="true" class="kao '+state+'">'
  + '<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">'
    /* เงาใต้ตัว */
    + '<ellipse cx="60" cy="146" rx="26" ry="3.5" opacity=".25"/>'
    /* ตัว */
    + (body === 'full'
        ? '<path d="M42 92h36c4 12 6 20 5 27a9 9 0 01-9 8H46a9 9 0 01-9-8c-1-7 1-15 5-27z" '+W+'/>'
          + '<path d="M50 112q10 6 20 0" '+T+' opacity=".55"/>'
        : '<path d="M44 92h32l5 27a7 7 0 01-7 8H46a7 7 0 01-7-8z" '+W+'/>')
    + '<path d="M52 96h16" '+T+' opacity=".6"/>'
    /* แขน */
    + (arms !== null ? arms : state === 'good'
        ? '<path d="M42 104c-8-3-13-9-14-17" '+W+'/><path d="M78 104c8-3 13-9 14-17" '+W+'/>'
        : state === 'warn'
        ? '<path d="M42 104c-8 2-12 7-13 13" '+W+'/><path d="M78 104c8 2 12 7 13 13" '+W+'/>'
        : '<path d="M42 102c-9 2-15 8-17 16" '+W+'/><path d="M78 102c9 2 15 8 17 16" '+W+'/>')
    /* ขา */
    + '<path d="M50 127v9M70 127v9" '+W+'/>'
    + '<ellipse cx="49" cy="140" rx="8" ry="4.5" '+W+'/>'
    + '<ellipse cx="71" cy="140" rx="8" ry="4.5" '+W+'/>'
    /* หัว */
    + '<path d="M60 10C36 10 20 26 20 48s16 40 40 40 40-18 40-40S84 10 60 10z" '+W+'/>'
    /* ผมหน้าม้า + อาโฮเงะ */
    + '<path d="M25 40c6-16 19-25 35-25s29 9 35 25c-7-7-16-9-24-6-4 2-7 4-11 4s-7-2-11-4c-8-3-17-1-24 6z" fill="currentColor" stroke="none" opacity=".9"/>'
    + '<path d="M57 12c-1-7 2-11 7-12-3 4-2 8 2 10" '+T+'/>'
    + eyes + mouth + blush + extra
  + '</g></svg>';
}
function mascot(state){
  return (S.ui && S.ui.avatar === 'classic') ? mascotClassic(state) : mascotKao(state);
}
function mascotFace(state){
  if(S.ui && S.ui.avatar === 'classic') return '';
  return '<div class="kaotext">'+(KAO_TEXT[state]||KAO_TEXT.good)+'</div>';
}

/* ---------- MASCOT (คลาสสิก) ---------- */
function mascotClassic(state){
  const S1 = 'stroke-width="2"', S2 = 'stroke-width="1.4"', S3 = 'stroke-width="1"';
  /* ตา / ปาก ตามสถานะ */
  let face;
  if(state === 'rad'){
    face = '<g '+S1+'><path d="M40 40l7 6M47 40l-7 6M63 40l7 6M70 40l-7 6"/>'
      + '<path d="M46 60q9-7 18 0"/><path d="M52 62v5a3 3 0 006 0v-5"/></g>'
      + '<path d="M36 33q5-4 11-1M64 32q6-3 11 1" fill="none" '+S2+'/>';
  } else if(state === 'warn'){
    face = '<g '+S1+'><path d="M39 43h9M62 43h9"/><path d="M47 60h16"/></g>'
      + '<path d="M37 34q6-2 11 0M62 34q5-2 11 0" fill="none" '+S2+'/>';
  } else {
    face = '<g><ellipse cx="43.5" cy="42" rx="4.6" ry="5.2" fill="currentColor"/>'
      + '<ellipse cx="66.5" cy="42" rx="4.6" ry="5.2" fill="currentColor"/>'
      + '<circle cx="45.2" cy="40.2" r="1.5" fill="#04120A"/><circle cx="68.2" cy="40.2" r="1.5" fill="#04120A"/></g>'
      + '<path d="M42 56q13 12 26 0" fill="none" '+S1+' stroke-linecap="round"/>'
      + '<path d="M46 62q9 4 17 0" fill="none" '+S3+'/>'
      + '<path d="M36 33q6-5 12-1M62 32q7-4 12 1" fill="none" '+S2+'/>';
  }
  /* แขน */
  const arms = state === 'good'
    ? /* ชูนิ้วโป้ง */
      '<path d="M34 78C26 76 20 70 18 62" fill="none" '+S1+'/>'
      + '<path d="M18 62c-1-4 1-7 4-7s4 3 3 6" fill="none" '+S1+'/>'
      + '<path d="M13 60c-3 1-4 5-2 8s6 4 9 2l4-3-1-9-6-1z" fill="none" '+S1+'/>'
      + '<path d="M76 78c8 3 13 9 15 17" fill="none" '+S1+'/>'
      + '<path d="M91 95a4 4 0 108 0 4 4 0 10-8 0" fill="none" '+S2+'/>'

const Store = (function(){
  const KEY = 'nutriboy3000_v1';
  const hasWS = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');
  let mem = null, mode = hasWS ? 'cloud' : 'local';
  return {
    mode: function(){ return mode; },
    load: async function(){
      if (hasWS){ try { const r = await window.storage.get(KEY); if (r && r.value) return JSON.parse(r.value); } catch(e){} }
      try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch(e){ mode='memory'; }
      return mem;
    },
    save: async function(o){
      const s = JSON.stringify(o);
      if (hasWS){ try { await window.storage.set(KEY, s); return true; } catch(e){} }
      try { localStorage.setItem(KEY, s); return true; } catch(e){ mem = o; mode='memory'; return false; }
    }
  };
})();

const SIZES = { half:{label:'ครึ่งเดียว', m:.6}, normal:{label:'ธรรมดา', m:1}, special:{label:'พิเศษ', m:1.4} };
const SWEETS = { none:{label:'ไม่หวาน', m:0}, less:{label:'หวานน้อย', m:.5}, normal:{label:'หวานปกติ', m:1}, extra:{label:'หวานมาก', m:1.4} };
function hasTag(f, t){ return (f.tag || '').indexOf(t) >= 0; }
function variant(f, o){
  const sm = SIZES[o.size] ? SIZES[o.size].m : 1;
  const it = { n:f.n, u:f.u,
    kcal:f.kcal*sm, p:f.p*sm, f:f.f*sm, c:f.c*sm,
    sug:(f.sug||0)*sm, na:(f.na||0)*sm, fib:(f.fib||0)*sm, k:(f.k||0)*sm };
  if(hasTag(f,'sweet') && f.sa > 0 && o.sweet && o.sweet !== 'normal'){
    const delta = f.sa * sm * (SWEETS[o.sweet].m - 1);   /* negative when reduced */
    it.sug = Math.max(0, it.sug + delta);
    it.c   = Math.max(0, it.c + delta);
    it.kcal = Math.max(0, it.kcal + delta*4);
  }
  const bits = [];
  if(hasTag(f,'size') && o.size !== 'normal') bits.push(SIZES[o.size].label);
  if(hasTag(f,'sweet') && o.sweet !== 'normal') bits.push(SWEETS[o.sweet].label);
  if(bits.length) it.n = f.n + ' (' + bits.join(', ') + ')';
  return it;
}

/* ---------- MATH ENGINE ---------- */
function bmr(){
  const p = S.profile;
  const base = 10*p.weight + 6.25*p.height - 5*p.age;
  return p.sex === 'M' ? base + 5 : base - 161;
}
function kcalPerMin(type, intensity){
  return EXER[type].met[intensity] * 3.5 * S.profile.weight / 200;
}
function exKcal(type, mins, intensity){ return kcalPerMin(type, intensity) * mins; }
function sumEx(d){ return d.ex.reduce(function(a,x){ return a + x.kcal; }, 0); }
function totals(k){
  const d = day(k); const t = { kcal:0,p:0,f:0,c:0,sug:0,na:0,fib:0,k:0 };
  d.foods.forEach(function(x){
    const q = x.q || 1;
    t.kcal += x.kcal*q; t.p += x.p*q; t.f += x.f*q; t.c += x.c*q;
    t.sug += (x.sug||0)*q; t.na += (x.na||0)*q; t.fib += (x.fib||0)*q; t.k += (x.k||0)*q;
  });
  return t;
}
/* MODE A: BMR × baseFactor + Apple Watch Active Energy */
function budget(k){
  const d = day(k);
  const base = bmr() * S.profile.baseFactor;
  const manual = S.profile.watchCovers ? 0 : sumEx(d);
  return base + (d.watch || 0) + manual + feverAdj(k);
}
function net(k){ return budget(k) - totals(k).kcal; }
function hasData(k){ const d = S.days[k]; return !!(d && (d.foods.length || d.watch || d.ex.length || d.weight || d.sleep)); }
/* วันที่ "บันทึกอาหารจริง" เท่านั้น — ใช้กับค่าเฉลี่ย/ขาดดุล/คาลิเบรต
   เพราะวันที่นำเข้าจาก Health จะมีน้ำหนักกับ Active Energy แต่ไม่มีอาหาร
   ถ้านับรวมจะกลายเป็น "ขาดดุลมหาศาล" ทั้งที่แค่ไม่ได้จด */
function hasFood(k){ const d = S.days[k]; return !!(d && d.foods && d.foods.length); }
function loggedDays(n){
  const out = []; let k = today();
  for(let i=0;i<90 && out.length<n;i++){ if(hasFood(k)) out.push(k); k = shiftKey(k,-1); }
  return out;
}
function avgNet(n){
  const ks = loggedDays(n||7); if(!ks.length) return null;
  return ks.reduce(function(a,k){ return a + net(k); },0) / ks.length;
}
function kgPerWeek(){ const a = avgNet(7); if(a===null) return null; return -(a*7)/7700; }
function macroTargets(k){
  k = k || today();
  const p = S.profile, w = p.weight;
  const pt = p.proteinPerKg * w;
  let ft = p.fatPerKg * w;
  const bud = budget(k) - deficitFor(k);
  /* วันพัก: ย้ายพลังงานจากคาร์บไปไขมันบางส่วน เพราะไม่ต้องเติมไกลโคเจน */
  if(p.cycleOn && !isTrainDay(k)) ft = ft * 1.25;
  const ct = Math.max(50, (bud - pt*4 - ft*9) / 4);
  return { p:pt, f:ft, c:ct, kcal:bud, train:isTrainDay(k) };
}
/* ---------- TRAINING / REST DAY ---------- */
function isTrainDay(k){
  k = k || today();
  const d = S.days[k];
  if(d && d.dayType) return d.dayType === 'train';        /* ผู้ใช้กำหนดเอง */
  if(!S.profile.autoTrain) return false;
  if(!d) return false;
  return sumEx(d) > 0 || (d.watch||0) >= 250;             /* เดาจากกิจกรรมจริง */
}
function dayTypeOf(k){
  const d = S.days[k||today()];
  return { train:isTrainDay(k), manual:!!(d && d.dayType) };
}
function isSick(){ return !!S.profile.sickMode; }
function sickRec(k){ const d = day(k||today()); if(!d.sick) d.sick = {}; return d.sick; }
/* พลังงานที่เพิ่มขึ้นเมื่อมีไข้ ~10–13% ต่อ 1°C เหนือ 37 */
function feverAdj(k){
  k = k || today();
  const d = S.days[k];
  if(!isSick() || !d || !d.sick || !d.sick.temp) return 0;
  const t = +d.sick.temp;
  if(!(t > 37.2)) return 0;
  return Math.min(bmr()*0.45, bmr() * 0.11 * (t - 37));

/* ---------- WATER (ml) ---------- */
function waterMl(k){
  const d = day(k||today());
  if(d.waterMl === undefined || d.waterMl === null){
    d.waterMl = (d.water || 0) * 250;          /* ย้ายข้อมูลเก่าจากแก้ว -> ml */
  }
  return d.waterMl;
}
function addWater(ml, k){
  const d = day(k||today());
  d.waterMl = Math.max(0, waterMl(k) + ml);
  d.water = Math.round(d.waterMl/250);          /* คงค่าเก่าไว้ให้ระบบอื่นที่ยังอ้างถึง */
}
function waterGoalMl(k){
  k = k || today();
  const p = S.profile, d = S.days[k] || {};
  let ml = p.weight * (p.mlPerKg || 30);
  const exMin = (d.ex||[]).reduce(function(a,x){ return a + (x.type==='intim'?0:x.mins); }, 0);
  if(exMin > 0) ml += Math.min(1000, exMin * 12);              /* ~350–700 ml ต่อการออกกำลังกาย */
  if((d.watch||0) >= 400) ml += 250;
  if(p.hotClimate) ml += 400;                                   /* อากาศร้อน/เดินโรงงาน */
  if(isSick()){
    ml += 400;
    const sk = d.sick || {};
    if(sk.temp && sk.temp > 37.2) ml += Math.round((sk.temp - 37) * 250);
    if(sk.sym && sk.sym.diarrhea) ml += 600;
    if(sk.sym && sk.sym.vomit) ml += 400;
  }
  return Math.round(ml/50)*50;
}

function mlToGulp(ml){ return Math.round(ml / gulp()); }
function wGoal(){ return Math.round(waterGoalMl()/250); }   /* ค่าเทียบเท่าแก้ว สำหรับโค้ดเดิม */
function waterPct(k){ return clamp(waterMl(k)/Math.max(1,waterGoalMl(k))*100, 0, 100); }
function sickDays(){
  const f = S.profile.sickSince;
  if(!f) return 0;

function deficitFor(k){
  const p = S.profile;
  if(p.sickMode) return 0;                        /* ป่วย = ไม่ลด รักษาน้ำหนักไว้ก่อน */
  if(p.travelMode) return 0;                      /* โหมดรักษาน้ำหนัก */
  if(!p.cycleOn) return p.targetDeficit;
  return isTrainDay(k) ? p.trainDeficit : p.restDeficit;

function streak(){

/* auto-calibration of real TDEE from observed weight change */
function calibrate(){
  const ks = [];
  for(let i=0;i<60;i++){ const k = shiftKey(today(),-i); if(hasFood(k)) ks.push(k); }
  if(ks.length < 10) return null;
  const wk = ks.filter(function(k){ return S.days[k].weight; });
  if(wk.length < 2) return null;
  const newest = wk[0], oldest = wk[wk.length-1];
  const spanDays = Math.round((new Date(newest+'T12:00:00') - new Date(oldest+'T12:00:00'))/86400000);
  if(spanDays < 10) return null;
  const inSpan = ks.filter(function(k){ return k <= newest && k >= oldest; });
  if(inSpan.length < spanDays*0.6) return null;
  const avgIn = inSpan.reduce(function(a,k){ return a + totals(k).kcal; },0)/inSpan.length;
  const avgWatch = inSpan.reduce(function(a,k){ return a + (S.days[k].watch||0); },0)/inSpan.length;
  const dW = S.days[newest].weight - S.days[oldest].weight;
  const realTDEE = avgIn - (dW*7700)/spanDays;
  /* กันค่าที่เป็นไปไม่ได้ (เช่น ช่วงที่จดอาหารไม่ครบ) */
  const B0 = bmr();
  if(!isFinite(realTDEE) || realTDEE < B0*0.8 || realTDEE > B0*3.2) return null;
  const modelTDEE = bmr()*S.profile.baseFactor + avgWatch;
  const impliedFactor = (realTDEE - avgWatch)/bmr();
  return { days:spanDays, n:inSpan.length, avgIn:avgIn, dW:dW,
           real:realTDEE, model:modelTDEE, factor:clamp(impliedFactor, 1.0, 2.0) };
}

              'กินผัก/ผลไม้ที่มีโพแทสเซียม เช่น กล้วย ฝรั่ง มะเขือเทศ ช่วยขับโซเดียม',
              'ก๋วยเตี๋ยวครั้งหน้า สั่งแบบไม่ซดน้ำ ตัดโซเดียมได้เกินครึ่ง'] });
      tips.push('คุมโซเดียมให้ต่ำกว่า '+p.naLimit+' mg');
    } else if(t.na > p.naLimit){
      out.push({ lv:'warn', tag:'SODIUM', title:'โซเดียมเกินเพดาน — '+r0(t.na)+' mg',
        body:'เกินมา <b>'+r0(t.na-p.naLimit)+' mg</b> จาก '+src+' ยังไม่ถึงขั้นน่ากลัว แต่ถ้าพรุ่งนี้น้ำหนักขึ้นนิดหน่อย ให้รู้ไว้ว่าเป็นน้ำที่ร่างกายกักไว้',
        tips:['ดื่มน้ำเพิ่มอีก 1–2 แก้ว','มื้อถัดไปเลือกของย่าง/นึ่ง แทนของต้มน้ำซุป'] });
    } else if(t.kcal > 0){
      out.push({ lv:'ok', tag:'SODIUM', title:'โซเดียม '+r0(t.na)+' mg อยู่ในเกณฑ์', body:'ต่ำกว่าเพดาน '+p.naLimit+' mg — อาหารไทยทำได้ยากนะ วันนี้ทำได้ดี', tips:[] });
    }
  }

  /* --- SUGAR --- */
  if(t.sug > p.sugLimit){
    const src = nameList(topBy(k,'sug',2), ' g');
    const lv = t.sug > p.sugLimit*1.5 ? 'bad' : 'warn';
    out.push({ lv:lv, tag:'SUGAR', title:'น้ำตาล '+r0(t.sug)+' g เกินเพดาน',
      body:'เพดานที่ตั้งไว้คือ '+p.sugLimit+' g/วัน ตัวการหลักคือ '+src
         + ' น้ำตาล '+r0(t.sug)+' g = <b>'+r0(t.sug*4)+' kcal</b> ที่แทบไม่ให้ความอิ่มเลย กินแล้วหิวเร็วกว่าเดิม',
      tips:['เครื่องดื่มครั้งหน้ากดตัวเลือก <b>หวานน้อย</b> ในแอป — ตัดได้ราวครึ่งหนึ่งทันที',
            'ชานมไข่มุก 1 แก้ว ≈ ข้าวสวย 5 ทัพพี แต่อิ่มน้อยกว่ามาก',
            'อยากหวานจริงๆ ให้กินหลังมื้อหลัก น้ำตาลจะขึ้นช้ากว่ากินตอนท้องว่าง'] });
    tips.push('ลดเครื่องดื่มหวานเหลือ 1 แก้ว หรือสั่งหวานน้อย');
  }

  /* --- FIBER --- */
  if(t.kcal > 800 && t.fib < p.fibGoal*0.6){
    out.push({ lv:'warn', tag:'FIBER', title:'ใยอาหารน้อย — '+r1(t.fib)+' g',
      body:'เป้าคือ '+p.fibGoal+' g/วัน ใยอาหารคือตัวที่ทำให้<b>อิ่มนานโดยไม่เพิ่มแคล</b> ขาดแล้วจะหิวบ่อยทั้งที่กินครบแคล และท้องผูกง่ายด้วย',
      tips:['เติมผัก 1 จานในมื้อถัดไป (ผัดผักบุ้ง/แกงส้ม)','ฝรั่ง 1 ผล ให้ใยอาหาร 9 g แต่แค่ 112 kcal คุ้มที่สุด','เปลี่ยนข้าวขาวเป็นข้าวกล้องบางมื้อ'] });
  }

  /* --- FAT --- */
  const tg = macroTargets();
  if(t.f > tg.f*1.5){
    out.push({ lv:'warn', tag:'FAT', title:'ไขมัน '+r0(t.f)+' g สูงกว่าเป้ามาก',
      body:'เป้าอยู่ที่ '+r0(tg.f)+' g ไขมัน 1 g = 9 kcal มากกว่าคาร์บกับโปรตีนเท่าตัว จึงเป็นตัวดันแคลแบบเงียบที่สุด — ของทอด กะทิ หมูสามชั้น คือกลุ่มหลัก',
      tips:['มื้อถัดไปเลือกย่าง/นึ่ง/ต้ม แทนทอด','ข้าวมันไก่เปลี่ยนเป็นไก่ต้ม ตัดได้ราว 150 kcal ทันที'] });
  }

  /* --- PROTEIN --- */
  if(t.kcal > 800 && t.p < tg.p*0.7){
    out.push({ lv:'warn', tag:'PROTEIN', title:'โปรตีนต่ำ — '+r0(t.p)+' / '+r0(tg.p)+' g',
      body:'ช่วงลดน้ำหนัก โปรตีนคือตัวที่บอกร่างกายว่า "เอาไขมันไปใช้ อย่าแตะกล้ามเนื้อ" ขาดแล้วน้ำหนักลงจริงแต่ลงเป็นกล้าม แล้วเผาผลาญจะช้าลงตามไปด้วย',
      tips:['ขาดอีก '+r0(tg.p-t.p)+' g — ไข่ต้ม 2 ฟอง + อกไก่ 100g ก็เกือบครบ','เวย์ 1 สคูป = 24 g แค่ 120 kcal'] });
    tips.push('เติมโปรตีนอีก '+r0(tg.p-t.p)+' g');
  }

  /* --- SLEEP --- */
  const slH = sleepHours(k), need = p.sleepNeed || 8;
  if(slH !== null && slH < need - 1){
    out.push({ lv:'warn', tag:'SLEEP', title:'เมื่อคืนนอน '+r1(slH)+' ชม. — ขาดไป '+r1(need-slH)+' ชม.',
      body:'การนอนน้อยดัน<b>เกรลิน</b> (ฮอร์โมนหิว) ขึ้นและกด<b>เลปติน</b> (ฮอร์โมนอิ่ม) ลง ผลคือวันนี้จะหิวง่ายกว่าปกติ โดยเฉพาะกับของหวานและของทอด · และในงานวิจัยที่คุมแคลขาดดุลเท่ากัน กลุ่มที่นอน 5.5 ชม. <b>ลดไขมันได้น้อยกว่าและเสียกล้ามมากกว่า</b>กลุ่มที่นอน 8.5 ชม.',
      tips:['วันนี้ตั้งใจกินโปรตีนให้ครบเป็นพิเศษ จะอิ่มนานกว่าและกันการเสียกล้าม',
            'ถ้ารู้สึกอยากของหวานผิดปกติ นั่นคือฮอร์โมน ไม่ใช่ความอ่อนแอ — ดื่มน้ำแล้วรอ 15 นาทีก่อนตัดสินใจ',
            'ดูช่วงเวลาที่ค่าสติจะตกได้ในแท็บ <b>FOCUS</b> แล้ววางงานหนักเลี่ยงช่วงนั้น'] });
  }

  /* --- POTASSIUM vs SODIUM --- */
  if(t.na > 0){
    const kt = Math.max(p.kGoal, t.na*1.75);
    if(t.k < kt*0.6){
      out.push({ lv:'warn', tag:'POTASSIUM', title:'โพแทสเซียมต่ำเทียบกับโซเดียม',
        body:'วันนี้โซเดียม '+r0(t.na)+' mg แต่โพแทสเซียมแค่ '+r0(t.k)+' mg — ควรได้อย่างน้อย <b>'+r0(kt)+' mg</b> (ยังขาด '+r0(kt-t.k)+') · โพแทสเซียมคือตัวที่ช่วยให้ไตขับโซเดียมออก สัดส่วนสำคัญกว่าตัวเลขเดี่ยวๆ',
        tips:['ฝรั่ง 1 ผล = 690 mg (112 kcal) คุ้มที่สุดในบรรดาผลไม้ไทย',
              'น้ำมะพร้าว 1 แก้ว = 600 mg แค่ 45 kcal',
              'ดูตัวเลขเต็มและรายการอาหารที่แนะนำได้ในแท็บ <b>AID</b>'] });
    }
  }

  /* --- WATER --- */
  if(waterMl(k) < waterGoalMl(k) && t.na > p.naLimit){
    const gl = mlToGulp(waterGoalMl(k) - waterMl(k));
    out.push({ lv:'warn', tag:'HYDRATION', title:'โซเดียมสูงแต่น้ำยังน้อย',
      body:'ดื่มไปแค่ '+waterMl(k)+' / '+waterGoalMl(k)+' ml ทั้งที่วันนี้เกลือเยอะ — เป็นชุดที่ทำให้บวมและปวดหัวง่ายที่สุด',
      tips:['ดื่มอีก '+gl+' อึกก่อนเข้านอน'] });
  }

  /* --- TODAY'S BALANCE --- */
  if(left < 0){
    const plan = burnRows(-left, BURN.intensity);
    const best = plan.filter(function(r){ return r.mins <= 45; }).sort(function(a,b){ return a.mins-b.mins; })[0];
    out.push({ lv:'bad', tag:'SURPLUS', title:'เกินงบ '+r0(-left)+' kcal',
      body: best ? 'ถ้าอยากล้างให้หมดวันนี้ ทางที่สั้นที่สุดคือ <b>'+best.th+' '+r0(best.mins)+' นาที</b> — ดูตัวเลือกทั้งหมดในแท็บ PERKS'
                 : 'ส่วนเกินระดับนี้ออกกำลังกายชดเชยหมดในวันเดียวได้ยาก — <b>ทางที่ได้ผลจริงกว่าคือคุมมื้อพรุ่งนี้</b> ไม่ใช่ลงโทษตัวเองด้วยการออกกำลังกายหนัก',
      tips:['หนึ่งวันที่เกินไม่ทำให้ความพยายามทั้งสัปดาห์พัง — ค่าเฉลี่ย 7 วันคือตัวที่มีผลจริง','พรุ่งนี้กลับมากินตามปกติ ไม่ต้องอดชดเชย'] });
  }

  /* --- MULTI-DAY TRENDS --- */
  const last = loggedDays(5);
  const overStreak = (function(){ let n=0; for(let i=0;i<last.length;i++){ if(net(last[i])<0) n++; else break; } return n; })();
  if(overStreak >= 3){
    out.push({ lv:'bad', tag:'TREND', title:'เกินงบติดกัน '+overStreak+' วัน',
      body:'นี่ไม่ใช่วันพลาดวันเดียวแล้ว แต่เป็นแนวโน้ม — ถ้าไปต่อแบบนี้น้ำหนักจะขึ้นจริง ลองดูว่าเป็นเพราะมื้อไหน หรือเป็นเพราะเป้าขาดดุลที่ตั้งไว้แน่นเกินจนกินตามไม่ไหว',
      tips:['ลองผ่อนเป้าขาดดุลลงเหลือ 300–400 kcal/วันแล้วทำให้ได้จริง ดีกว่าตั้ง 700 แล้วพลาดทุกวัน'] });
  }
  const a7 = avgNet(7);
  if(a7 !== null && a7 > 900){
    out.push({ lv:'warn', tag:'TREND', title:'ขาดดุลเฉลี่ยแรงเกินไป',
      body:'เฉลี่ย '+r0(a7)+' kcal/วัน ในช่วงที่ผ่านมา ลดเร็วก็จริง แต่ระดับนี้กล้ามหายเยอะและมักจบที่กินชดเชย',
      tips:['ปรับเป้าขาดดุลลงเหลือ 500 หรือเพิ่มมื้อโปรตีน'] });
  }
  const wchg = weightTrendVsDeficit();
  if(wchg) out.push(wchg);

  if(!out.length && t.kcal > 0) out.push({ lv:'ok', tag:'ALL CLEAR', title:'วันนี้ยังไม่มีอะไรต้องเตือน',
    body:'แคล มาโคร โซเดียม น้ำตาล อยู่ในกรอบหมด รักษาระดับนี้ไว้', tips:[] });

  if(tips.length){
    out.push({ lv:'warn', tag:'TOMORROW', title:'สรุปสิ่งที่ควรทำพรุ่งนี้', body:'จากข้อมูลวันนี้ หนูสรุปเป็นข้อๆ ให้แล้ว', tips:tips });
  }
  const order = { bad:0, warn:1, ok:2 };
  out.sort(function(a,b){ return order[a.lv]-order[b.lv]; });
  return out;
}
function weightTrendVsDeficit(){
  const ws = [];
  for(let i=0;i<10;i++){ const k = shiftKey(today(),-i); if(S.days[k] && S.days[k].weight) ws.push({k:k,w:S.days[k].weight}); }
  if(ws.length < 4) return null;
  const dW = ws[0].w - ws[ws.length-1].w;
  const a = avgNet(7);
  if(a !== null && a > 250 && dW > 0.4){
    return { lv:'warn', tag:'WEIGHT', title:'ขาดดุลอยู่ แต่น้ำหนักขึ้น',
      body:'ช่วง '+ws.length+' ครั้งที่ชั่งล่าสุด น้ำหนักขึ้น '+r1(dW)+' กก. ทั้งที่ยังขาดดุลเฉลี่ย '+r0(a)+' kcal/วัน — <b>ในทางฟิสิกส์เป็นไปไม่ได้ที่จะสร้างไขมันจากการขาดดุล</b> สาเหตุที่พบบ่อยคือน้ำจากโซเดียม ไกลโคเจน อาหารค้างในลำไส้ หรือประเมินแคลอาหารต่ำกว่าจริง',
      tips:['ชั่งเวลาเดิมทุกวัน ตื่นนอน หลังเข้าห้องน้ำ ก่อนกินอะไร','ดูเส้นค่าเฉลี่ย 7 วันในแท็บ DATA ไม่ใช่ตัวเลขรายวัน','ถ้าผ่านไป 3 สัปดาห์เส้นเฉลี่ยยังไม่ลง แปลว่างบแคลที่ประเมินไว้สูงเกินจริง ใช้ AUTO-CALIBRATE ปรับได้'] };
  }
  return null;
}

/* ==========================================================
   BURN PLAN
   ========================================================== */
function burnTargetKcal(){
  const k = today(), b = budget(k), t = totals(k), left = b - t.kcal;
  if(BURN.goal === 'clear') return Math.max(0, -left);
  if(BURN.goal === 'target') return Math.max(0, deficitFor(today()) - left);
  return Math.max(0, BURN.custom || 0);
}
function burnRows(kcal, intensity){
  const rows = BURN_TYPES.map(function(t){
    const rate = kcalPerMin(t, intensity);
    return { type:t, th:EXER[t].th, label:EXER[t].label, rate:rate, mins:kcal/rate, mix:null };
  });
  const each = kcal/3;
  const mixMins = BURN_TYPES.map(function(t){ return { t:t, m:each/kcalPerMin(t,intensity) }; });
  rows.push({ type:'mix', th:'ผสม 3 ท่า (เฉลี่ยกัน)', label:'COMBINED CIRCUIT',
    rate:null, mins:mixMins.reduce(function(a,x){ return a+x.m; },0), mix:mixMins });
  return rows;
}

/* ==========================================================
   ACTION CHECKLIST — รวมสิ่งที่ต้องทำจากทุกระบบไว้ที่เดียว
   ========================================================== */
function checklist(){
  const k = today(), d = day(k), t = totals(k), b = budget(k), p = S.profile;
  const tg = macroTargets(k), left = b - t.kcal, items = [];
  const add = function(id, txt, pri){ items.push({ id:id, txt:txt, pri:pri||2 }); };

  /* --- วันนี้ยังทำได้ --- */
  if(t.kcal === 0) add('log', 'บันทึกอาหารวันนี้ในแท็บ INV', 1);
  if(t.kcal > 0 && t.p < tg.p*0.85)
    add('pro', 'เติมโปรตีนอีก <b>'+r0(tg.p-t.p)+' g</b> (ไข่ 2 ฟอง + อกไก่ 100g ≈ ครบ)', 1);
  const wLeft = Math.max(0, waterGoalMl(k) - waterMl(k));
  if(wLeft > 0)
    add('water', 'ดื่มน้ำอีก <b>'+mlToGulp(wLeft)+' อึก</b> ('+wLeft+' ml)'+(isSick()?' — ป่วยต้องการมากกว่าปกติ':''), isSick()?1:2);
  const nk = naK(k);
  if(nk.gap > 400)
    add('k', 'เติมโพแทสเซียมอีก ~<b>'+r0(nk.gap)+' mg</b> (Coco Dee 1 ขวด = 780)', 2);
  if(t.kcal > 800 && t.fib < p.fibGoal*0.6)
    add('fib', 'เติมใยอาหาร — ผัก 1 จาน หรือฝรั่ง 1 ผล', 2);
  if(left < 0)
    add('over', 'วันนี้เกินงบ <b>'+r0(-left)+' kcal</b> — ขยับตัวเพิ่ม หรือปล่อยผ่านแล้วคุมพรุ่งนี้', 1);
  if(d.weight === null || d.weight === undefined)
    add('wt', 'ยังไม่ได้ชั่งน้ำหนักวันนี้', 3);
  if(!(d.sleep && d.sleep.h))
    add('slp', 'ยังไม่ได้กรอกเวลานอนเมื่อคืน', 3);

  /* --- เวลา --- */
  const bed = hm2min(p.bedTime||'23:00') || 1380;
  const cafCut = bed - 9*60;
  if(cafTotalToday() > 0 && nowMin() < cafCut)
    add('caf', 'คาเฟอีนครั้งสุดท้ายไม่เกิน <b>'+min2hm(cafCut)+'</b>', 3);
  const evs = mealEventsFull(k);
  if(evs.length){
    const lastMeal = evs[evs.length-1], g = digestOf(lastMeal);
    const safeBed = lastMeal.min + g.bedGap*60;
    if(safeBed > bed)
      add('bed', 'มื้อล่าสุดหนัก — ควรนอนหลัง <b>'+min2hm(safeBed)+'</b> หรือเลื่อนมื้อให้เร็วขึ้นพรุ่งนี้', 2);
  }
  const dbt = sleepDebt7();
  if(dbt.debt >= 3)
    add('debt', 'หนี้การนอนสะสม <b>'+r1(dbt.debt)+' ชม.</b> — คืนนี้เข้านอนก่อน '+esc(p.bedTime||'23:00'), 1);

  /* --- อาหารเสริมที่ยังไม่ได้กิน --- */
  const st = suppState();
  const notTaken = st.on.filter(function(id){ return !tookToday(id); });
  if(notTaken.length && notTaken.length <= 4){
    notTaken.forEach(function(id){
      const sp = suppById(id); if(sp) add('sp_'+id, 'ยังไม่ได้กิน <b>'+esc(sp.n)+'</b>', 3);
    });
  } else if(notTaken.length > 4){
    add('sp_all', 'ยังไม่ได้ติ๊กอาหารเสริม <b>'+notTaken.length+' ตัว</b> ในแท็บ AID', 3);
  }

  /* --- พรุ่งนี้: จากตัวการซ้ำ --- */
  const naT = limitTrend('na', function(){ return p.naLimit; }, 'mg', 'โซเดียม');
  if(naT && naT.over >= 3 && naT.culprits[0] && naT.culprits[0].days >= 2)
    add('na_rep', 'พรุ่งนี้เลี่ยง <b>'+esc(naT.culprits[0].n)+'</b> — ตัวการโซเดียมประจำ', 1);

function avatarState(){
  const k = today(), d = day(k), t = totals(k), b = budget(k), p = S.profile;
  const left = b - t.kcal, now = nowMin();
  if(left < 0) return 'rad';
  /* เพิ่งออกกำลังกายใน 2 ชม. */
  const ex = (d.ex||[]).filter(function(x){ return x.t && (now - hm2min(x.t)) >= 0 && (now - hm2min(x.t)) <= 120; });
  if(ex.length) return 'workout';
  /* ทำ ACTION LIST ครบทุกข้อ */
  const items = checklist();
  if(t.kcal > 0 && items.length && items.every(function(x){ return d.checks && d.checks[x.id]; })) return 'celebrate';
  /* เพิ่งกินใน 45 นาที */
  const ev = mealEventsFull(k);
  if(ev.length){
    const last = ev[ev.length-1];
    if(now - last.min >= 0 && now - last.min <= 45 && last.kcal >= 250) return 'full';
  }
  /* ดึกแล้ว หรือค่าสติต่ำมาก */
  const bed = hm2min(p.bedTime||'23:00') || 1380;
  if(now >= bed - 45 || now < 300) return 'sleepy';
  if(focusAt(now) < 38) return 'sleepy';
  if(left < b*0.15) return 'warn';
  return 'good';
}

/* ---- ตัวจับเวลาย่อยอาหารแบบสด ---- */
function digestNow(){
  const ev = mealEventsFull(today());
  if(!ev.length) return null;
  const now = nowMin();
  const past = ev.filter(function(e){ return e.min <= now; });
  if(!past.length) return null;
  const last = past[past.length-1];
  const g = digestOf(last);
  const emptyAt = last.min + g.empty*60, hungryAt = last.min + g.full*60;
  const elapsed = now - last.min;
  const pct = clamp(elapsed/(g.empty*60)*100, 0, 100);
  return { e:last, g:g, emptyAt:emptyAt, hungryAt:hungryAt, elapsed:elapsed,
           pct:pct, leftMin:Math.max(0, emptyAt-now), hungryIn:Math.max(0, hungryAt-now) };
}
function hhmm(mins){
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  return (h>0 ? h+' ชม. ' : '') + m + ' นาที';
}
function viewDigestNow(){
  const d = digestNow();
  if(!d) return '';
  const done = d.leftMin <= 0;
  return '<div class="dgnow'+(done?' done':'')+'">'
    + '<div class="dgtop"><span class="dgn">'+esc(d.e.names[0])+(d.e.names.length>1?' +'+(d.e.names.length-1):'')
      + ' <s>'+min2hm(d.e.min)+' · '+r0(d.e.kcal)+' kcal</s></span>'
      + '<span class="dgv">'+(done ? 'ย่อยแล้ว' : 'อีก '+hhmm(d.leftMin))+'</span></div>'
    + '<div class="bar thin"><i data-w="'+d.pct+'"></i></div>'
    + '<div class="dgsub">'
      + (done
          ? 'กระเพาะว่างแล้ว · ' + (d.hungryIn > 0 ? 'น่าจะเริ่มหิวราว <b>'+min2hm(d.hungryAt)+'</b> (อีก '+hhmm(d.hungryIn)+')' : '<b>ถึงเวลาหิวแล้ว</b> — ถ้ายังไม่กินจะเริ่มล้า')
          : 'ย่อยไปแล้ว <b>'+r0(d.pct)+'%</b> · เสร็จราว <b>'+min2hm(d.emptyAt)+'</b> · เริ่มหิวราว <b>'+min2hm(d.hungryAt)+'</b>')
    + '</div></div>';
}

  + '<div class="warnbox rad"><b>อาการที่ควรไปหาหมอ ไม่ใช่รอดูอาการ</b><br>'

    + 'ปัสสาวะไม่ออกเกิน 8 ชม. หรือลุกแล้วหน้ามืดมาก · ซึม สับสน ปลุกยาก · '
    + 'มีจุดเลือดออกหรือผื่นที่กดแล้วไม่จาง · เลือดออกตามไรฟันหรือเลือดกำเดา · '

function dateNav(){
  const k = vdate();
  return '<div class="box" style="margin-bottom:12px;padding:9px 12px'
    + (isToday()?'':(isPlan()?';border-color:#5AC8FF':';border-color:var(--amber)'))+'">'
    + '<div class="datenav">'
      + '<button class="btn sm" data-dnav="-1">◀</button>'
      + '<div class="dncur'+(isToday()?'':(isPlan()?' plan':' past'))+'">'
        + thDate(k,{weekday:'long',day:'numeric',month:'short'})
        + '<s>'+(isToday()?'วันนี้':(isPlan()?'แผนล่วงหน้า':'ย้อนหลัง'))+'</s></div>'
      + '<button class="btn sm" data-dnav="1"'+(vdate() >= shiftKey(today(),7)?' disabled':'')+'>▶</button>'
      + (isToday()?'':'<button class="btn sm pri" id="dnToday">วันนี้</button>')
    + '</div>'
    + (isToday()?'':'<div class="note" style="margin-top:7px">'
        +(isPlan()
          ? 'กำลังดู<b>แผนล่วงหน้า</b> — ตัวเลขคือสิ่งที่วางไว้ ยังไม่ได้กินจริง'
          : 'กำลังดูข้อมูล<b>ย้อนหลัง</b> — แก้น้ำหนัก น้ำ เวลานอน และบันทึกย่อของวันนั้นได้เลย · เพิ่มอาหารย้อนหลังได้ในแท็บ INV')
        +'</div>')
  + '</div>';
}

function viewStat(){
  const k = vdate(), d = day(k), t = totals(k), b = budget(k), p = S.profile;
  const now2 = isToday();
  const left = b - t.kcal, over = left < 0;
  const tg = macroTargets(k);
  const state = now2 ? avatarState() : (b - t.kcal < 0 ? 'rad' : 'good');
  const hpPct = clamp(left/b*100, 0, 100);
  const radPct = over ? clamp(-left/(b*0.4)*100, 0, 100) : 0;
  const st = streak();

  const sp = function(en, val, target, unit, invert){
    const pct = clamp(val/target*100, 0, 100);
    const cls = invert ? (val > target ? (val > target*1.5 ? 'rad' : 'amber') : '')
                       : (val > target*1.35 ? 'rad' : (val < target*0.7 ? 'amber' : ''));
    return '<div class="sp"><em>'+en+'</em><div class="bar thin '+cls+'"><i data-w="'+pct+'"></i></div>'
      + '<u>'+r0(val)+' / '+r0(target)+unit+'</u></div>';
  };

  return ''
  + dateNav()
  + (now2 ? '<div class="quickmodes">'
      + '<button class="qm'+(isSick()?' on':'')+'" id="qmSick">'+(isSick()?'🤒 กำลังป่วย — วันที่ '+sickDays():'🤒 วันนี้ไม่สบาย')+'</button>'
      + (p.travelMode?'<button class="qm on" id="qmTravel">✈️ โหมดนอกบ้าน</button>':'')
    + '</div>' : '')
  + '<div id="vitals"'+(now2?'':(isPlan()?' style="border-color:#5AC8FF"':' style="border-color:var(--amber)"'))+'>'
    + '<div class="vrow">'
      + '<div id="mascot" title="แตะเพื่อคุย">'+mascot(state)+mascotFace(state)+'<div id="kaobub"></div></div>'
      + '<div class="vmeters">'
        + '<div class="meter"><label>HP &middot; แคลคงเหลือ <b>'+r0(Math.max(0,left))+' / '+r0(b)+'</b></label>'
          + '<div class="bar"><i data-w="'+hpPct+'"></i></div></div>'
        + '<div class="meter"><label>RADS &middot; ส่วนเกิน <b>'+(over? r0(-left)+' kcal' : 'CLEAR')+'</b></label>'
          + '<div class="bar rad"><i data-w="'+radPct+'"></i></div></div>'
      + '</div>'
    + '</div>'
    + '<div class="bignum'+(over?' over':'')+'"><em>'+(left>=0?'−':'+')+r0(Math.abs(left))+'</em><u>KCAL '+(left>=0?'DEFICIT วันนี้':'SURPLUS วันนี้')+'</u></div>'
    + (now2 ? viewDigestNow() : '')
    + '<div class="stat4">'
      + '<div><s>กินเข้าไป</s><b>'+r0(t.kcal)+'</b><i>kcal</i></div>'
      + '<div><s>เผาผลาญรวม</s><b>'+r0(b)+'</b><i>BMR×'+p.baseFactor+' + watch</i></div>'
      + '<div><s>ACTIVE (watch)</s><b>'+r0(d.watch||0)+'</b><i>kcal</i></div>'
      + '<div><s>บันทึกติดกัน</s><b>'+st+'</b><i>วัน</i></div>'
    + '</div>'
    + (p.cycleOn
      ? '<div class="daytype">'
        + '<div class="dtlab">โหมดวันนี้<s>เป้าขาดดุล '+r0(deficitFor(k))+' kcal</s></div>'
        + '<div class="seg" style="max-width:260px">'
          + '<button data-dtype="train" class="'+(isTrainDay(k)?'on':'')+'">วันเทรน</button>'
          + '<button data-dtype="rest" class="'+(!isTrainDay(k)?'on':'')+'">วันพัก</button>'
          + '<button data-dtype="auto" class="'+(d.dayType?'':'on')+'">อัตโนมัติ</button>'
        + '</div></div>'
        + '<div class="note">'+(d.dayType?'กำหนดเอง':'เดาจากกิจกรรม: '+(isTrainDay(k)?'มีการออกกำลังกาย/Active Energy ≥250':'ยังไม่มีกิจกรรม'))
        + ' · วันเทรนกินได้มากขึ้นเพื่อฟื้นตัว วันพักตัดลงชดเชย เฉลี่ยทั้งสัปดาห์เท่าเดิม</div>'
      : '')
    + (p.travelMode ? '<div class="warnbox" style="border-color:var(--p-lit);color:var(--p-lit);background:rgba(60,255,142,.07)">'
        + '<b>โหมดนอกบ้าน</b> — เป้าตอนนี้คือ<b>รักษาน้ำหนัก</b> ไม่ใช่ลด · กินให้พอดีงบก็ถือว่าผ่านแล้ว ไม่ต้องกดดันตัวเอง</div>' : '')
    + ((over && !p.travelMode) ? '<div class="warnbox rad">วันนี้เกินงบ '+r0(-left)+' kcal — กดแท็บ <b>PERKS</b> ดูว่าต้องออกกำลังกายเท่าไหร่ หรือปล่อยผ่านแล้วคุมพรุ่งนี้ก็ได้ ค่าเฉลี่ยทั้งสัปดาห์คือตัวที่มีผลจริง</div>' : '')
  + '</div>'

  + (now2 && isSick() ? sickPanel() : '')

        + '<h2 style="color:#9BDFFF">รายการจากแผน<span>ยืนยันก่อนนับเป็นข้อมูลจริง</span></h2>'
        + '<div class="note" style="color:#9BDFFF">วันนี้มี <b>'+planCount(k)+' รายการ</b> ที่วางแผนไว้ล่วงหน้า '
        + 'ตอนนี้<b>นับรวมในตัวเลขแล้ว</b> — ถ้ากินจริงตามแผนก็กดยืนยัน ถ้าไม่ได้กินให้ลบออก ไม่งั้นสถิติจะเพี้ยน</div>'
        + '<div class="btnrow"><button class="btn sm pri" id="planOk">ยืนยันว่ากินจริง</button>'
        + '<button class="btn sm danger" id="planDrop">ลบรายการที่ยังไม่ได้กิน</button></div></div>'
      : '')
  + (now2 ? '<div class="box" style="margin-top:12px;border-color:var(--p-lit);box-shadow:var(--glow-soft)">'
    + '<h2 style="color:var(--p-lit)">ACTION LIST<span>รวมทุกระบบไว้ที่เดียว</span></h2>'
    + viewChecklist()
  + '</div>' : '')

  + '<div class="grid g21" style="margin-top:12px">'

        + sp('SUGAR', t.sug, p.sugLimit, ' g', true)

        + sp('POTASS.', t.k, clamp(Math.max(p.kGoal, t.na*1.75), p.kGoal, 4700), ' mg')
      + '</div><div class="note">โซเดียมกับน้ำตาลคือ<b>เพดานห้ามเกิน</b> · ใยอาหารกับโพแทสเซียมคือ<b>เป้าที่ต้องทำให้ถึง</b> · เป้าโพแทสเซียมขยับตามโซเดียมที่กินวันนี้ (K ≈ 1.75 × Na) ดูรายละเอียดในแท็บ AID</div></div>'
      + topSources(k, t)
    + '</div>'

    + '<div class="box"><h2>QUICK LOG<span>วันนี้</span></h2>'
      + '<input type="number" step="0.1" id="qWeight" value="'+(d.weight!==null&&d.weight!==undefined?d.weight:'')+'" placeholder="'+p.weight+'">'
      + waterBlock(k)
      + '<label class="f">น้ำหนัก (kg)</label>'
      + '<div class="btnrow" style="margin-top:0"><button class="btn sm pri" id="saveW">บันทึกน้ำหนัก</button></div>'
      + '<label class="f">เมื่อคืนนอน (ชม.)</label>'
      + '<div class="btnrow" style="margin-top:0">'
        + [5,6,7,8,9].map(function(x){
            const cur = (d.sleep && d.sleep.h) === x;
            return '<button class="btn sm'+(cur?' pri':'')+'" data-sleepq="'+x+'">'+x+'</button>'; }).join('')
        + '<button class="btn sm" data-sleepq="0.5">+½</button></div>'

function topSources(k, t){
  const d = day(k);
  if(!d.foods.length) return '';
  const rank = d.foods.map(function(x){ return { n:x.n, v:x.kcal*(x.q||1) }; })
                      .sort(function(a,b){ return b.v - a.v; }).slice(0,3);
  return '<div style="margin-top:12px;border-top:1px solid var(--p-dim);padding-top:9px">'
    + '<div style="font-size:10px;letter-spacing:2px;color:var(--p-mid);margin-bottom:6px">ตัวการหลักวันนี้</div>'
    + rank.map(function(o){
        const pct = clamp(o.v/Math.max(1,t.kcal)*100, 0, 100);
        return '<div class="sp" style="grid-template-columns:1fr 78px 62px;margin-bottom:5px">'
          + '<em class="th" style="color:var(--p-hot);letter-spacing:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(o.n)+'</em>'
          + '<div class="bar thin"><i data-w="'+pct+'"></i></div><u>'+r0(o.v)+' kcal</u></div>';
      }).join('') + '</div>';
}

function diagnostics(K){
  const k = K || today(), isNow = (k === today());
  const d = day(k), t = totals(k), b = budget(k), tg = macroTargets(k);
  const left = b - t.kcal, out = [], B = bmr(), TG = deficitFor(k);

  if(t.kcal === 0){
    out.push({lv:'warn', msg:'ยังไม่ได้บันทึกอาหารวันนี้ — ไปแท็บ <b>INV</b> แล้วกดเพิ่มรายการก่อน'});
  } else if(t.kcal < B){
    out.push({lv:'bad', msg:'<b>กินต่ำกว่า BMR ('+r0(B)+' kcal)</b> — ระดับนี้ยังไม่พอสำหรับการทำงานพื้นฐานของร่างกาย ตัดแคลแรงขนาดนี้ไม่ได้ทำให้ผอมเร็วขึ้น แต่ทำให้กล้ามหาย แรงตก และเผาผลาญช้าลงระยะยาว — เพิ่มอาหารอีกอย่างน้อย '+r0(B-t.kcal)+' kcal (เน้นโปรตีน)'});
  } else if(left < 0){
    out.push({lv:'bad', msg:'<b>เกินงบ '+r0(-left)+' kcal</b> วันนี้จะเป็นวันสะสม ไม่ใช่วันลด'});
  } else if(left > 1000){
    out.push({lv:'warn', msg:'ขาดดุล '+r0(left)+' kcal แรงเกินไป — ช่วงที่ยั่งยืนคือ 300–700 kcal/วัน'});
  } else if(left >= TG*0.75 && left <= TG*1.35){
    out.push({lv:'ok', msg:'ขาดดุล '+r0(left)+' kcal ตรงเป้า — ถ้ารักษาระดับนี้ได้ ลงประมาณ '+r1(left*7/7700)+' กก./สัปดาห์'});
  } else if(left > TG*1.35){
    out.push({lv:'warn', msg:'ขาดดุล '+r0(left)+' kcal มากกว่าเป้าที่ตั้งไว้ ('+TG+') — ลดเร็วขึ้นก็จริง แต่ถ้าทำทุกวันจะเหนื่อยและกล้ามหายง่ายกว่า'});
  } else {
    out.push({lv:'warn', msg:'ขาดดุลแค่ '+r0(left)+' kcal ต่ำกว่าเป้า ('+TG+') — อีก '+r0(TG-left)+' kcal จะเข้าเป้า'});
  }

  if(t.kcal > 0){
    if(t.p < tg.p*0.7) out.push({lv:'warn', msg:'<b>โปรตีนน้อยไป</b> ('+r0(t.p)+' จากเป้า '+r0(tg.p)+' g) — เพิ่มอกไก่/ไข่/เวย์อีก '+r0(tg.p-t.p)+' g'});
    else if(t.p >= tg.p*0.9) out.push({lv:'ok', msg:'โปรตีน '+r0(t.p)+' g เข้าเป้าแล้ว'});
    if(t.f > tg.f*1.5) out.push({lv:'warn', msg:'<b>ไขมันเยอะไป</b> ('+r0(t.f)+' จากเป้า '+r0(tg.f)+' g) — ไขมัน 1 g = 9 kcal มากกว่าคาร์บเท่าตัว'});
    if(t.f < tg.f*0.5) out.push({lv:'warn', msg:'ไขมันต่ำเกินไป ('+r0(t.f)+' g) — จำเป็นต่อฮอร์โมนและการดูดซึมวิตามิน'});
    if(t.c > tg.c*1.4) out.push({lv:'warn', msg:'<b>คาร์บเยอะไป</b> ('+r0(t.c)+' จากเป้า '+r0(tg.c)+' g)'});
    if(t.na > S.profile.naLimit) out.push({lv:'bad', msg:'<b>โซเดียมเกิน</b> ('+r0(t.na)+' จากเพดาน '+S.profile.naLimit+' mg)'});
    if(t.sug > S.profile.sugLimit) out.push({lv:'warn', msg:'<b>น้ำตาลเกิน</b> ('+r0(t.sug)+' จากเพดาน '+S.profile.sugLimit+' g)'});
  }
  const active = (d.watch||0) + sumEx(d);
  if(active === 0) out.push({lv:'warn', msg:(isNow?'ยังไม่มี':'ไม่มี')+' Active Energy '+(isNow?'วันนี้':'วันนั้น')+' — กรอกเลขจาก Apple Watch ในแท็บ <b>PERKS</b>'});
  else out.push({lv:'ok', msg:'Active Energy '+r0(active)+' kcal บันทึกแล้ว'});
  const wl = Math.max(0, waterGoalMl(k) - waterMl(k));
  if(wl > 0) out.push({lv:'warn', msg:'น้ำ'+(isNow?'ยัง':'')+'ขาดอีก <b>'+mlToGulp(wl)+' อึก</b> ('+wl+' ml จากเป้า '+waterGoalMl(k)+')'});

  if(isNow){
    let lastW = null;
    for(let i=0;i<7;i++){ const kk = shiftKey(today(),-i); if(S.days[kk] && S.days[kk].weight){ lastW = i; break; } }
    if(lastW === null) out.push({lv:'warn', msg:'ยังไม่มีน้ำหนักบันทึกใน 7 วันนี้ — กราฟพยากรณ์ยังทำงานไม่เต็มที่'});
  } else if(d.weight === null || d.weight === undefined){
    out.push({lv:'warn', msg:'วันนั้นไม่ได้ชั่งน้ำหนัก — กรอกย้อนหลังได้ในช่อง QUICK LOG'});
  }

  const order = { bad:0, warn:1, ok:2 };
  out.sort(function(a,b2){ return order[a.lv] - order[b2.lv]; });
  return out;
}

function fitNow(){
  const k = vdate(), t = totals(k), b = budget(k), p = S.profile;
  const tg = macroTargets(k);
  const leftK = b - deficitFor(k) - t.kcal;          /* งบที่เหลือถึงเป้า */
  const gapP = Math.max(0, tg.p - t.p);
  const gapF = Math.max(0, p.fibGoal - t.fib);
  const gapK = Math.max(0, clamp(Math.max(p.kGoal, t.na*1.75), p.kGoal, 4700) - t.k);
  const naRoom = p.naLimit - t.na;
  const sugRoom = p.sugLimit - t.sug;

  const pool = myFoods().concat(FOODS);
  const scored = pool.map(function(f){
    /* ตัดออกทันทีถ้าทำให้ทะลุเพดาน — ไม่ใช่แค่หักคะแนน */
    if(f.kcal > Math.max(60, leftK)) return null;
    if((f.na||0)  > Math.max(0, naRoom))  return null;
    if((f.sug||0) > Math.max(0, sugRoom)) return null;
    /* ให้คะแนนแบบ "คุ้มค่าต่อแคลที่จ่าย" ไม่ใช่ปริมาณดิบ */
    let val = 0;
    if(gapP > 0) val += Math.min(f.p, gapP) * 3;
    if(gapF > 0) val += Math.min(f.fib||0, gapF) * 1.5;
    if(gapK > 0) val += Math.min(f.k||0, gapK) / 100;
    if(val <= 0) return null;
    const cost = Math.max(0.5, f.kcal/100 + (f.na||0)/300 + (f.sug||0)/15);
    const why = [];
    if(gapP > 0 && f.p >= 8)  why.push('โปรตีน '+r0(f.p)+' g');
    if(gapF > 0 && (f.fib||0) >= 3) why.push('ใยอาหาร '+r1(f.fib)+' g');
    if(gapK > 0 && (f.k||0) >= 300) why.push('โพแทสเซียม '+r0(f.k)+' mg');
    return { f:f, sc:val/cost, why:why };
  }).filter(Boolean).sort(function(a,b2){ return b2.sc - a.sc; }).slice(0,8);

  return { rows:scored, leftK:leftK, gapP:gapP, gapF:gapF, gapK:gapK, naRoom:naRoom };
}
