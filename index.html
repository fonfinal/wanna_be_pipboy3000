<style>
/* ============================================================
   NUTRI-BOY 3000 — DESIGN TOKENS
   Palette: phosphor CRT green, amber caution, rad orange-red
   ============================================================ */
:root{
  --p-void:#04120A;      /* deep chassis black-green */
  --p-deep:#07200F;      /* screen base */
  --p-dim:#0F4A28;       /* inactive stroke */
  --p-mid:#1E9455;       /* secondary text */
  --p-lit:#3CFF8E;       /* PRIMARY phosphor */
  --p-hot:#CFFFE4;       /* highlight / hot white-green */
  --amber:#FFB000;       /* caution */
  --rad:#FF5033;         /* over budget / danger */
  --steel:#0A1A12;
  --glow: 0 0 4px rgba(60,255,142,.55), 0 0 12px rgba(60,255,142,.22);
  --glow-soft: 0 0 6px rgba(60,255,142,.28);
  --mono:'Share Tech Mono', ui-monospace, 'Courier New', monospace;
  --thai:'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  padding-top:max(10px, env(safe-area-inset-top));
  padding-bottom:max(10px, env(safe-area-inset-bottom));
  background:
    radial-gradient(ellipse at 50% 0%, #0b2416 0%, #030b06 60%, #010402 100%);
  font-family:var(--mono);
  color:var(--p-lit);
  min-height:100dvh;
  padding:10px;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
}
:lang(th),.th{font-family:var(--thai)}

/* ---------- CHASSIS ---------- */
#chassis{
  width:100%;max-width:1080px;
  background:linear-gradient(180deg,#132018,#0a130d 40%,#070d09);
  border:2px solid #1c3226;
  border-radius:16px;
  padding:12px;
  box-shadow:0 0 0 1px #000, 0 24px 60px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;
}
#chassis::before,#chassis::after{
  content:'';position:absolute;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#42604f,#101a14);top:6px;
}
#chassis::before{left:8px}
#chassis::after{right:8px}

#screen{
  position:relative;
  background:radial-gradient(ellipse at 50% 45%, #0b2c17 0%, var(--p-deep) 55%, #030f07 100%);
  border-radius:10px;
  border:1px solid #163a24;
  overflow:hidden;
  min-height:70dvh;
  display:flex;flex-direction:column;
}
/* CRT overlays */
#screen .scan,#screen .vig,#screen .flick{position:absolute;inset:0;pointer-events:none;z-index:50}
.scan{background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.28) 3px,rgba(0,0,0,.28) 4px);mix-blend-mode:multiply}
.scan::after{content:'';position:absolute;left:0;right:0;height:120px;background:linear-gradient(180deg,rgba(60,255,142,0),rgba(60,255,142,.045),rgba(60,255,142,0));animation:sweep 7s linear infinite}
@keyframes sweep{0%{top:-140px}100%{top:100%}}
.vig{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%);box-shadow:inset 0 0 90px rgba(0,0,0,.9)}
.flick{background:rgba(60,255,142,.03);animation:flick 3.1s steps(2) infinite;opacity:.6}
@keyframes flick{0%,96%{opacity:.25}97%{opacity:.7}98%{opacity:.15}100%{opacity:.4}}
body.noCRT .scan,body.noCRT .flick{display:none}
body.noCRT .vig{opacity:.35}

/* ---------- BOOT ---------- */
#boot{position:absolute;inset:0;background:#020a05;z-index:99;padding:26px 20px;font-size:13px;line-height:1.7;overflow:hidden}
#boot b{color:var(--p-hot);font-weight:400}
#bootlog{white-space:pre-wrap;text-shadow:var(--glow)}
#boot.done{animation:crtOff .5s ease forwards}
@keyframes crtOff{60%{transform:scaleY(.02);opacity:1;filter:brightness(3)}100%{transform:scaleY(0) scaleX(0);opacity:0;visibility:hidden}}

/* ---------- HEADER / TABS ---------- */
header{padding:10px 14px 0;position:relative;z-index:10}
.brand{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:1px solid var(--p-dim);padding-bottom:6px;flex-wrap:wrap}
.brand h1{font-size:15px;letter-spacing:2px;font-weight:400;text-shadow:var(--glow)}
.brand h1 small{display:block;font-size:9px;color:var(--p-mid);letter-spacing:3px}
.hdr-r{font-size:11px;color:var(--p-mid);text-align:right;line-height:1.5}
.hdr-r b{color:var(--p-lit);font-weight:400}

nav{display:flex;gap:0;margin-top:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:1 0 auto;min-width:74px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--p-dim);font-family:var(--mono);font-size:13px;letter-spacing:2px;
  padding:8px 10px 6px;cursor:pointer;transition:color .12s,border-color .12s;
}
nav button:hover{color:var(--p-mid)}
nav button.on{color:var(--p-hot);border-bottom-color:var(--p-lit);text-shadow:var(--glow)}
nav button:focus-visible{outline:1px dashed var(--p-lit);outline-offset:-3px}

/* ---------- PANEL / CONTENT ---------- */
main{flex:1;padding:12px 14px 16px;position:relative;z-index:10;overflow-y:auto;max-height:none}
.page{display:none;animation:fade .18s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1}}

.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}

.box{border:1px solid var(--p-dim);border-radius:var(--r);padding:10px 12px;background:linear-gradient(180deg,rgba(60,255,142,.035),rgba(0,0,0,0))}
.box>h2{font-size:11px;letter-spacing:3px;color:var(--p-mid);font-weight:400;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.box>h2 span{color:rgba(60,255,142,.5);letter-spacing:1px;text-align:right}

/* ---------- VITALS (SIGNATURE) ---------- */
#vitals{border:1px solid var(--p-lit);box-shadow:var(--glow-soft);border-radius:var(--r);padding:12px;background:linear-gradient(180deg,rgba(60,255,142,.07),rgba(0,0,0,.2))}
.vrow{display:flex;align-items:center;gap:12px}
#mascot{width:84px;flex:0 0 84px}
#mascot svg{width:100%;height:auto;filter:drop-shadow(0 0 5px rgba(60,255,142,.5))}
.vmeters{flex:1;min-width:0}
.meter{margin-bottom:9px}
.meter label{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--p-mid);margin-bottom:3px}
.meter label b{color:var(--p-hot);font-weight:400;letter-spacing:1px}
.bar{height:13px;border:1px solid var(--p-dim);position:relative;overflow:hidden;background:rgba(0,0,0,.45)}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(90deg,var(--p-lit) 0 5px,rgba(0,0,0,.35) 5px 7px);transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:var(--glow-soft)}
.bar.amber i{background:repeating-linear-gradient(90deg,var(--amber) 0 5px,rgba(0,0,0,.35) 5px 7px)}
.bar.rad i{background:repeating-linear-gradient(90deg,var(--rad) 0 5px,rgba(0,0,0,.35) 5px 7px)}
.bar.thin{height:9px}

.bignum{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
.bignum em{font-style:normal;font-size:40px;line-height:1;color:var(--p-hot);text-shadow:var(--glow)}
.bignum u{text-decoration:none;font-size:11px;color:var(--p-mid);letter-spacing:2px}
.bignum.over em{color:var(--rad);text-shadow:0 0 8px rgba(255,80,51,.6)}

.stat4{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--p-dim);border:1px solid var(--p-dim);margin-top:10px}
@media(min-width:520px){.stat4{grid-template-columns:repeat(4,1fr)}}

/* ---------- FOOD POOL: built-in + my foods + recently used ---------- */
function myFoods(){ return S.myfoods || (S.myfoods = []); }
function recentFoods(n){
  const seen = {}, out = [], cap = n || 24;
  for(let i=0;i<21 && out.length<cap;i++){
    const d = S.days[shiftKey(today(),-i)];
    if(!d || !d.foods) continue;
    for(let j=d.foods.length-1;j>=0;j--){
      const x = d.foods[j];
      if(seen[x.n]) continue;
      seen[x.n] = 1;
      out.push({ n:x.n, u:x.u||'', cat:'ล่าสุด', kcal:x.kcal, p:x.p, f:x.f, c:x.c,
                 sug:x.sug||0, na:x.na||0, fib:x.fib||0, tag:'', sa:0 });
      if(out.length >= cap) break;
    }
  }
  return out;
}
function poolFor(cat){
  if(cat === 'ล่าสุด')  return recentFoods(24);
  if(cat === 'ของฉัน')  return myFoods().slice();
  if(cat === 'ทั้งหมด') return myFoods().concat(FOODS);
  return myFoods().concat(FOODS).filter(function(f){ return f.cat === cat; });
}
function mealByClock(){
  const h = new Date().getHours() + new Date().getMinutes()/60;
  if(h < 10.5) return 'breakfast';
  if(h < 15)   return 'lunch';
  if(h < 20.5) return 'dinner';
  return 'snack';
}

/* ---------- VARIANTS ---------- */
const SIZES = { half:{label:'ครึ่งเดียว', m:.6}, normal:{label:'ธรรมดา', m:1}, special:{label:'พิเศษ', m:1.4} };
const SWEETS = { none:{label:'ไม่หวาน', m:0}, less:{label:'หวานน้อย', m:.5}, normal:{label:'หวานปกติ', m:1}, extra:{label:'หวานมาก', m:1.4} };
function hasTag(f, t){ return (f.tag || '').indexOf(t) >= 0; }
function variant(f, o){
  const sm = SIZES[o.size] ? SIZES[o.size].m : 1;
  const it = { n:f.n, u:f.u,
    kcal:f.kcal*sm, p:f.p*sm, f:f.f*sm, c:f.c*sm,
    sug:(f.sug||0)*sm, na:(f.na||0)*sm, fib:(f.fib||0)*sm, k:(f.k||0)*sm };
  if(hasTag(f,'sweet') && f.sa > 0 && o.sweet && o.sweet !== 'normal'){
    const delta = f.sa * sm * (SWEETS[o.sweet].m - 1);   /* negative when reduced */
    it.sug = Math.max(0, it.sug + delta);
    it.c   = Math.max(0, it.c + delta);
    it.kcal = Math.max(0, it.kcal + delta*4);
  }
  const bits = [];
  if(hasTag(f,'size') && o.size !== 'normal') bits.push(SIZES[o.size].label);
  if(hasTag(f,'sweet') && o.sweet !== 'normal') bits.push(SWEETS[o.sweet].label);
  if(bits.length) it.n = f.n + ' (' + bits.join(', ') + ')';
  return it;
}

/* ---------- MATH ENGINE ---------- */
function bmr(){
  const p = S.profile;
  const base = 10*p.weight + 6.25*p.height - 5*p.age;
  return p.sex === 'M' ? base + 5 : base - 161;
}
function kcalPerMin(type, intensity){
  return EXER[type].met[intensity] * 3.5 * S.profile.weight / 200;
}
function exKcal(type, mins, intensity){ return kcalPerMin(type, intensity) * mins; }
function sumEx(d){ return d.ex.reduce(function(a,x){ return a + x.kcal; }, 0); }
function totals(k){
  const d = day(k); const t = { kcal:0,p:0,f:0,c:0,sug:0,na:0,fib:0,k:0 };
  d.foods.forEach(function(x){
    const q = x.q || 1;
    t.kcal += x.kcal*q; t.p += x.p*q; t.f += x.f*q; t.c += x.c*q;
    t.sug += (x.sug||0)*q; t.na += (x.na||0)*q; t.fib += (x.fib||0)*q; t.k += (x.k||0)*q;
  });
  return t;
}
/* MODE A: BMR × baseFactor + Apple Watch Active Energy */
function budget(k){
  const d = day(k);
  const base = bmr() * S.profile.baseFactor;
  const manual = S.profile.watchCovers ? 0 : sumEx(d);
  return base + (d.watch || 0) + manual;
}
function net(k){ return budget(k) - totals(k).kcal; }
function hasData(k){ const d = S.days[k]; return !!(d && (d.foods.length || d.watch || d.ex.length)); }
function loggedDays(n){
  const out = []; let k = today();
  for(let i=0;i<90 && out.length<n;i++){ if(hasData(k)) out.push(k); k = shiftKey(k,-1); }
  return out;
}
function avgNet(n){
  const ks = loggedDays(n||7); if(!ks.length) return null;
  return ks.reduce(function(a,k){ return a + net(k); },0) / ks.length;
}
function kgPerWeek(){ const a = avgNet(7); if(a===null) return null; return -(a*7)/7700; }
function macroTargets(){
  const p = S.profile, w = p.weight;
  const pt = p.proteinPerKg * w, ft = p.fatPerKg * w;
  const bud = budget(today()) - p.targetDeficit;
  const ct = Math.max(50, (bud - pt*4 - ft*9) / 4);
  return { p:pt, f:ft, c:ct, kcal:bud };
}
function streak(){
  let n = 0, k = today();
  if(!(S.days[k] && S.days[k].foods.length)) k = shiftKey(k,-1);
  for(let i=0;i<400;i++){
    if(S.days[k] && S.days[k].foods.length){ n++; k = shiftKey(k,-1); } else break;
  }
  return n;
}
/* auto-calibration of real TDEE from observed weight change */
function calibrate(){
  const ks = [];
  for(let i=0;i<60;i++){ const k = shiftKey(today(),-i); if(hasData(k)) ks.push(k); }
  if(ks.length < 10) return null;
  const wk = ks.filter(function(k){ return S.days[k].weight; });
  if(wk.length < 2) return null;
  const newest = wk[0], oldest = wk[wk.length-1];
  const spanDays = Math.round((new Date(newest+'T12:00:00') - new Date(oldest+'T12:00:00'))/86400000);
  if(spanDays < 10) return null;
  const inSpan = ks.filter(function(k){ return k <= newest && k >= oldest; });
  if(inSpan.length < spanDays*0.6) return null;
  const avgIn = inSpan.reduce(function(a,k){ return a + totals(k).kcal; },0)/inSpan.length;
  const avgWatch = inSpan.reduce(function(a,k){ return a + (S.days[k].watch||0); },0)/inSpan.length;
  const dW = S.days[newest].weight - S.days[oldest].weight;
  const realTDEE = avgIn - (dW*7700)/spanDays;
  const modelTDEE = bmr()*S.profile.baseFactor + avgWatch;
  const impliedFactor = (realTDEE - avgWatch)/bmr();
  return { days:spanDays, n:inSpan.length, avgIn:avgIn, dW:dW,
           real:realTDEE, model:modelTDEE, factor:clamp(impliedFactor, 1.0, 2.0) };
}

      body:'ช่วง '+ws.length+' ครั้งที่ชั่งล่าสุด น้ำหนักขึ้น '+r1(dW)+' กก. ทั้งที่ยังขาดดุลเฉลี่ย '+r0(a)+' kcal/วัน — <b>ในทางฟิสิกส์เป็นไปไม่ได้ที่จะสร้างไขมันจากการขาดดุล</b> สาเหตุที่พบบ่อยคือน้ำจากโซเดียม ไกลโคเจน อาหารค้างในลำไส้ หรือประเมินแคลอาหารต่ำกว่าจริง',
      tips:['ชั่งเวลาเดิมทุกวัน ตื่นนอน หลังเข้าห้องน้ำ ก่อนกินอะไร','ดูเส้นค่าเฉลี่ย 7 วันในแท็บ DATA ไม่ใช่ตัวเลขรายวัน','ถ้าผ่านไป 3 สัปดาห์เส้นเฉลี่ยยังไม่ลง แปลว่างบแคลที่ประเมินไว้สูงเกินจริง ใช้ AUTO-CALIBRATE ปรับได้'] };
  }
  return null;
}

/* ==========================================================
   BURN PLAN
   ========================================================== */
function burnTargetKcal(){
  const k = today(), b = budget(k), t = totals(k), left = b - t.kcal;
  if(BURN.goal === 'clear') return Math.max(0, -left);
  if(BURN.goal === 'target') return Math.max(0, S.profile.targetDeficit - left);
  return Math.max(0, BURN.custom || 0);
}
function burnRows(kcal, intensity){
  const rows = Object.keys(EXER).map(function(t){
    const rate = kcalPerMin(t, intensity);
    return { type:t, th:EXER[t].th, label:EXER[t].label, rate:rate, mins:kcal/rate, mix:null };
  });
  const each = kcal/3;
  const mixMins = Object.keys(EXER).map(function(t){ return { t:t, m:each/kcalPerMin(t,intensity) }; });
  rows.push({ type:'mix', th:'ผสม 3 ท่า (เฉลี่ยกัน)', label:'COMBINED CIRCUIT',
    rate:null, mins:mixMins.reduce(function(a,x){ return a+x.m; },0), mix:mixMins });
  return rows;
}

function topSources(k, t){
  const d = day(k);
  if(!d.foods.length) return '';
  const rank = d.foods.map(function(x){ return { n:x.n, v:x.kcal*(x.q||1) }; })
                      .sort(function(a,b){ return b.v - a.v; }).slice(0,3);
  return '<div style="margin-top:12px;border-top:1px solid var(--p-dim);padding-top:9px">'
    + '<div style="font-size:10px;letter-spacing:2px;color:var(--p-mid);margin-bottom:6px">ตัวการหลักวันนี้</div>'
    + rank.map(function(o){
        const pct = clamp(o.v/Math.max(1,t.kcal)*100, 0, 100);
        return '<div class="sp" style="grid-template-columns:1fr 78px 62px;margin-bottom:5px">'
          + '<em class="th" style="color:var(--p-hot);letter-spacing:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(o.n)+'</em>'
          + '<div class="bar thin"><i data-w="'+pct+'"></i></div><u>'+r0(o.v)+' kcal</u></div>';
      }).join('') + '</div>';
}

function diagnostics(){
  const k = today(), d = day(k), t = totals(k), b = budget(k), tg = macroTargets();
  const left = b - t.kcal, out = [], B = bmr(), TG = S.profile.targetDeficit;

  if(t.kcal === 0){
    out.push({lv:'warn', msg:'ยังไม่ได้บันทึกอาหารวันนี้ — ไปแท็บ <b>INV</b> แล้วกดเพิ่มรายการก่อน'});
  } else if(t.kcal < B){
    out.push({lv:'bad', msg:'<b>กินต่ำกว่า BMR ('+r0(B)+' kcal)</b> — ระดับนี้ยังไม่พอสำหรับการทำงานพื้นฐานของร่างกาย ตัดแคลแรงขนาดนี้ไม่ได้ทำให้ผอมเร็วขึ้น แต่ทำให้กล้ามหาย แรงตก และเผาผลาญช้าลงระยะยาว — เพิ่มอาหารอีกอย่างน้อย '+r0(B-t.kcal)+' kcal (เน้นโปรตีน)'});
  } else if(left < 0){
    out.push({lv:'bad', msg:'<b>เกินงบ '+r0(-left)+' kcal</b> วันนี้จะเป็นวันสะสม ไม่ใช่วันลด'});
  } else if(left > 1000){
    out.push({lv:'warn', msg:'ขาดดุล '+r0(left)+' kcal แรงเกินไป — ช่วงที่ยั่งยืนคือ 300–700 kcal/วัน'});
  } else if(left >= TG*0.75 && left <= TG*1.35){
    out.push({lv:'ok', msg:'ขาดดุล '+r0(left)+' kcal ตรงเป้า — ถ้ารักษาระดับนี้ได้ ลงประมาณ '+r1(left*7/7700)+' กก./สัปดาห์'});
  } else if(left > TG*1.35){
    out.push({lv:'warn', msg:'ขาดดุล '+r0(left)+' kcal มากกว่าเป้าที่ตั้งไว้ ('+TG+') — ลดเร็วขึ้นก็จริง แต่ถ้าทำทุกวันจะเหนื่อยและกล้ามหายง่ายกว่า'});
  } else {
    out.push({lv:'warn', msg:'ขาดดุลแค่ '+r0(left)+' kcal ต่ำกว่าเป้า ('+TG+') — อีก '+r0(TG-left)+' kcal จะเข้าเป้า'});
  }

  if(t.kcal > 0){
    if(t.p < tg.p*0.7) out.push({lv:'warn', msg:'<b>โปรตีนน้อยไป</b> ('+r0(t.p)+' จากเป้า '+r0(tg.p)+' g) — เพิ่มอกไก่/ไข่/เวย์อีก '+r0(tg.p-t.p)+' g'});
    else if(t.p >= tg.p*0.9) out.push({lv:'ok', msg:'โปรตีน '+r0(t.p)+' g เข้าเป้าแล้ว'});
    if(t.f > tg.f*1.5) out.push({lv:'warn', msg:'<b>ไขมันเยอะไป</b> ('+r0(t.f)+' จากเป้า '+r0(tg.f)+' g) — ไขมัน 1 g = 9 kcal มากกว่าคาร์บเท่าตัว'});
    if(t.f < tg.f*0.5) out.push({lv:'warn', msg:'ไขมันต่ำเกินไป ('+r0(t.f)+' g) — จำเป็นต่อฮอร์โมนและการดูดซึมวิตามิน'});
    if(t.c > tg.c*1.4) out.push({lv:'warn', msg:'<b>คาร์บเยอะไป</b> ('+r0(t.c)+' จากเป้า '+r0(tg.c)+' g)'});
    if(t.na > S.profile.naLimit) out.push({lv:'bad', msg:'<b>โซเดียมเกิน</b> ('+r0(t.na)+' จากเพดาน '+S.profile.naLimit+' mg)'});
    if(t.sug > S.profile.sugLimit) out.push({lv:'warn', msg:'<b>น้ำตาลเกิน</b> ('+r0(t.sug)+' จากเพดาน '+S.profile.sugLimit+' g)'});
  }
  const active = (d.watch||0) + sumEx(d);
  if(active === 0) out.push({lv:'warn', msg:'ยังไม่มี Active Energy วันนี้ — กรอกเลขจาก Apple Watch ในแท็บ <b>PERKS</b>'});
  else out.push({lv:'ok', msg:'Active Energy '+r0(active)+' kcal บันทึกแล้ว'});
  if((d.water||0) < S.profile.waterGoal) out.push({lv:'warn', msg:'น้ำยังขาดอีก '+(S.profile.waterGoal-(d.water||0))+' แก้ว'});

  let lastW = null;
  for(let i=0;i<7;i++){ const kk = shiftKey(today(),-i); if(S.days[kk] && S.days[kk].weight){ lastW = i; break; } }
  if(lastW === null) out.push({lv:'warn', msg:'ยังไม่มีน้ำหนักบันทึกใน 7 วันนี้ — กราฟพยากรณ์ยังทำงานไม่เต็มที่'});

  const order = { bad:0, warn:1, ok:2 };
  out.sort(function(a,b2){ return order[a.lv] - order[b2.lv]; });
  return out;
}

function viewPerks(){
  const k = today(), d = day(k);
  const manual = sumEx(d);
  const counted = S.profile.watchCovers;
  const target = burnTargetKcal();
  const rows = burnRows(target, BURN.intensity);
  const feasible = rows.filter(function(r){ return r.mins <= 45 && r.mins > 0; });
  const bestMins = feasible.length ? Math.min.apply(null, feasible.map(function(r){ return r.mins; })) : null;

  const goalSeg = '<div class="seg">'
    + '<button data-bg="clear" class="'+(BURN.goal==='clear'?'on':'')+'">ล้างส่วนเกิน</button>'
    + '<button data-bg="target" class="'+(BURN.goal==='target'?'on':'')+'">ให้ถึงเป้าขาดดุล</button>'
    + '<button data-bg="custom" class="'+(BURN.goal==='custom'?'on':'')+'">กำหนดเอง</button></div>';
  const intSeg = '<div class="seg">'
    + ['light','mod','hard'].map(function(i){
        return '<button data-bi="'+i+'" class="'+(BURN.intensity===i?'on':'')+'">'+INT_TH[i]+'</button>'; }).join('')
    + '</div>';

  const burnHtml = target <= 0
    ? '<div class="warnbox">ตอนนี้ยังไม่ต้องออกกำลังกายเพิ่มเพื่อเป้านี้ — ตัวเลขวันนี้อยู่ในกรอบแล้ว จะออกเพราะอยากแข็งแรงก็ดี แต่ไม่ใช่เพราะต้องชดเชยอะไร</div>'
    : rows.map(function(r){
        const cls = r.mins > 75 ? 'impossible' : (r.mins > 45 ? 'hard' : (bestMins !== null && Math.abs(r.mins-bestMins) < 0.01 ? 'best' : ''));
        const sub = r.mix
          ? r.mix.map(function(x){ return EXER[x.t].th+' '+r0(x.m)+' น.'; }).join(' + ')
          : r.label + ' · ' + r1(r.rate) + ' kcal/นาที';
        const val = r.mins > 120 ? 'เกินจริง' : r0(r.mins);
        return '<div class="burn '+cls+'"><div class="bn">'+r.th+'<s>'+sub+'</s></div>'
          + '<div class="bt"><em>'+val+'</em><u>'+(r.mins>120?'ไม่ไหว':'นาที')+'</u></div></div>';
      }).join('');

  let cards = '';
  Object.keys(EXER).forEach(function(t){
    const e = EXER[t];
    cards += '<div class="box"><h2>'+e.label+'<span class="th">'+e.th+'</span></h2>'
      + '<div class="row r2">'
        + '<div><label class="f">นาที</label><input type="number" id="m_'+t+'" value="10" min="1"></div>'
        + '<div><label class="f">ความหนัก</label><select id="i_'+t+'">'
          + ['light','mod','hard'].map(function(i){
              return '<option value="'+i+'"'+(i==='mod'?' selected':'')+'>'+INT_TH[i]+' (MET '+e.met[i]+')</option>'; }).join('')
        + '</select></div>'
      + '</div>'
      + '<div class="btnrow"><button class="btn pri" data-ex="'+t+'">บันทึก</button>'
      + '<button class="btn sm" data-exq="'+t+'|5">5 น.</button>'
      + '<button class="btn sm" data-exq="'+t+'|10">10 น.</button>'
      + '<button class="btn sm" data-exq="'+t+'|20">20 น.</button></div>'
      + '<div class="note">10 นาที ปานกลาง ≈ <b>'+r0(exKcal(t,10,'mod'))+' kcal</b> (ที่ '+S.profile.weight+' kg)</div>'
    + '</div>';
  });

  const log = d.ex.length ? '<ul class="items">' + d.ex.map(function(x){
      return '<li><span class="nm">'+EXER[x.type].th+' '+x.mins+' นาที<s>'+EXER[x.type].label+' · '+INT_TH[x.intensity]+'</s></span>'
        + '<span></span><span class="kc">'+r0(x.kcal)+'</span><button class="xbtn" data-delex="'+x.id+'">×</button></li>';
    }).join('') + '</ul>' : '<div class="empty">— ยังไม่ได้ออกกำลังกายวันนี้ —</div>';

  return ''
  + '<div class="box"><h2>APPLE WATCH UPLINK<span>ACTIVE ENERGY</span></h2>'
    + '<div class="row r2">'
      + '<div><label class="f">ACTIVE ENERGY วันนี้ (kcal)</label>'
        + '<input type="number" id="watchIn" value="'+(d.watch||0)+'" placeholder="เช่น 300"></div>'
      + '<div><label class="f">โหมดคำนวณ</label><select id="coversSel">'
          + '<option value="1"'+(counted?' selected':'')+'>นาฬิกานับการออกกำลังกายแล้ว (แนะนำ)</option>'
          + '<option value="0"'+(!counted?' selected':'')+'>นับท่าออกกำลังกายเพิ่มจากนาฬิกา</option>'
        + '</select></div>'
    + '</div>'
    + '<div class="btnrow"><button class="btn pri" id="saveWatch">บันทึกค่า Active Energy</button></div>'
    + (counted
      ? '<div class="warnbox">โหมดนี้ระบบจะ <b>ไม่บวก</b> แคลจากท่าออกกำลังกายซ้ำ เพราะ Apple Watch นับไปแล้ว — รายการด้านล่างเก็บเป็นสถิติการฝึก (ตอนนี้ '+r0(manual)+' kcal)</div>'
      : '<div class="warnbox rad">โหมดนี้จะบวกแคลจากท่าออกกำลังกาย ('+r0(manual)+' kcal) <b>เพิ่มจาก</b>ตัวเลขนาฬิกา — ใช้เฉพาะตอนไม่ได้ใส่นาฬิกา ไม่งั้นนับซ้ำ</div>')
  + '</div>'

  + '<div class="box" style="margin-top:12px"><h2>BURN PLAN<span>ต้องออกเท่าไหร่ถึงจะพอ</span></h2>'
    + '<div class="row r2"><div><label class="f">เป้าหมาย</label>'+goalSeg+'</div>'
    + '<div><label class="f">ความหนักที่จะออก</label>'+intSeg+'</div></div>'
    + (BURN.goal==='custom' ? '<label class="f">อยากเผากี่ kcal</label><input type="number" id="burnCustom" value="'+BURN.custom+'">'
        + '<div class="btnrow"><button class="btn sm pri" id="setBurn">คำนวณ</button></div>' : '')
    + '<div style="margin:11px 0 8px;font-size:11px;letter-spacing:2px;color:var(--p-mid)">'
      + (target>0 ? 'ต้องเผาอีก <b style="color:var(--p-hot);font-size:15px">'+r0(target)+'</b> KCAL' : 'ไม่มีส่วนที่ต้องเผาเพิ่ม') + '</div>'
    + burnHtml
    + '<div class="note">ตัวเลขนี้เป็นเครื่องมือวางแผน <b>ไม่ใช่บทลงโทษ</b> — การออกกำลังกายชดเชยมื้อใหญ่มักไม่คุ้มแรง สิ่งที่ได้ผลกว่าคือค่าเฉลี่ยทั้งสัปดาห์ ถ้าตัวเลขขึ้นว่า "ไม่ไหว" ให้ข้ามไปคุมมื้อพรุ่งนี้แทน อย่าฝืน</div>'
  + '</div>'

  + '<div class="grid g3" style="margin-top:12px">'+cards+'</div>'

  + '<div class="box" style="margin-top:12px"><h2>TRAINING LOG<span>'+r0(manual)+' KCAL ประมาณการ</span></h2>'+log+'</div>'

  + '<div class="box" style="margin-top:12px"><h2>สูตรที่ใช้<span>อ้างอิงตรวจสอบได้</span></h2>'
    + '<pre>kcal = MET × 3.5 × น้ำหนัก(kg) ÷ 200 × นาที\nBMR  = 10×kg + 6.25×cm − 5×อายุ '+(S.profile.sex==='M'?'+ 5':'− 161')+'   (Mifflin-St Jeor)\nงบวันนี้ = BMR × '+S.profile.baseFactor+' + Active Energy</pre>'
  + '</div>';
}

function viewData(){
  const wk = kgPerWeek(), avg = avgNet(7), nDays = loggedDays(7).length;
  const cur = currentWeight(), goal = S.profile.goal;
  let eta = '—', etaNote = 'ยังคำนวณไม่ได้';
  if(wk !== null && Math.abs(wk) > 0.01){
    const diff = cur - goal;
    if(diff > 0 && wk < 0){
      const weeks = diff / (-wk); const dte = new Date(); dte.setDate(dte.getDate() + weeks*7);
      eta = dte.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
      etaNote = 'อีก ~'+r1(weeks)+' สัปดาห์ ถ้ารักษาระดับนี้';
    } else if(diff <= 0){ eta = 'ถึงแล้ว'; etaNote = 'น้ำหนักถึงเป้าหมายแล้ว'; }
    else { eta = 'ไม่ถึง'; etaNote = 'เทรนด์ปัจจุบันน้ำหนักขึ้น ไม่ลด'; }
  }
  const cal = calibrate();
  const calHtml = cal
    ? '<div class="note">จากข้อมูลจริง '+cal.n+' วัน ในช่วง '+cal.days+' วัน: กินเฉลี่ย <b>'+r0(cal.avgIn)+'</b> kcal/วัน '
      + 'น้ำหนัก'+(cal.dW<0?'ลด':'ขึ้น')+' <b>'+r1(Math.abs(cal.dW))+'</b> กก.</div>'
      + '<div class="stat4" style="margin-top:10px">'
        + '<div><s>สูตรประเมินไว้</s><b>'+r0(cal.model)+'</b><i>kcal/วัน</i></div>'
        + '<div><s>ของจริง</s><b>'+r0(cal.real)+'</b><i>kcal/วัน</i></div>'
        + '<div><s>ต่างกัน</s><b>'+(cal.real>cal.model?'+':'')+r0(cal.real-cal.model)+'</b><i>kcal/วัน</i></div>'
        + '<div><s>ตัวคูณที่ควรใช้</s><b>'+(Math.round(cal.factor*100)/100)+'</b><i>จาก '+S.profile.baseFactor+'</i></div>'
      + '</div>'
      + '<div class="btnrow"><button class="btn pri" id="applyCal">ปรับตัวคูณเป็น '+(Math.round(cal.factor*100)/100)+'</button></div>'
      + '<div class="note">ระบบย้อนคำนวณจากน้ำหนักที่เปลี่ยนจริง ไม่ใช่จากสูตรมาตรฐาน — ยิ่งบันทึกครบ ยิ่งแม่น ถ้าตัวเลขต่างกันมาก มักแปลว่าประเมินแคลอาหารต่ำกว่าจริง หรือขยับตัวมากกว่าที่คิด</div>'
    : '<div class="empty">ต้องมีข้อมูลอย่างน้อย 10 วัน และชั่งน้ำหนักห่างกันอย่างน้อย 10 วัน ระบบถึงจะย้อนคำนวณ TDEE จริงได้ — ตอนนี้ยังไม่พอ บันทึกต่อไปเรื่อยๆ</div>';

  const rows = loggedDays(7).slice().reverse().map(function(k){
    const t = totals(k), b = budget(k), n = b - t.kcal;
    return '<li><span class="nm">'+thDate(k,{weekday:'short',day:'numeric',month:'short'})

function weeklyReport(){
  const ks = loggedDays(7);
  if(!ks.length) return 'ยังไม่มีข้อมูลพอสำหรับสรุปสัปดาห์';
  const p = S.profile;
  const agg = { kcal:0,b:0,p:0,f:0,c:0,sug:0,na:0,fib:0,k:0 };
  let naOver = 0, sugOver = 0, overDays = 0, best = null, worst = null;
  ks.forEach(function(k){
    const t = totals(k), b = budget(k), n = b - t.kcal;
    agg.kcal += t.kcal; agg.b += b; agg.p += t.p; agg.f += t.f; agg.c += t.c;
    agg.sug += t.sug; agg.na += t.na; agg.fib += t.fib; agg.k += t.k;
    if(t.na > p.naLimit) naOver++;
    if(t.sug > p.sugLimit) sugOver++;
    if(n < 0) overDays++;
    if(!best || n > best.n) best = {k:k,n:n};
    if(!worst || n < worst.n) worst = {k:k,n:n};
  });
  const N = ks.length;
  const ws = ks.filter(function(k){ return S.days[k].weight; });
  const wLine = ws.length >= 2
    ? r1(S.days[ws[ws.length-1]].weight)+' → '+r1(S.days[ws[0]].weight)+' กก. ('+((S.days[ws[0]].weight-S.days[ws[ws.length-1]].weight)>=0?'+':'')+r1(S.days[ws[0]].weight-S.days[ws[ws.length-1]].weight)+')'
    : 'ข้อมูลไม่พอ';
  const avgN = agg.b/N - agg.kcal/N;
  return ''
+ '=== NUTRI-BOY WEEKLY REPORT ===\n'
+ 'ช่วง        : '+thDate(ks[ks.length-1])+' – '+thDate(ks[0])+'  ('+N+' วันที่บันทึก)\n'
+ 'แคลเฉลี่ย   : '+r0(agg.kcal/N)+' kcal/วัน\n'
+ 'งบเฉลี่ย    : '+r0(agg.b/N)+' kcal/วัน\n'
+ 'ขาดดุลเฉลี่ย: '+r0(avgN)+' kcal/วัน  (เป้า '+p.targetDeficit+')\n'
+ 'คาดการณ์    : '+(avgN>0?'-':'+')+r1(Math.abs(avgN*7/7700))+' กก./สัปดาห์\n'
+ 'น้ำหนัก     : '+wLine+'\n'
+ '\n'
+ 'โปรตีนเฉลี่ย: '+r0(agg.p/N)+' g  (เป้า '+r0(p.proteinPerKg*p.weight)+')\n'
+ 'ไขมันเฉลี่ย : '+r0(agg.f/N)+' g\n'
+ 'คาร์บเฉลี่ย : '+r0(agg.c/N)+' g\n'
+ 'ใยอาหาร     : '+r1(agg.fib/N)+' g/วัน  (เป้า '+p.fibGoal+')\n'
+ 'โซเดียม     : '+r0(agg.na/N)+' mg/วัน  — เกินเพดาน '+naOver+'/'+N+' วัน\n'
+ 'น้ำตาล      : '+r0(agg.sug/N)+' g/วัน   — เกินเพดาน '+sugOver+'/'+N+' วัน\n'
+ 'โพแทสเซียม  : '+r0(agg.k/N)+' mg/วัน  (เป้า '+p.kGoal+')\n'
+ 'สัดส่วน K:Na : '+(agg.na?r1(agg.k/agg.na):'—')+'  (ควร ≥ 1.75)\n'
+ '\n'
+ 'วันที่เกินงบ : '+overDays+'/'+N+' วัน\n'
+ 'ดีที่สุด     : '+thDate(best.k)+'  (ขาดดุล '+r0(best.n)+' kcal)\n'
+ 'หลุดมากสุด  : '+thDate(worst.k)+'  ('+(worst.n>=0?'ขาดดุล ':'เกิน ')+r0(Math.abs(worst.n))+' kcal)';
}
function currentWeight(){
  for(let i=0;i<60;i++){ const k = shiftKey(today(),-i); if(S.days[k] && S.days[k].weight) return S.days[k].weight; }
  return S.profile.weight;
}
function maSeries(){
  const arr = [];
  for(let i=29;i>=0;i--){
    const k = shiftKey(today(),-i);
    arr.push({ k:k, w:(S.days[k] && S.days[k].weight) ? S.days[k].weight : null });
  }
  arr.forEach(function(o,i){
    const win = arr.slice(Math.max(0,i-6), i+1).filter(function(x){ return x.w; });
    o.ma = win.length ? win.reduce(function(a,x){ return a + x.w; },0)/win.length : null;
  });
  return arr;
}

/* ---------- CHARTS ---------- */
function ctxOf(id, h){
  const cv = el(id); if(!cv) return null;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 600;
  cv.width = w*dpr; cv.height = h*dpr; cv.style.height = h+'px';
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  return { c:c, w:w, h:h };
}
function gridLines(c,w,h,pl,pr,pt,pb,rows){
  c.strokeStyle = 'rgba(30,148,85,.28)'; c.lineWidth = 1;
  for(let i=0;i<=rows;i++){ const y = pt + (h-pt-pb)*i/rows;
    c.beginPath(); c.moveTo(pl, y+.5); c.lineTo(w-pr, y+.5); c.stroke(); }
}
function drawCharts(){ drawIntake(); drawWeight(); }
function drawIntake(){
  const o = ctxOf('cIntake', 220); if(!o) return;
  const c = o.c, w = o.w, h = o.h, pl = 42, pr = 10, pt = 12, pb = 26;
  const ks = []; for(let i=13;i>=0;i--) ks.push(shiftKey(today(),-i));
  const vals = ks.map(function(k){ return { k:k, in:totals(k).kcal, b:budget(k) }; });
  const max = Math.max(3000, Math.max.apply(null, vals.map(function(v){ return Math.max(v.in, v.b); }))*1.1);
  gridLines(c,w,h,pl,pr,pt,pb,4);
  c.fillStyle = 'rgba(30,148,85,.85)'; c.font = '10px "Share Tech Mono",monospace'; c.textAlign = 'right';
  for(let i=0;i<=4;i++){ const y = pt + (h-pt-pb)*i/4; c.fillText(r0(max - max*i/4), pl-6, y+3); }
  const bw = (w-pl-pr)/vals.length;
  vals.forEach(function(v,i){
    const x = pl + bw*i + bw*0.18, bwid = bw*0.64, hh = (v.in/max)*(h-pt-pb);
    if(v.in > 0){
      c.fillStyle = v.in > v.b ? 'rgba(255,80,51,.75)' : 'rgba(60,255,142,.6)';
      c.fillRect(x, h-pb-hh, bwid, hh);
      c.strokeStyle = v.in > v.b ? '#FF5033' : '#3CFF8E'; c.lineWidth = 1;
      c.strokeRect(x+.5, h-pb-hh+.5, bwid-1, hh-1);
    }
    if(i % 2 === 0){ c.fillStyle = 'rgba(30,148,85,.9)'; c.textAlign = 'center'; c.font = '9px "Share Tech Mono",monospace';
      c.fillText(v.k.slice(8), x+bwid/2, h-9); }
  });
  c.beginPath(); c.strokeStyle = '#FFB000'; c.lineWidth = 1.6;
  vals.forEach(function(v,i){ const x = pl + bw*i + bw/2, y = h-pb-(v.b/max)*(h-pt-pb); i ? c.lineTo(x,y) : c.moveTo(x,y); });
  c.stroke();
}
function drawWeight(){
  const o = ctxOf('cWeight', 240); if(!o) return;
  const c = o.c, w = o.w, h = o.h, pl = 42, pr = 10, pt = 14, pb = 26;
  const hist = maSeries(), cur = currentWeight(), wk = kgPerWeek();
  const proj = []; for(let i=1;i<=28;i++) proj.push(cur + (wk===null?0:wk)*(i/7));
  const all = hist.map(function(x){ return x.w; }).filter(Boolean).concat(proj, [S.profile.goal, cur]);
  let lo = Math.min.apply(null, all) - 1, hi = Math.max.apply(null, all) + 1;
  if(hi - lo < 3){ const m = (hi+lo)/2; lo = m-1.5; hi = m+1.5; }
  const N = hist.length + proj.length;
  const X = function(i){ return pl + (w-pl-pr)*i/(N-1); };
  const Y = function(v){ return h-pb - (v-lo)/(hi-lo)*(h-pt-pb); };
  gridLines(c,w,h,pl,pr,pt,pb,4);
  c.fillStyle = 'rgba(30,148,85,.85)'; c.font = '10px "Share Tech Mono",monospace'; c.textAlign = 'right';
  for(let i=0;i<=4;i++){ const y = pt + (h-pt-pb)*i/4; c.fillText(r1(hi - (hi-lo)*i/4), pl-6, y+3); }
  c.save(); c.setLineDash([5,5]); c.strokeStyle = 'rgba(255,80,51,.8)'; c.lineWidth = 1.4;
  c.beginPath(); c.moveTo(pl, Y(S.profile.goal)); c.lineTo(w-pr, Y(S.profile.goal)); c.stroke(); c.restore();
  c.fillStyle = 'rgba(255,80,51,.9)'; c.textAlign = 'left'; c.font = '9px "Share Tech Mono",monospace';
  c.fillText('GOAL '+S.profile.goal, pl+4, Y(S.profile.goal)-4);
  c.save(); c.setLineDash([2,4]); c.strokeStyle = 'rgba(207,255,228,.35)';
  c.beginPath(); c.moveTo(X(hist.length-1), pt); c.lineTo(X(hist.length-1), h-pb); c.stroke(); c.restore();
  c.fillStyle = 'rgba(30,148,85,.95)';
  hist.forEach(function(o2,i){ if(o2.w){ c.beginPath(); c.arc(X(i), Y(o2.w), 2.6, 0, 7); c.fill(); } });
  c.beginPath(); c.strokeStyle = '#3CFF8E'; c.lineWidth = 2; c.shadowColor = 'rgba(60,255,142,.6)'; c.shadowBlur = 6;
  let started = false;
  hist.forEach(function(o2,i){ if(o2.ma === null) return; const x = X(i), y = Y(o2.ma);
    started ? c.lineTo(x,y) : (c.moveTo(x,y), started = true); });
  c.stroke(); c.shadowBlur = 0;
  c.save(); c.setLineDash([6,4]); c.beginPath(); c.strokeStyle = '#FFB000'; c.lineWidth = 1.8;
  c.moveTo(X(hist.length-1), Y(cur));
  proj.forEach(function(v,i){ c.lineTo(X(hist.length+i), Y(v)); });
  c.stroke(); c.restore();
  c.fillStyle = '#FFB000'; c.textAlign = 'right'; c.font = '11px "Share Tech Mono",monospace';
  c.fillText(r1(proj[proj.length-1])+' kg', w-pr-4, clamp(Y(proj[proj.length-1])-10, pt+11, h-pb-14));
  c.textAlign = 'center'; c.fillStyle = 'rgba(207,255,228,.5)'; c.font = '9px "Share Tech Mono",monospace';
  c.fillText('วันนี้', X(hist.length-1), h-9); c.fillText('+28 วัน', X(N-1)-16, h-9);
}

function prune(){
  Object.keys(S.days).forEach(function(k){

function addEx(type, mins, intensity){

function readMyForm(){

function importMyFoods(raw){
  let data;
  try{ data = JSON.parse((raw||'').trim()); }
  catch(e){ toast('JSON ไม่ถูกต้อง — ตรวจวงเล็บกับเครื่องหมายคำพูดอีกที'); return; }
  const arr = Array.isArray(data) ? data : (data.foods || data.items || []);
  if(!Array.isArray(arr) || !arr.length){ toast('ไม่พบรายการอาหารใน JSON นี้'); return; }
  let added = 0, updated = 0;
  arr.forEach(function(x){
    const n = x.n || x.name; if(!n) return;
    const rec = { n:n, u:x.u||'', cat:MYCATS.indexOf(x.cat)>=0 ? x.cat : 'โปรตีน', tag:x.tag||'',
      kcal:+(x.kcal||0), p:+(x.p||0), f:+(x.f||0), c:+(x.c||0),
      sug:+(x.sug||0), na:+(x.na||0), fib:+(x.fib||0), sa:+(x.sa||0), k:+(x.k||0) };
    const i = myFoods().map(function(y){ return y.n; }).indexOf(n);
    if(i >= 0){ rec.id = myFoods()[i].id; myFoods()[i] = rec; updated++; }
    else { rec.id = uid(); myFoods().push(rec); added++; }
  });
  beep(1318,.09); save();
  toast('นำเข้าคลัง: เพิ่ม '+added+' · อัปเดต '+updated+' รายการ');
}
function importItems(raw){
  let data;
  try{ data = JSON.parse(raw.trim()); }
  catch(e){ toast('JSON ไม่ถูกต้อง — ตรวจวงเล็บกับเครื่องหมายคำพูดอีกที'); return; }
  const items = Array.isArray(data) ? data : (data.items || data.foods || []);
  if(!Array.isArray(items) || !items.length){ toast('ไม่พบรายการอาหารใน JSON นี้'); return; }
  const targetKey = (!Array.isArray(data) && data.date) ? data.date : today();
  const d = day(targetKey);
  let n = 0;
  items.forEach(function(x){
    const name = x.n || x.name; if(!name) return;
    d.foods.push({ id:uid(), n:name, q:+(x.q||x.qty||1), u:x.u||'',
      kcal:+(x.kcal||x.cal||0), p:+(x.p||x.protein||0), f:+(x.f||x.fat||0), c:+(x.c||x.carb||0),
      sug:+(x.sug||x.sugar||0), na:+(x.na||x.sodium||0), fib:+(x.fib||x.fiber||0), k:+(x.k||x.potassium||0),
      meal: MEALS[x.meal] ? x.meal : MEAL });
    n++;
  });
  beep(1318,.09); save(); toast('นำเข้า '+n+' รายการเรียบร้อย');
}

function suppState(){
  if(!S.supp) S.supp = { on:[], dose:{}, start:{}, log:{} };
  if(!S.supp.on) S.supp.on = [];
  if(!S.supp.dose) S.supp.dose = {};
  if(!S.supp.start) S.supp.start = {};
  if(!S.supp.log) S.supp.log = {};
  return S.supp;
}
function suppById(id){ return SUPPS.filter(function(x){ return x.id === id; })[0]; }
function suppDose(id){ const st = suppState(); const s = suppById(id);
  return (st.dose[id] !== undefined && st.dose[id] !== null) ? st.dose[id] : (s ? s.dose : 0); }
function tookToday(id){ const st = suppState(); return !!(st.log[today()] && st.log[today()][id]); }
function daysOn(id){
  const st = suppState(); const from = st.start[id];
  if(!from) return 0;
  return Math.round((new Date(today()+'T12:00:00') - new Date(from+'T12:00:00'))/86400000) + 1;
}

  const mgIds = on.filter(function(id){ const s = suppById(id); return s && s.tags.indexOf('magnesium') >= 0; });

    const total = mgIds.reduce(function(a,id){ return a + suppDose(id); }, 0);
    if(mgIds.length > 1 || total > 350){
      out.push({ lv: total > 350 ? 'bad' : 'warn', tag:'MAGNESIUM',
        title:'แมกนีเซียมรวม '+r0(total)+' mg/วัน จาก '+mgIds.length+' ตัว',
        body: total > 350
          ? 'เกินเพดานจากอาหารเสริม <b>350 mg/วัน</b> ไป '+r0(total-350)+' mg — อาการแรกที่จะเจอคือถ่ายเหลว ปวดบิดท้อง · แนะนำเลือกใช้ตัวเดียว'
          : 'ยังไม่เกินเพดาน 350 mg แต่กินสองตัวพร้อมกันโดยที่<b>ตัวออกไซด์ดูดซึมได้แค่ราว 4%</b> คือจ่ายเงินซ้ำเพื่อผลที่ได้น้อย',
        tips:['ถ้าเป้าหมายคือคุณภาพการนอนและกล้ามเนื้อ → ใช้ <b>Glycinate ตัวเดียว</b> พอ',
              'เก็บ Magnesium Oxide ไว้ใช้เฉพาะตอนท้องผูก ไม่ต้องกินประจำ'] });
    }
  }

  on.forEach(function(id){
    const s = suppById(id); if(!s) return;
    const d = suppDose(id);
    if(id === 'zinc' && d > 40){
      out.push({ lv:'bad', tag:'ZINC', title:'สังกะสี '+r0(d)+' mg/วัน เกินเพดาน 40 mg',
        body:'ที่โดสนี้ <b>ไม่ควรกินทุกวันต่อเนื่อง</b> ปัญหาที่ตามมาไม่ใช่พิษเฉียบพลัน แต่คือ<b>ภาวะขาดทองแดง</b>ที่ค่อยๆ สะสม ทำให้โลหิตจาง เม็ดเลือดขาวต่ำ และปลายประสาทอักเสบ',
        tips:['ใช้เป็นคอร์สสั้น 1–2 สัปดาห์ตอนป่วยหรือรู้สึกภูมิตก',
              'หรือกินวันเว้น 2–3 วัน เฉลี่ยแล้วจะเหลือ ~15–25 mg/วัน',
              'ถ้าจะกินยาวจริงๆ ปรึกษาเภสัชกรเรื่องเสริมทองแดง 1–2 mg'] });
    }
    if(id === 'selenium' && d >= 200){
      out.push({ lv:'warn', tag:'SELENIUM', title:'ซีลีเนียม '+r0(d)+' mcg/วัน = 3.6 เท่าของ RDA',
        body:'ยังไม่ถึงเพดาน 400 mcg แต่ถ้ากินทุกวันบวกกับอาหารทะเล ไข่ และเครื่องใน จะเข้าใกล้เพดานเร็วกว่าที่คิด · การได้รับสูงต่อเนื่องนานสัมพันธ์กับความเสี่ยงเบาหวานชนิดที่ 2 ที่เพิ่มขึ้นในงานวิจัยบางฉบับ',
        tips:['เปลี่ยนเป็นกินวันเว้นวัน จะได้เฉลี่ย ~100 mcg/วัน ซึ่งเพียงพอและปลอดภัยกว่า'] });
    }
    if(s.cycleDays){
      const dn = daysOn(id);
      if(dn > s.cycleDays){
        out.push({ lv:'bad', tag:'CYCLE', title:s.n+' กินต่อเนื่องมา '+dn+' วันแล้ว',
          body:'เกินกรอบ '+s.cycleDays+' วัน (12 สัปดาห์) ที่งานวิจัยส่วนใหญ่ครอบคลุม — <b>ถึงเวลาพัก 2–4 สัปดาห์</b>',
          tips:['กดปุ่มรีเซ็ตรอบเมื่อเริ่มกินใหม่'] });

        out.push({ lv:'warn', tag:'CYCLE', title:s.n+' เหลืออีก '+(s.cycleDays-dn)+' วันจะครบรอบ',
          body:'วางแผนพัก 2–4 สัปดาห์ไว้ล่วงหน้าได้เลย', tips:[] });

    }
    if(s.tags.indexOf('low-value') >= 0){
      out.push({ lv:'warn', tag:'VALUE', title:s.n+' — โดสน่าจะต่ำเกินกว่าจะได้ผล',
        body:'ไม่ได้อันตราย แต่ที่ '+r0(d)+' '+s.u+' โอกาสเห็นผลจริงต่ำมากเมื่อเทียบกับโดสที่ใช้ในงานวิจัย',
        tips:['ถ้าจะเก็บงบไว้ใช้กับตัวอื่น ตัวนี้คือตัวแรกที่ตัดได้'] });
    }
  });

  if(has('caffeine') && has('theanine')){
    out.push({ lv:'ok', tag:'SYNERGY', title:'คาเฟอีน + แอลธีอะนีน = คู่ที่เข้ากันดี',
      body:'ธีอะนีนช่วยตัดอาการใจสั่นและความกังวลจากคาเฟอีน โดยไม่ลดความตื่นตัว · อัตราส่วนที่นิยมคือคาเฟอีน 1 : ธีอะนีน 2',

      tips:['ถ้านอน 23:00 ให้กินครั้งสุดท้ายไม่เกิน 14:00',
            'พี่มีข้อมูลการนอนใน Apple Watch อยู่แล้ว — ลองเทียบวันที่กินกับวันที่ไม่กิน จะเห็นชัด'] });
  }
  if(has('zinc') && (has('mgglycinate') || has('mgoxide'))){
    out.push({ lv:'warn', tag:'TIMING', title:'สังกะสีกับแมกนีเซียมแย่งการดูดซึมกัน',
      body:'ทั้งคู่ใช้ตัวขนส่งในลำไส้ร่วมกัน กินพร้อมกันโดสสูงจะได้ทั้งคู่ไม่เต็มที่',
      tips:['สังกะสี → มื้อกลางวันพร้อมอาหาร · แมกนีเซียม → ก่อนนอน ห่างกันอย่างน้อย 2 ชม.'] });
  }
  const order = { bad:0, warn:1, ok:2 };
  out.sort(function(a,b){ return order[a.lv]-order[b.lv]; });
  return out;
}

function naK(){
  const t = totals(today()), p = S.profile;
  const ideal = Math.max(p.kGoal, t.na * 1.75);        /* WHO: Na<2000, K>3510 → K ≈ 1.75 × Na */
  const target = clamp(ideal, p.kGoal, 4700);          /* 4700 mg = เพดานที่กินจากอาหารได้จริง */
  const gap = Math.max(0, target - t.k);
  return { na:t.na, k:t.k, target:target, ideal:ideal, gap:gap, capped:ideal > 4700,
           ratio: t.k > 0 ? t.k / t.na : null };
}

  + '<div class="box" style="margin-top:12px"><h2>ตารางเวลาที่แนะนำ<span>จากชุดที่พี่กินอยู่</span></h2>'
    + suppSchedule()
  + '</div>';

function suppSchedule(){
  const st = suppState();
  const slots = [
    { t:'เช้า (ตื่นนอน–09:00)', ids:['caffeine','theanine','ksm66'] },
    { t:'กลางวัน (พร้อมอาหาร)',  ids:['zinc','selenium','acv','fishoil'] },
    { t:'ก่อนออกกำลังกาย',       ids:['taurine'] },
    { t:'ก่อนนอน',              ids:['mgglycinate','mgoxide'] }
  ];
  let any = false;
  const html = slots.map(function(sl){
    const items = sl.ids.filter(function(id){ return st.on.indexOf(id) >= 0; });
    if(!items.length) return '';
    any = true;
    return '<div class="mealhead"><span class="th">'+sl.t+'</span><b>'+items.length+' ตัว</b></div>'
      + '<div class="note" style="margin:4px 0 2px">'
      + items.map(function(id){ const s = suppById(id); return esc(s.n)+' '+r1(suppDose(id))+' '+esc(s.u); }).join(' · ')
      + '</div>';
  }).join('');
  return any ? html + '<div class="note" style="margin-top:10px">คาเฟอีนครั้งสุดท้ายไม่เกิน <b>14:00</b> ถ้านอนสี่ทุ่มถึงห้าทุ่ม · สังกะสีกับแมกนีเซียมห่างกันอย่างน้อย <b>2 ชม.</b></div>'
              : '<div class="empty">เลือกอาหารเสริมเข้าชุดก่อน แล้วหนูจะจัดตารางให้</div>';
}

function bindAid(m){
  m.querySelectorAll('[data-took]').forEach(function(b){ b.onclick = function(){
    const st = suppState(), k = today();
    if(!st.log[k]) st.log[k] = {};
    if(st.log[k][b.dataset.took]) delete st.log[k][b.dataset.took];
    else st.log[k][b.dataset.took] = 1;
    beep(1046,.05); save(); }; });
  m.querySelectorAll('[data-open]').forEach(function(b){ b.onclick = function(){
    SUPPOPEN = (SUPPOPEN === b.dataset.open) ? null : b.dataset.open; beep(700,.04); render(); }; });
  m.querySelectorAll('[data-toggle]').forEach(function(b){ b.onclick = function(){
    const st = suppState(), id = b.dataset.toggle, i = st.on.indexOf(id);
    if(i >= 0){ st.on.splice(i,1); delete st.start[id]; toast('เอา '+suppById(id).n+' ออกจากชุดแล้ว'); }
    else { st.on.push(id); if(suppById(id).cycleDays) st.start[id] = today();
           SUPPOPEN = id; toast('เพิ่ม '+suppById(id).n+' เข้าชุดแล้ว'); }
    beep(1046,.06); save(); }; });
  m.querySelectorAll('[data-savedose]').forEach(function(b){ b.onclick = function(){
    const id = b.dataset.savedose, v = +el('sd_'+id).value;
    if(v <= 0){ toast('กรอกโดสให้ถูกต้องก่อน'); return; }
    suppState().dose[id] = v; beep(880,.07); save(); toast('บันทึกโดสแล้ว'); }; });
  m.querySelectorAll('[data-cycreset]').forEach(function(b){ b.onclick = function(){
    suppState().start[b.dataset.cycreset] = today(); beep(1200,.08); save(); toast('เริ่มนับรอบใหม่วันนี้'); }; });
}

</script>
</body>
</html>
