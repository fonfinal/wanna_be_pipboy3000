/* ==========================================================
   FOCUS — โมเดลค่าสติ (Two-Process Model + ตัวปรับ)
   Process S = แรงกดดันการนอนที่สะสมตามชั่วโมงที่ตื่น
   Process C = จังหวะเซอร์คาเดียนตามเวลาของวัน
   ค่าที่ได้เป็น "ดัชนีประมาณการ" ไม่ใช่การวัดจริง
   ========================================================== */

/* ---------- time helpers ---------- */
function nowMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function nowHM(){ const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function hm2min(s){ if(!s || typeof s !== 'string') return null;
  const p = s.split(':'); const h = +p[0], m = +p[1];
  return (isNaN(h)||isNaN(m)) ? null : h*60+m; }
function min2hm(m){ m = ((Math.round(m)%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

/* ---------- sleep record ---------- */
function sleepRec(k){ const d = S.days[k||today()]; return (d && d.sleep) ? d.sleep : null; }
function sleepHours(k){ const s = sleepRec(k); return s && s.h ? s.h : null; }
function wakeMin(k){
  const s = sleepRec(k || today());
  const w = s && s.wake ? hm2min(s.wake) : null;
  return w === null ? 7*60 : w;               /* ค่าตั้งต้น 07:00 ถ้ายังไม่กรอก */
}
function sleepDebt7(k){
  k = k || today();
  const need = S.profile.sleepNeed || 8;
  let debt = 0, n = 0;
  for(let i=1;i<=7;i++){
    const h = sleepHours(shiftKey(k,-i));
    if(h === null) continue;
    debt += Math.max(0, need - h); n++;
  }
  return { debt:debt, nights:n };
}
function sleepBase(k){
  k = k || today();
  const need = S.profile.sleepNeed || 8;
  const h = sleepHours(k);
  const dbt = sleepDebt7(k);
  const parts = [];
  let base = 100;
  if(h === null){
    parts.push({ n:'ยังไม่ได้กรอกเวลานอน', v:0, note:'ใช้ค่าสมมติว่านอนครบ' });
  } else {
    const short = Math.max(0, need - h);
    const pen = short * 12;
    if(pen > 0) parts.push({ n:'นอนขาด '+r1(short)+' ชม.', v:-r0(pen) });
    base -= pen;
    if(h > need + 1.5){ base -= 3; parts.push({ n:'นอนเกินจนเบลอ', v:-3 }); }
  }
  const dpen = Math.min(25, dbt.debt * 3);
  if(dpen > 0){ base -= dpen; parts.push({ n:'หนี้การนอนสะสม '+r1(dbt.debt)+' ชม.', v:-r0(dpen) }); }
  return { base: clamp(base, 25, 100), parts: parts, debt: dbt };
}

/* ---------- Process C : circadian alertness ---------- */
const CIRC = [-22,-26,-30,-32,-33,-30,-20,-8,0,6,9,9,5,-1,-6,-7,-4,0,4,6,4,0,-6,-14];
function circadian(min){
  const h = (min/60) % 24, i = Math.floor(h), f = h - i;
  return CIRC[i%24]*(1-f) + CIRC[(i+1)%24]*f;
}
/* ---------- Process S : homeostatic pressure ---------- */
function pressure(min, k){
  let awake = min - wakeMin(k);
  if(awake < 0) awake += 1440;
  return -32 * Math.min(1.25, awake/(16*60));
}
function hoursAwake(min, k){
  let a = (min === undefined ? nowMin() : min) - wakeMin(k);
  if(a < 0) a += 1440;
  return a/60;
}

/* ---------- caffeine pharmacokinetics ---------- */
const CAFMAP = {
 'กาแฟดำ/อเมริกาโน่':120,'กาแฟเย็น':150,'ลาเต้เย็น':120,'ชาเย็น':50,'ชาเขียวเย็น':35,
 'ชานมไข่มุก':50,'โอเลี้ยง':110,'น้ำอัดลม 1 กระป๋อง':35,'Sprite กระป๋อง 325ml':0
};
function cafOfName(n){
  if(CAFMAP[n] !== undefined) return CAFMAP[n];
  const keys = Object.keys(CAFMAP);
  for(let i=0;i<keys.length;i++){ if(n.indexOf(keys[i]) === 0) return CAFMAP[keys[i]]; }
  return 0;
}
/* เหตุการณ์ที่มีคาเฟอีนวันนี้: {min, mg, src} */
function cafEvents(k){
  k = k || today();
  const d = day(k), out = [];
  d.foods.forEach(function(x){
    const mg = cafOfName(x.n) * (x.q||1);
    if(mg > 0 && x.t) out.push({ min:hm2min(x.t), mg:mg, src:x.n });
  });
  const st = suppState(), lg = st.log[k] || {};
  if(lg['caffeine'] && typeof lg['caffeine'] === 'string')
    out.push({ min:hm2min(lg['caffeine']), mg:suppDose('caffeine'), src:'Caffeine (เม็ด)' });
  return out.filter(function(e){ return e.min !== null; });
}
/* ระดับคาเฟอีนโดยประมาณ (mg) : ขึ้น 30 นาที แล้วครึ่งชีวิต 5 ชม. */
function cafLevel(min, k){
  return cafEvents(k).reduce(function(a,e){
    const dt = min - e.min;
    if(dt < 0) return a;
    const ramp = dt < 30 ? dt/30 : 1;
    const decay = dt < 30 ? 1 : Math.pow(0.5, (dt-30)/300);
    return a + e.mg * ramp * decay;
  }, 0);
}
function cafTotalToday(){ return cafEvents().reduce(function(a,e){ return a+e.mg; },0); }

/* ---------- theanine window ---------- */
function theanineActive(min, k){
  const st = suppState(), lg = st.log[k || today()] || {};
  if(!lg['theanine'] || typeof lg['theanine'] !== 'string') return false;
  const t0 = hm2min(lg['theanine']); if(t0 === null) return false;
  return min >= t0 + 30 && min <= t0 + 240;
}

/* ---------- meals grouped into eating events ---------- */
function mealEvents(k){
  const d = day(k || today()), ev = [];
  d.foods.forEach(function(x){
    if(!x.t) return;
    const m = hm2min(x.t); if(m === null) return;
    const q = x.q||1, kc = x.kcal*q, cb = x.c*q;
    const hit = ev.filter(function(e){ return Math.abs(e.min - m) <= 45; })[0];
    if(hit){ hit.kcal += kc; hit.c += cb; hit.min = Math.min(hit.min, m); }
    else ev.push({ min:m, kcal:kc, c:cb });
  });
  return ev;
}
function exEvents(k){
  return day(k || today()).ex.filter(function(x){ return x.t; })
    .map(function(x){ return { min:hm2min(x.t), mins:x.mins }; })
    .filter(function(e){ return e.min !== null; });
}
function alcoholEvents(k){
  return day(k || today()).foods.filter(function(x){ return x.t && x.n.indexOf('เบียร์') >= 0; })
    .map(function(x){ return { min:hm2min(x.t), q:(x.q||1) }; })
    .filter(function(e){ return e.min !== null; });
}

/* ---------- active modifiers at a given minute ---------- */
function modsAt(min, k){
  k = k || today();
  const out = [], d = day(k), p = S.profile;
  const cl = cafLevel(min, k);
  if(cl > 5){
    const v = Math.min(20, 9 * Math.log2(1 + cl/100));
    out.push({ n:'คาเฟอีน '+r0(cl)+' mg ในกระแสเลือด', v:r0(v), cls:'buff', tag:'CAF' });
    if(cl > 150 && !theanineActive(min, k))
      out.push({ n:'ใจสั่น/กระวนกระวาย (คาเฟอีนสูงโดยไม่มีธีอะนีน)', v:-4, cls:'debuff', tag:'JITTER' });
  }
  if(theanineActive(min, k)){
    out.push({ n: cl > 50 ? 'แอลธีอะนีน — ตัดอาการใจสั่น โฟกัสนิ่งขึ้น' : 'แอลธีอะนีน — สงบ ลดสัญญาณรบกวน',
               v: cl > 50 ? 5 : 4, cls:'buff', tag:'THE' });
  }
  mealEvents(k).forEach(function(e){
    const dt = min - e.min;
    if(dt >= 30 && dt <= 120 && e.kcal > 650){
      const carbHeavy = (e.c*4)/Math.max(1,e.kcal) > 0.6;
      out.push({ n:'อิ่มจนตื้อ ('+r0(e.kcal)+' kcal'+(carbHeavy?' คาร์บหนัก':'')+')',
                 v: carbHeavy ? -10 : -7, cls:'debuff', tag:'MEAL' });
    }
  });
  exEvents(k).forEach(function(e){
    const dt = min - e.min;
    if(dt >= 10 && dt <= 130) out.push({ n:'เพิ่งขยับร่างกาย', v:5, cls:'buff', tag:'EX' });
  });
  alcoholEvents(k).forEach(function(e){
    const dt = min - e.min;
    if(dt >= 20 && dt <= 200) out.push({ n:'แอลกอฮอล์', v:-8, cls:'debuff', tag:'ALC' });
  });
  if(hoursAwake(min, k) > 6 && (d.water||0) < p.waterGoal*0.5)
    out.push({ n:'น้ำไม่พอ ('+(d.water||0)+'/'+p.waterGoal+' แก้ว)', v:-5, cls:'debuff', tag:'H2O' });
  return out;
}
function focusAt(min, k){
  const sb = sleepBase(k);
  const m = modsAt(min, k).reduce(function(a,x){ return a + x.v; }, 0);
  return clamp(sb.base + pressure(min, k) + circadian(min) + m, 0, 100);
}
/* ค่าสติเฉลี่ยตลอดช่วงตื่นของวันนั้น */
function focusDayAvg(k){
  if(!hasData(k) && !sleepHours(k)) return null;
  const w0 = wakeMin(k), bed = hm2min(S.profile.bedTime||'23:00') || 1380;
  const end = Math.max(w0 + 360, bed);
  let sum = 0, n = 0;
  for(let m = w0; m <= end; m += 30){ sum += focusAt(m, k); n++; }
  return n ? sum/n : null;
}
function focusLabel(v){
  if(v >= 85) return { t:'ชัดเจนมาก', c:'var(--p-hot)', note:'ช่วงนี้เหมาะกับงานที่ต้องคิดหนักที่สุดของวัน' };
  if(v >= 70) return { t:'ปกติ',      c:'var(--p-lit)', note:'ทำงานทั่วไปได้ลื่น' };
  if(v >= 55) return { t:'เริ่มตื้อ',   c:'var(--amber)', note:'เหมาะกับงานประจำ งานเอกสาร ไม่ใช่งานตัดสินใจ' };
  if(v >= 40) return { t:'ตื้อ',       c:'var(--amber)', note:'ลุกเดิน ดื่มน้ำ หรือออกไปโดนแดด 5 นาที' };
  return { t:'ล้าหนัก', c:'var(--rad)', note:'ถ้าเป็นไปได้ งีบ 20 นาที คุ้มกว่าฝืน' };
}
/* ช่วงเวลาที่ยังเหลือของวันนี้ซึ่งค่าสติสูงสุด */
function bestWindow(){
  const now = nowMin(), end = Math.max(now+30, hm2min(S.profile.bedTime || '23:00') || 1380);
  let best = null;
  for(let m = now; m <= end; m += 15){
    const v = focusAt(m);
    if(!best || v > best.v) best = { v:v, m:m };
  }
  return best;
}

/* ==========================================================
   DIGESTION — เวลาย่อย / ความอิ่ม / ระยะห่างก่อนนอน
   ค่าประมาณจากช่วงเวลาการระบายอาหารออกจากกระเพาะที่รายงานในงานวิจัย
   ========================================================== */
function digestOf(e){
  /* e = {min, kcal, c, p, f, fib} — ประเมินเป็นชั่วโมง */
  const kcal = e.kcal || 0, fat = e.f || 0, pro = e.p || 0, fib = e.fib || 0;
  /* กระเพาะระบายอาหาร: ยิ่งแคลเยอะและไขมันสูง ยิ่งช้า */
  let empty = 1.0 + kcal/450 + fat/28 + fib/40;
  empty = clamp(empty, 0.7, 5.5);
  /* ความอิ่ม: โปรตีนกับใยอาหารยืดได้จริง คาร์บล้วนสั้นสุด */
  let full = 1.2 + kcal/330 + pro/22 + fib/9 - (e.c && kcal ? ((e.c*4)/kcal > 0.6 ? 0.6 : 0) : 0);
  full = clamp(full, 0.8, 6.5);
  /* ก่อนนอนควรห่างเท่าไหร่ */
  let bedGap = clamp(empty * 0.85, 1.0, 3.5);
  if(kcal > 700) bedGap = Math.max(bedGap, 3);
  return { empty:empty, full:full, bedGap:bedGap };
}
function mealEventsFull(k){
  const d = day(k||today()), ev = [];
  d.foods.forEach(function(x){
    if(!x.t) return;
    const m = hm2min(x.t); if(m === null) return;
    const q = x.q||1;
    const hit = ev.filter(function(e){ return Math.abs(e.min - m) <= 45; })[0];
    const add = { kcal:x.kcal*q, c:x.c*q, p:x.p*q, f:x.f*q, fib:(x.fib||0)*q };
    if(hit){ hit.kcal+=add.kcal; hit.c+=add.c; hit.p+=add.p; hit.f+=add.f; hit.fib+=add.fib;
             hit.min = Math.min(hit.min, m); hit.names.push(x.n); }
    else ev.push(Object.assign({ min:m, names:[x.n] }, add));
  });
  return ev.sort(function(a,b){ return a.min - b.min; });
}
function viewDigest(){
  const evs = mealEventsFull(today());
  const now = nowMin(), bed = hm2min(S.profile.bedTime||'23:00') || 1380;
  if(!evs.length){
    return '<div class="empty">ยังไม่มีมื้อที่มีเวลากำกับวันนี้ — เพิ่มอาหารในแท็บ INV แล้วระบบจะจับเวลาให้อัตโนมัติ</div>';
  }
  const rows = evs.map(function(e){
    const g = digestOf(e);
    const emptyAt = e.min + g.empty*60, hungryAt = e.min + g.full*60;
    const state = now < emptyAt ? 'กำลังย่อย' : (now < hungryAt ? 'ย่อยแล้ว ยังอิ่มอยู่' : 'น่าจะหิวแล้ว');
    const cls = now < emptyAt ? 'warn' : (now < hungryAt ? 'ok' : 'bad');
    return '<div class="adv '+cls+'"><h3>'+esc(e.names[0])+(e.names.length>1?' +'+(e.names.length-1):'')
      + ' · '+min2hm(e.min)+'<s>'+r0(e.kcal)+' KCAL</s></h3>'
      + '<p>ย่อยเสร็จราว <b>'+min2hm(emptyAt)+'</b> (~'+r1(g.empty)+' ชม.) · น่าจะเริ่มหิวราว <b>'+min2hm(hungryAt)+'</b> (~'+r1(g.full)+' ชม.)<br>'
      + 'สถานะตอนนี้: <b>'+state+'</b></p></div>';
  }).join('');

  const last = evs[evs.length-1];
  const lg = digestOf(last);
  const safeBed = last.min + lg.bedGap*60;
  const okToSleep = safeBed <= bed;
  const waitMin = Math.max(0, safeBed - now);

  return rows
  + '<div style="margin-top:12px;border-top:1px solid var(--p-dim);padding-top:10px">'
  + '<div style="font-size:10px;letter-spacing:2px;color:var(--p-mid);margin-bottom:8px">มื้อล่าสุด ↔ เวลานอน</div>'
  + '<div class="stat4">'
    + '<div><s>มื้อล่าสุด</s><b>'+min2hm(last.min)+'</b><i>'+r0(last.kcal)+' kcal</i></div>'
    + '<div><s>ควรนอนหลัง</s><b>'+min2hm(safeBed)+'</b><i>เว้น '+r1(lg.bedGap)+' ชม.</i></div>'
    + '<div><s>เวลานอนที่ตั้งไว้</s><b>'+esc(S.profile.bedTime||'23:00')+'</b><i>ตั้งในแท็บ FOCUS</i></div>'
    + '<div><s>ต้องรออีก</s><b style="color:'+(waitMin>0?'var(--amber)':'var(--p-lit)')+'">'+(waitMin>0?r0(waitMin):'0')+'</b><i>นาที</i></div>'
  + '</div>'
  + (okToSleep
      ? '<div class="warnbox" style="border-color:var(--p-lit);color:var(--p-lit);background:rgba(60,255,142,.07)">มื้อล่าสุดห่างจากเวลานอนพอแล้ว — นอนตามเวลาปกติได้เลย</div>'
      : '<div class="warnbox rad">ถ้านอน '+esc(S.profile.bedTime||'23:00')+' จะห่างจากมื้อล่าสุดแค่ <b>'+r1((bed-last.min)/60)+' ชม.</b> ซึ่งน้อยกว่าที่ควร ('+r1(lg.bedGap)+' ชม.)</div>')
  + '<div class="adv warn"><h3>ถ้านอนทั้งที่ยังไม่ย่อย จะเกิดอะไร<s>REFLUX</s></h3>'
    + '<p>การนอนราบตอนกระเพาะยังเต็มทำให้<b>กรดไหลย้อนง่ายขึ้น</b> เพราะไม่มีแรงโน้มถ่วงช่วยกดอาหารลง — อาการที่พบคือแสบยอดอก เรอเปรี้ยว ไอตอนกลางคืน และหลับไม่ลึก · มื้อใหญ่ ของทอด ของเผ็ด แอลกอฮอล์ ทำให้แย่กว่าเดิม เพราะไขมันทำให้หูรูดหลอดอาหารคลายตัว</p>'
    + '<ul><li>คำแนะนำมาตรฐานคือเว้น <b>2–3 ชม.</b> ระหว่างมื้อใหญ่กับการนอนราบ</li>'
    + '<li>ถ้าเลี่ยงไม่ได้จริงๆ ให้หนุนหัวเตียงสูงขึ้น และนอน<b>ตะแคงซ้าย</b> ซึ่งลดกรดไหลย้อนได้มากกว่าตะแคงขวา</li>'
    + '<li>ถ้าหิวจัดก่อนนอนจนนอนไม่หลับ กินเบาๆ 150–200 kcal เน้นโปรตีน ดีกว่าอดจนหลับไม่ลง</li></ul></div>'
  + '<div class="adv ok"><h3>เรื่องที่คนเข้าใจผิด: "กินดึกแล้วอ้วน"<s>MYTH</s></h3>'
    + '<p>งานวิจัยที่คุมแคลรวมให้เท่ากัน <b>ไม่พบว่าเวลากินเปลี่ยนน้ำหนักอย่างมีนัยสำคัญ</b> — ตัวที่กำหนดคือแคลรวมทั้งวัน ไม่ใช่เข็มนาฬิกา · ที่คนกินดึกแล้วอ้วนจริงเพราะมื้อดึกมักเป็นของทอด ของหวาน และกินเกินโดยไม่รู้ตัว ไม่ใช่เพราะเวลา</p>'
    + '<p>ดังนั้นเหตุผลที่ควรเว้นก่อนนอนคือ <b>คุณภาพการนอนกับกรดไหลย้อน</b> ไม่ใช่กลัวไขมันสะสม</p></div>'
  + '</div>';
}

function sleepVsIntake(){
  const need = S.profile.sleepNeed || 8;
  const lo = [], hi = [];
  for(let i=0;i<45;i++){
    const k = shiftKey(today(),-i);
    const h = sleepHours(k);
    if(h === null || !hasData(k)) continue;
    const t = totals(k);
    if(!t.kcal) continue;
    (h < need - 0.5 ? lo : hi).push({ kcal:t.kcal, sug:t.sug, net:net(k) });
  }
  const avg = function(a,f){ return a.reduce(function(x,y){ return x+y[f]; },0)/a.length; };
  if(lo.length < 3 || hi.length < 3){
    return '<div class="empty">ต้องมีข้อมูลอย่างน้อย 3 วันในแต่ละกลุ่ม (คืนที่นอนพอ กับคืนที่นอนน้อย) ระบบถึงจะเทียบให้ได้ — ตอนนี้มี '
      + hi.length+' / '+lo.length+' วัน</div>'
      + '<div class="note">งานวิจัยพบว่าการนอนน้อยเพิ่มฮอร์โมนเกรลิน (หิว) และลดเลปติน (อิ่ม) ทำให้กินมากขึ้นโดยเฉพาะของหวานและของทอด · และในงานที่ควบคุมแคลเท่ากัน กลุ่มที่นอน 5.5 ชม. <b>ลดไขมันได้น้อยกว่ากลุ่มที่นอน 8.5 ชม. อย่างมีนัยสำคัญ และเสียกล้ามเนื้อมากกว่า</b> — แปลว่าการนอนไม่ได้เปลี่ยนสมการแคลโดยตรง แต่เปลี่ยนว่าน้ำหนักที่หายไปเป็นไขมันหรือกล้าม</div>';
  }
  const dk = avg(lo,'kcal') - avg(hi,'kcal');
  const ds = avg(lo,'sug') - avg(hi,'sug');
  return '<div class="stat4">'
    + '<div><s>คืนที่นอนพอ ('+hi.length+' วัน)</s><b>'+r0(avg(hi,'kcal'))+'</b><i>kcal เฉลี่ย</i></div>'
    + '<div><s>คืนที่นอนน้อย ('+lo.length+' วัน)</s><b>'+r0(avg(lo,'kcal'))+'</b><i>kcal เฉลี่ย</i></div>'
    + '<div><s>ต่างกัน</s><b style="color:'+(dk>0?'var(--rad)':'var(--p-lit)')+'">'+(dk>0?'+':'')+r0(dk)+'</b><i>kcal/วัน</i></div>'
    + '<div><s>น้ำตาลต่างกัน</s><b style="color:'+(ds>0?'var(--amber)':'var(--p-lit)')+'">'+(ds>0?'+':'')+r0(ds)+'</b><i>g/วัน</i></div>'
  + '</div>'
  + '<div class="note">'
    + (dk > 100
      ? 'ข้อมูลของพี่เองบอกว่า <b>คืนที่นอนน้อย วันรุ่งขึ้นกินมากกว่าเฉลี่ย '+r0(dk)+' kcal</b> ซึ่งตรงกับที่งานวิจัยพบ (นอนน้อย → เกรลินขึ้น เลปตินลง → หิวมากขึ้นโดยเฉพาะของหวานของทอด) · ถ้าคิดเป็นสัปดาห์ที่นอนน้อย 3 คืน = '+r0(dk*3)+' kcal ≈ '+r1(dk*3/7700)+' กก. ที่ไม่ได้ลด'
      : (dk < -100
        ? 'ข้อมูลของพี่กลับด้านกับงานวิจัย — คืนที่นอนน้อยกลับกินน้อยกว่า อาจเป็นเพราะวันที่ยุ่งจนนอนน้อยคือวันที่ไม่มีเวลากินด้วย ระวังเรื่องกินไม่พอมากกว่ากินเกิน'
        : 'ยังไม่เห็นความต่างชัดเจนระหว่างสองกลุ่ม บันทึกต่อไปเรื่อยๆ ตัวเลขจะนิ่งขึ้น'))
  + '</div>'
  + '<div class="note">นอกจากปริมาณที่กิน การนอนยังเปลี่ยน<b>องค์ประกอบของน้ำหนักที่หายไป</b> — ในงานที่ให้ขาดดุลแคลเท่ากัน กลุ่มที่นอน 5.5 ชม. ลดไขมันได้น้อยกว่าและเสียกล้ามมากกว่ากลุ่มที่นอน 8.5 ชม. อย่างชัดเจน</div>';
}

/* ---------- FOCUS CURVE CHART ---------- */
function drawFocus(){
  const o = ctxOf('cFocus', 230); if(!o) return;
  const c = o.c, w = o.w, h = o.h, pl = 34, pr = 34, pt = 12, pb = 26;
  const w0 = wakeMin(), bed = (hm2min(S.profile.bedTime||'23:00') || 1380);
  const start = Math.max(0, w0 - 30), end = Math.max(start+180, bed + 30);
  const now = nowMin();
  const X = function(m){ return pl + (w-pl-pr)*(m-start)/(end-start); };
  const Y = function(v){ return h-pb - (v/100)*(h-pt-pb); };
  gridLines(c,w,h,pl,pr,pt,pb,4);
  c.fillStyle='rgba(30,148,85,.85)'; c.font='10px "Share Tech Mono",monospace'; c.textAlign='right';
  for(let i=0;i<=4;i++){ const y=pt+(h-pt-pb)*i/4; c.fillText(100-i*25, pl-6, y+3); }
  /* zone bands */
  c.fillStyle='rgba(255,80,51,.07)'; c.fillRect(pl, Y(45), w-pl-pr, h-pb-Y(45));
  c.fillStyle='rgba(60,255,142,.06)'; c.fillRect(pl, pt, w-pl-pr, Y(70)-pt);
  /* hour ticks */
  c.textAlign='center'; c.font='9px "Share Tech Mono",monospace';
  for(let m=Math.ceil(start/120)*120; m<=end; m+=120){
    c.strokeStyle='rgba(30,148,85,.2)'; c.beginPath(); c.moveTo(X(m),pt); c.lineTo(X(m),h-pb); c.stroke();
    c.fillStyle='rgba(30,148,85,.9)'; c.fillText(min2hm(m), X(m), h-9);
  }
  /* caffeine curve (right axis 0-400mg) */
  c.beginPath(); c.strokeStyle='rgba(255,176,0,.75)'; c.lineWidth=1.4;
  let st2=false;
  for(let m=start;m<=end;m+=10){
    const y = h-pb-(clamp(cafLevel(m),0,400)/400)*(h-pt-pb);
    st2 ? c.lineTo(X(m),y) : (c.moveTo(X(m),y), st2=true);
  }
  c.stroke();
  c.fillStyle='rgba(255,176,0,.9)'; c.textAlign='left'; c.font='9px "Share Tech Mono",monospace';
  c.fillText('400mg', w-pr+3, pt+8); c.fillText('0', w-pr+3, h-pb+3);
  /* focus: solid up to now, dashed after */
  const seg = function(a,b,dash){
    c.save(); if(dash) c.setLineDash([5,4]);
    c.beginPath(); c.strokeStyle = dash ? 'rgba(30,148,85,.95)' : '#3CFF8E';
    c.lineWidth = dash ? 1.8 : 2.4;
    if(!dash){ c.shadowColor='rgba(60,255,142,.6)'; c.shadowBlur=7; }
    let s0=false;
    for(let m=a;m<=b;m+=6){ const y=Y(focusAt(m)); s0 ? c.lineTo(X(m),y) : (c.moveTo(X(m),y), s0=true); }
    c.stroke(); c.shadowBlur=0; c.restore();
  };
  seg(start, Math.min(now,end), false);
  if(now < end) seg(Math.min(now,end), end, true);
  /* now marker */
  if(now>=start && now<=end){
    c.save(); c.setLineDash([2,3]); c.strokeStyle='rgba(207,255,228,.5)';
    c.beginPath(); c.moveTo(X(now),pt); c.lineTo(X(now),h-pb); c.stroke(); c.restore();
    const fy=Y(focusAt(now));
    c.fillStyle='#CFFFE4'; c.beginPath(); c.arc(X(now),fy,4,0,7); c.fill();
  }
}

function focusHist(){
  const out = [];

    const k = shiftKey(today(),-i);
    out.push({ k:k, v:focusDayAvg(k), sl:sleepHours(k) });
  }
  return out;
}

  const best = h.slice().sort(function(a,b){ return b.v - a.v; })[0];
  const worst = h.slice().sort(function(a,b){ return a.v - b.v; })[0];

  const wd = function(k){ return new Date(k+'T12:00:00').toLocaleDateString('th-TH',{weekday:'long'}); };

    + '<div class="stat4" style="margin-top:10px">'
      + '<div><s>เฉลี่ย 7 วัน</s><b>'+r0(avg)+'</b><i>/100</i></div>'

      + '<div><s>วันที่แย่ที่สุด</s><b style="font-size:14px">'+wd(worst.k)+'</b><i>'+r0(worst.v)+' · นอน '+(worst.sl?r1(worst.sl):'—')+' ชม.</i></div>'
      + '<div><s>ต่างกัน</s><b>'+r0(best.v-worst.v)+'</b><i>จุด</i></div>'
    + '</div>'
    + '<div class="note">เอาไปวางแผนได้เลย — ประชุมที่ต้องตัดสินใจหรืองานวิเคราะห์ควรลงวันที่ค่าสติสูง '
    + 'ส่วนวันที่ต่ำเก็บไว้ทำงานเอกสารหรืองานประจำ · <b>ตัวแปรที่ขยับค่านี้มากที่สุดคือชั่วโมงนอน</b> ลองเทียบเส้นสองเส้นดู</div>';
}
function drawFocusHist(){
  const o = ctxOf('cFocusHist', 190); if(!o) return;
  const c = o.c, w = o.w, h = o.h, pl = 34, pr = 34, pt = 14, pb = 30;
  const rows = focusHist();
  const bw = (w-pl-pr)/rows.length;
  gridLines(c,w,h,pl,pr,pt,pb,4);
  c.font = '10px "Share Tech Mono",monospace'; c.textAlign = 'right';
  c.fillStyle = 'rgba(60,255,142,.85)';
  for(let i=0;i<=4;i++){ const y = pt+(h-pt-pb)*i/4; c.fillText(100-i*25, pl-6, y+3); }
  c.textAlign='left'; c.fillStyle='rgba(255,176,0,.9)';
  for(let i=0;i<=4;i++){ const y = pt+(h-pt-pb)*i/4; c.fillText(r1(12-i*3), w-pr+5, y+3); }
  const Y  = function(v){ return h-pb-(clamp(v,0,100)/100)*(h-pt-pb); };
  const Ys = function(v){ return h-pb-(clamp(v,0,12)/12)*(h-pt-pb); };
  /* แท่งค่าสติ */
  rows.forEach(function(r,i){
    if(r.v === null) return;
    const x = pl+bw*i+bw*0.22, bwid = bw*0.56, y = Y(r.v);
    c.fillStyle = r.v >= 70 ? 'rgba(60,255,142,.55)' : (r.v >= 50 ? 'rgba(255,176,0,.5)' : 'rgba(255,80,51,.55)');
    c.fillRect(x, y, bwid, h-pb-y);
    c.strokeStyle = r.v >= 70 ? '#3CFF8E' : (r.v >= 50 ? '#FFB000' : '#FF5033');
    c.lineWidth = 1; c.strokeRect(x+.5, y+.5, bwid-1, h-pb-y-1);
  });
  /* เส้นชั่วโมงนอน */
  c.save(); c.setLineDash([5,4]); c.beginPath(); c.strokeStyle='#FFB000'; c.lineWidth=1.6;
  let st2=false;
  rows.forEach(function(r,i){
    if(!r.sl) return;
    const x = pl+bw*i+bw/2, y = Ys(r.sl);
    st2 ? c.lineTo(x,y) : (c.moveTo(x,y), st2=true);
  });
  c.stroke(); c.restore();
  /* labels */
  c.textAlign='center'; c.font='9px "Share Tech Mono",monospace';
  const WD = ['อา','จ','อ','พ','พฤ','ศ','ส'];
  rows.forEach(function(r,i){
    c.fillStyle = (r.k === today()) ? '#CFFFE4' : 'rgba(30,148,85,.9)';
    c.fillText(WD[new Date(r.k+'T12:00:00').getDay()], pl+bw*i+bw/2, h-16);
    c.fillText(r.k.slice(8), pl+bw*i+bw/2, h-5);
  });
}
function bindFocus(m){
  m.querySelectorAll('[data-slq]').forEach(function(b){ b.onclick = function(){
    const d = day(); if(!d.sleep) d.sleep = {};
    d.sleep.q = b.dataset.slq; beep(700,.04); save(); }; });
  m.querySelectorAll('[data-slq2]').forEach(function(b){ b.onclick = function(){
    const d = day(); if(!d.sleep) d.sleep = {};
    d.sleep.h = clamp(Math.round(((d.sleep.h||7) + (+b.dataset.slq2))*4)/4, 0, 16);
    beep(660,.04); save(); }; });
  on('saveSleep', function(){
    const hv = +el('slH').value, wv = (el('slW').value||'').trim();
    if(hv <= 0 || hv > 16){ toast('กรอกจำนวนชั่วโมงให้ถูกต้องก่อน'); return; }
    const d = day(); if(!d.sleep) d.sleep = {};
    d.sleep.h = hv;
    if(wv && hm2min(wv) !== null) d.sleep.wake = wv;
    beep(880,.09); save(); toast('บันทึกการนอน '+r1(hv)+' ชม.');
  });
  on('saveSleepCfg', function(){
    S.profile.sleepNeed = +el('slNeed').value || 8;
    const bt = (el('slBed').value||'').trim();
    if(bt && hm2min(bt) !== null) S.profile.bedTime = bt;
    beep(880,.09); save(); toast('บันทึกค่าตั้งต้นแล้ว');
  });
}

/* ---------- ICS ---------- */
function icsFold(line){
  const out = [];
  let s = line;
  while(s.length > 72){ out.push(s.slice(0,72)); s = ' ' + s.slice(72); }
  out.push(s);
  return out.join('\r\n');
}
function icsEsc(t){ return String(t).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
function icsStamp(){
  const d = new Date();
  return d.getUTCFullYear()
    + String(d.getUTCMonth()+1).padStart(2,'0') + String(d.getUTCDate()).padStart(2,'0')
    + 'T' + String(d.getUTCHours()).padStart(2,'0') + String(d.getUTCMinutes()).padStart(2,'0')
    + String(d.getUTCSeconds()).padStart(2,'0') + 'Z';
}
function icsEvent(uid, hm, title, desc){
  const t = shiftKey(today(), 1).replace(/-/g,'');   /* เริ่มพรุ่งนี้ */
  const hhmm = hm.replace(':','') + '00';
  return ['BEGIN:VEVENT',
    'UID:'+uid+'@nutriboy',
    'DTSTAMP:'+icsStamp(),
    'DTSTART:'+t+'T'+hhmm,          /* floating local time — iOS อ่านเป็นเวลาเครื่อง */
    'DURATION:PT5M',
    'RRULE:FREQ=DAILY',
    icsFold('SUMMARY:'+icsEsc(title)),
    icsFold('DESCRIPTION:'+icsEsc(desc||title)),
    'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0S',
    icsFold('DESCRIPTION:'+icsEsc(title)),
    'END:VALARM','END:VEVENT'].join('\r\n');
}
function buildICS(opt){
  const r = remindState(), st = suppState(), ev = [];
  if(opt.water) r.water.forEach(function(hm,i){
    ev.push(icsEvent('nb-water-'+i, hm, 'ดื่มน้ำ 1 แก้ว',
      'เป้าวันละ '+S.profile.waterGoal+' แก้ว — NUTRI-BOY'));
  });
  if(opt.weigh) ev.push(icsEvent('nb-weigh', r.weigh, 'ชั่งน้ำหนัก + กรอกเวลานอน',
    'ชั่งตอนตื่น หลังเข้าห้องน้ำ ก่อนกินอะไร แล้วบันทึกในแอป'));
  if(opt.supp){
    const bySlot = {};
    st.on.forEach(function(id){
      const sp = suppById(id); if(!sp) return;
      const hm = SUPP_SLOT[id] || '12:00';
      if(!bySlot[hm]) bySlot[hm] = [];
      bySlot[hm].push(sp.n + ' ' + r1(suppDose(id)) + ' ' + sp.u);
    });
    Object.keys(bySlot).forEach(function(hm,i){
      ev.push(icsEvent('nb-supp-'+i, hm, 'อาหารเสริม ('+bySlot[hm].length+' ตัว)',
        bySlot[hm].join('\n')));
    });
  }
  if(opt.caf){
    const bed = hm2min(S.profile.bedTime||'23:00') || 1380;
    ev.push(icsEvent('nb-caf', min2hm(bed - 9*60), 'หมดเวลาคาเฟอีนแล้ว',
      'หลังจากนี้งดกาแฟ เพื่อให้ deep sleep ครบ'));
  }
  if(opt.meal){
    const bed = hm2min(S.profile.bedTime||'23:00') || 1380;
    ev.push(icsEvent('nb-meal', min2hm(bed - 3*60), 'มื้อสุดท้ายของวัน',
      'หลังจากนี้ควรเลี่ยงมื้อหนัก เพื่อลดกรดไหลย้อนและให้หลับลึก'));
  }
  if(!ev.length) return null;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//NUTRI-BOY 3000//TH','CALSCALE:GREGORIAN','METHOD:PUBLISH']
    .concat(ev).concat(['END:VCALENDAR']).join('\r\n');
}
function downloadICS(){
  const opt = {
    water: !!(el('rmWater')||{}).checked,
    supp:  !!(el('rmSupp') ||{}).checked,
    weigh: !!(el('rmWeigh')||{}).checked,
    caf:   !!(el('rmCaf')  ||{}).checked,
    meal:  !!(el('rmMeal') ||{}).checked
  };
  const ics = buildICS(opt);
  if(!ics){ toast('เลือกอย่างน้อย 1 รายการก่อน'); return; }
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'nutriboy-reminders.ics'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  beep(1046,.09); toast('ส่งออกไฟล์ปฏิทินแล้ว — เปิดไฟล์เพื่อเพิ่มเข้าปฏิทิน');
}

/* ---------- in-app notification (ใช้ได้เฉพาะตอนเปิดแอปอยู่) ---------- */
function notifSupported(){ return typeof Notification !== 'undefined'; }
function notifState(){ return notifSupported() ? Notification.permission : 'unsupported'; }
async function askNotif(){
  if(!notifSupported()){ toast('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน'); return; }
  try{
    const r = await Notification.requestPermission();
    remindState().notifOn = (r === 'granted');
    save();
    toast(r === 'granted' ? 'อนุญาตแล้ว — จะเตือนตอนเปิดแอปอยู่' : 'ไม่ได้รับอนุญาต');
  }catch(e){ toast('ขออนุญาตไม่สำเร็จ'); }
}
function fireNotif(title, body){
  if(!notifSupported() || Notification.permission !== 'granted') return;
  try{ new Notification(title, { body:body, tag:'nutriboy', renotify:false }); }catch(e){}
}
/* ตรวจทุกนาทีขณะเปิดแอป */
let NOTIFIED = {};
function notifTick(){
  const r = remindState();
  if(!r.notifOn || Notification.permission !== 'granted') return;
  const now = min2hm(nowMin()), d = day();
  const key2 = today()+'|'+now;
  if(NOTIFIED[key2]) return;
  if(r.water.indexOf(now) >= 0 && (d.water||0) < S.profile.waterGoal){
    NOTIFIED[key2] = 1;
    fireNotif('ดื่มน้ำ', 'ตอนนี้ '+(d.water||0)+'/'+S.profile.waterGoal+' แก้ว');
  }
  const st = suppState();
  st.on.forEach(function(id){
    if((SUPP_SLOT[id]||'12:00') !== now || tookToday(id)) return;
    NOTIFIED[key2+id] = 1;
    const sp = suppById(id); if(sp) fireNotif('อาหารเสริม', sp.n);
  });
}

/* ---------- catch-up: สรุปสิ่งที่ค้างตอนเปิดแอป ---------- */
function catchUp(){
  const d = day(), p = S.profile, out = [];
  const h = new Date().getHours();
  if(h >= 10 && (d.weight === null || d.weight === undefined)) out.push('ยังไม่ได้ชั่งน้ำหนัก');
  if(h >= 10 && !(d.sleep && d.sleep.h)) out.push('ยังไม่ได้กรอกเวลานอน');
  if(h >= 14 && !d.foods.length) out.push('ยังไม่ได้บันทึกอาหารเลย');
  if(h >= 18 && (d.water||0) < p.waterGoal*0.6) out.push('น้ำยังขาด '+(p.waterGoal-(d.water||0))+' แก้ว');
  const st = suppState();
  const miss = st.on.filter(function(id){
    return !tookToday(id) && nowMin() > (hm2min(SUPP_SLOT[id]||'12:00')+120);
  });
  if(miss.length) out.push('อาหารเสริมยังไม่ได้ติ๊ก '+miss.length+' ตัว');
  return out;
}

/* ---------- VIEW ---------- */
function viewRemind(){
  const r = remindState(), ns = notifState();
  const cu = catchUp();
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const cb = function(id, label, on){
    return '<label class="rmck"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'><span>'+label+'</span></label>';
  };
  const bed = hm2min(S.profile.bedTime||'23:00') || 1380;
  return '<div class="box" style="margin-top:12px"><h2>REMINDERS<span>ตั้งเตือน</span></h2>'
  + (cu.length
      ? '<div class="warnbox">ตอนนี้ค้างอยู่: <b>'+cu.map(esc).join(' · ')+'</b></div>'
      : '<div class="warnbox" style="border-color:var(--p-lit);color:var(--p-lit);background:rgba(60,255,142,.07)">ตอนนี้ไม่มีอะไรค้าง</div>')

  + '<div style="margin-top:12px;font-size:10px;letter-spacing:2px;color:var(--p-mid);margin-bottom:6px">วิธีที่ 1 — ส่งเข้าปฏิทิน (แนะนำ ใช้ได้จริงบน iPhone)</div>'
  + cb('rmWater','ดื่มน้ำ — '+r.water.join(', '), true)
  + cb('rmSupp','อาหารเสริมตามตาราง ('+suppState().on.length+' ตัว)', true)
  + cb('rmWeigh','ชั่งน้ำหนัก + กรอกเวลานอน — '+r.weigh, true)
  + cb('rmCaf','หมดเวลาคาเฟอีน — '+min2hm(bed-9*60), true)
  + cb('rmMeal','มื้อสุดท้ายของวัน — '+min2hm(bed-3*60), false)
  + '<div class="btnrow"><button class="btn sm pri" id="dlIcs">ส่งออกไฟล์ปฏิทิน (.ics)</button></div>'
  + '<div class="note">กดแล้วจะได้ไฟล์ <code>.ics</code> — เปิดไฟล์บน iPhone แล้วกด <b>เพิ่มทั้งหมด</b> เข้าปฏิทิน '
    + 'จากนั้น<b>แอปปฏิทินจะเตือนเองทุกวัน แม้ไม่ได้เปิดแอปนี้</b> · ถ้าอยากแก้เวลาหรือลบ ทำในแอปปฏิทินได้เลย</div>'

  + '<div style="margin-top:14px;font-size:10px;letter-spacing:2px;color:var(--p-mid);margin-bottom:6px">วิธีที่ 2 — แจ้งเตือนในแอป (เฉพาะตอนเปิดแอปค้างไว้)</div>'
  + '<div class="btnrow"><button class="btn sm'+(ns==='granted'?' pri':'')+'" id="askNotif">'
    + (ns==='granted'?'อนุญาตแล้ว':(ns==='denied'?'ถูกปฏิเสธ — แก้ในตั้งค่าเครื่อง':(ns==='unsupported'?'เครื่องนี้ไม่รองรับ':'ขออนุญาตแจ้งเตือน')))+'</button>'
  + (ns==='granted'?'<button class="btn sm" id="testNotif">ทดสอบ</button>':'')+'</div>'
  + '<div class="note">ทำงานเฉพาะตอนแอปเปิดอยู่เท่านั้น ปิดแอปแล้วเตือนไม่ได้</div>'

  + '<div class="warnbox rad" style="margin-top:12px"><b>ทำไมถึงตั้งเตือนล่วงหน้าในแอปไม่ได้</b><br>'
    + 'iOS ไม่อนุญาตให้เว็บแอปตั้งเตือนล่วงหน้าแบบทำงานเองตอนปิดแอป — Web Push ที่ Apple เปิดให้ตั้งแต่ iOS 16.4 '
    + '<b>ต้องมีเซิร์ฟเวอร์คอยยิงมา</b> ซึ่งแปลว่าข้อมูลต้องออกจากเครื่องพี่ และต้องมีค่าเซิร์ฟเวอร์รายเดือน · '
    + 'หนูเลยเลือกทางปฏิทินแทน เพราะ<b>เตือนได้จริง ฟรี และข้อมูลไม่ออกจากเครื่อง</b></div>'
  + '</div>';
}
function bindRemind(m){
  on('dlIcs', downloadICS);
  on('askNotif', askNotif);
  on('testNotif', function(){ fireNotif('NUTRI-BOY 3000','ทดสอบการแจ้งเตือน — ใช้งานได้ปกติ'); });
}
