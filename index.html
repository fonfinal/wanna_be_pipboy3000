/* ==========================================================
   REPEAT OFFENDER ANALYSIS — หาว่าอะไรคือ "ตัวการประจำ" ข้ามหลายวัน
   ========================================================== */
function limitTrend(field, limitFn, unit, label){
  const ks = [];
  for(let i=13;i>=0;i--){ const k = shiftKey(today(),-i); if(hasFood(k)) ks.push(k); }
  if(!ks.length) return null;
  const over = ks.filter(function(k){ return totals(k)[field] > limitFn(k); });
  /* ไล่หาว่าเมนูไหนโผล่ซ้ำในวันที่เกิน และรับผิดชอบเท่าไหร่ */
  const tally = {};
  over.forEach(function(k){
    const seen = {};
    (S.days[k].foods||[]).forEach(function(x){
      const v = (x[field]||0)*(x.q||1);
      if(v <= 0) return;
      if(!tally[x.n]) tally[x.n] = { n:x.n, days:0, total:0, count:0 };
      tally[x.n].total += v; tally[x.n].count++;
      if(!seen[x.n]){ tally[x.n].days++; seen[x.n] = 1; }
    });
  });
  const culprits = Object.keys(tally).map(function(n){ return tally[n]; })
    .sort(function(a,b){ return (b.days - a.days) || (b.total - a.total); }).slice(0,3);
  const avg = ks.reduce(function(a,k){ return a + totals(k)[field]; },0)/ks.length;
  return { ks:ks, days:ks.length, over:over.length, avg:avg,
           limit:limitFn(today()), culprits:culprits, unit:unit, label:label, field:field };
}
function trendAdvice(t){
  if(!t) return '';
  const ratio = t.over / t.days;
  let lv, head;
  if(t.over === 0){
    return '<div class="adv ok"><h3>' + t.label + ' — ไม่เกินเพดานเลยใน ' + t.days + ' วัน<s>CLEAR</s></h3>'
      + '<p>เฉลี่ย <b>' + r0(t.avg) + ' ' + t.unit + '</b>/วัน อยู่ในกรอบตลอด รักษาไว้แบบนี้</p></div>';
  }
  if(ratio >= 0.5){ lv = 'bad';  head = 'เป็นนิสัยประจำแล้ว'; }
  else if(ratio >= 0.25){ lv = 'warn'; head = 'เกินบ่อยกว่าที่ควร'; }
  else { lv = 'warn'; head = 'เกินเป็นครั้งคราว'; }

  const main = t.culprits[0];
  let body = 'เกินเพดาน <b>' + t.over + ' ใน ' + t.days + ' วัน</b> ที่บันทึกไว้ · เฉลี่ย <b>' + r0(t.avg) + ' ' + t.unit + '</b>/วัน (เพดาน ' + r0(t.limit) + ')';
  const tips = [];
  if(main && main.days >= 2){
    body += ' — ไล่ย้อนดูแล้ว ตัวการที่โผล่ซ้ำที่สุดคือ <b>' + esc(main.n) + '</b> (โผล่ ' + main.days + ' ใน ' + t.over + ' วันที่เกิน)';
    tips.push('ถ้าตัด <b>' + esc(main.n) + '</b> ออกอย่างเดียว จะหายไป ~<b>' + r0(main.total/main.days) + ' ' + t.unit + '</b> ต่อครั้งที่กิน');
    if(t.culprits[1]) tips.push('รองลงมา: ' + esc(t.culprits[1].n) + ' (' + t.culprits[1].days + ' วัน)');
    tips.push('แก้ที่ตัวซ้ำตัวเดียวได้ผลกว่าคุมทุกมื้อพร้อมกัน — เหมือนแก้ที่เครื่องจักรตัวคอขวด ไม่ใช่ไล่ปรับทั้งไลน์');
  } else {
    body += ' — ยังไม่มีเมนูไหนโผล่ซ้ำชัดเจน แปลว่ามาจากหลายทางกระจายกัน';
    tips.push('ดูกราฟด้านบนว่าวันไหนพุ่ง แล้วย้อนดูมื้อวันนั้นในแท็บ DATA');
  }
  if(t.field === 'na'){
    tips.push('ตัวช่วยเร็วที่สุด: ก๋วยเตี๋ยว/ต้ม ไม่ซดน้ำ ตัดโซเดียมได้เกินครึ่ง');
  } else if(t.field === 'sug'){
    tips.push('เครื่องดื่มกดตัวเลือก <b>หวานน้อย</b> ในแอปตอนเพิ่มรายการ ตัดได้ราวครึ่ง');
  }
  return '<div class="adv ' + lv + '"><h3>' + t.label + ' — ' + head + '<s>' + t.over + '/' + t.days + ' วัน</s></h3>'
    + '<p>' + body + '</p><ul>' + tips.map(function(x){ return '<li>'+x+'</li>'; }).join('') + '</ul></div>';
}

function intimStats(){
  const out = { week:0, month:0, fin7:0, fin30:0, withDays:[], withoutDays:[] };
  for(let i=0;i<30;i++){
    const k = shiftKey(today(),-i);
    const d = S.days[k];
    if(!d) continue;
    const ent = (d.ex||[]).filter(function(x){ return x.type === 'intim'; });
    const fin = ent.reduce(function(a,x){ return a + (x.fin||0); }, 0);
    if(ent.length){ out.month++; if(i < 7) out.week++; }
    out.fin30 += fin; if(i < 7) out.fin7 += fin;
    /* เทียบคุณภาพการนอน "คืนถัดจาก" วันนั้น */
    const nx = S.days[shiftKey(k,1)];
    if(nx && nx.sleep && nx.sleep.h){
      (ent.length ? out.withDays : out.withoutDays).push(nx.sleep.h);
    }
  }
  return out;
}

/* ==========================================================
   PROTEIN VALUE — ต้นทุนต่อกรัมโปรตีน
   ========================================================== */
function prices(){ if(!S.prices) S.prices = {}; return S.prices; }
function proteinRank(){
  const seen = {}, pr = prices();
  /* รวมเมนูที่กินจริงใน 30 วัน + ของในคลัง ที่มีโปรตีน */
  for(let i=0;i<30;i++){
    const d = S.days[shiftKey(today(),-i)];
    if(!d) continue;
    (d.foods||[]).forEach(function(x){
      if((x.p||0) <= 0) return;
      if(!seen[x.n]) seen[x.n] = { n:x.n, p:x.p, kcal:x.kcal, u:x.u||'', hits:0 };
      seen[x.n].hits++;
    });
  }
  myFoods().forEach(function(f){
    if((f.p||0) > 0 && !seen[f.n]) seen[f.n] = { n:f.n, p:f.p, kcal:f.kcal, u:f.u||'', hits:0 };
  });
  return Object.keys(seen).map(function(n){
    const o = seen[n], price = +pr[n] || 0;
    o.price = price;
    o.baht = price > 0 ? price / o.p : null;          /* บาทต่อกรัมโปรตีน */
    o.kcalPerP = o.p > 0 ? o.kcal / o.p : null;       /* แคลต่อกรัมโปรตีน */
    return o;
  }).sort(function(a,b){
    if(a.baht === null && b.baht === null) return b.hits - a.hits;
    if(a.baht === null) return 1;
    if(b.baht === null) return -1;
    return a.baht - b.baht;
  });
}
function viewProteinValue(){
  const rows = proteinRank();
  if(!rows.length){
    return '<div class="empty">ยังไม่มีเมนูที่มีโปรตีน — บันทึกอาหารสักสองสามวันก่อน</div>';
  }
  const withPrice = rows.filter(function(x){ return x.baht !== null; });
  const LEAN = 12;   /* kcal ต่อโปรตีน 1 g — เกินนี้ถือว่าพ่วงแคลเยอะเกินจะเรียกว่าแหล่งโปรตีน */
  const lean = withPrice.filter(function(x){ return x.kcalPerP <= LEAN; });
  const pool = lean.length >= 2 ? lean : withPrice;
  const best = pool[0], worst = pool[pool.length-1];
  const trap = withPrice.filter(function(x){ return x.kcalPerP > LEAN; });

  const head = withPrice.length >= 2
    ? '<div class="stat4">'
      + '<div><s>คุ้มที่สุด</s><b style="font-size:13px">'+esc(best.n.slice(0,14))+'</b><i>฿'+r1(best.baht)+' /g โปรตีน</i></div>'
      + '<div><s>แพงที่สุด</s><b style="font-size:13px">'+esc(worst.n.slice(0,14))+'</b><i>฿'+r1(worst.baht)+' /g โปรตีน</i></div>'
      + '<div><s>ต่างกัน</s><b>'+r1(worst.baht/best.baht)+'×</b><i>เท่า</i></div>'
      + '<div><s>กรอกราคาแล้ว</s><b>'+withPrice.length+' / '+rows.length+'</b><i>รายการ</i></div>'
    + '</div>'
    + '<div class="note">ถ้าเป้าคือโปรตีน '+r0(S.profile.proteinPerKg*S.profile.weight)+' g/วัน — กินจาก <b>'+esc(best.n)+'</b> ล้วนจะตกวันละ ~<b>฿'+r0(best.baht*S.profile.proteinPerKg*S.profile.weight)+'</b> เทียบกับ <b>'+esc(worst.n)+'</b> ที่ ~<b>฿'+r0(worst.baht*S.profile.proteinPerKg*S.profile.weight)+'</b>'
      + (lean.length >= 2 ? ' <b>(นับเฉพาะตัวที่ไม่พ่วงแคลเกิน '+LEAN+' kcal ต่อโปรตีน 1 g)</b>' : '') + '</div>'
      + (trap.length

}

function weekAgg(offset){
  /* offset 0 = 7 วันล่าสุด, 1 = 7 วันก่อนหน้านั้น */
  const ks = [];
  for(let i=offset*7; i<offset*7+7; i++){
    const k = shiftKey(today(), -i);
    if(hasFood(k)) ks.push(k);
  }
  if(!ks.length) return null;
  const a = { n:ks.length, kcal:0, net:0, p:0, na:0, sug:0, fib:0, kk:0, slp:0, slpN:0, over:0, naOver:0 };
  ks.forEach(function(k){
    const t = totals(k), b = budget(k);
    a.kcal += t.kcal; a.net += (b - t.kcal); a.p += t.p; a.na += t.na;
    a.sug += t.sug; a.fib += t.fib; a.kk += t.k;
    if(b - t.kcal < 0) a.over++;
    if(t.na > S.profile.naLimit) a.naOver++;
    const d = S.days[k];
    if(d.sleep && d.sleep.h){ a.slp += d.sleep.h; a.slpN++; }
  });
  ['kcal','net','p','na','sug','fib','kk'].forEach(function(f){ a[f] = a[f]/a.n; });
  a.slp = a.slpN ? a.slp/a.slpN : null;
  return a;
}
function weeklyReview(){
  const cur = weekAgg(0), prv = weekAgg(1);
  if(!cur) return '<div class="empty">ยังไม่มีข้อมูลสัปดาห์นี้</div>';
  const p = S.profile;
  const row = function(label, c, pr, unit, goodUp, digits){
    const d2 = (pr === null || pr === undefined) ? null : c - pr;
    const fmt = function(v){ return digits ? r1(v) : r0(v); };
    let arrow = '<span style="color:var(--p-dim)">—</span>';
    if(d2 !== null && Math.abs(d2) > (digits?0.05:0.5)){
      const good = goodUp ? d2 > 0 : d2 < 0;
      arrow = '<span style="color:'+(good?'var(--p-lit)':'var(--amber)')+'">'
        + (d2>0?'▲':'▼')+' '+fmt(Math.abs(d2))+'</span>';
    }
    return '<li><span class="nm">'+label+'<s>สัปดาห์ก่อน '+(pr===null?'—':fmt(pr)+unit)+'</s></span>'
      + '<span></span><span class="kc">'+fmt(c)+unit+'</span><span style="font-size:11px">'+arrow+'</span></li>';
  };
  /* เป้า 1 ข้อสำหรับสัปดาห์หน้า — เลือกจุดที่ห่างเป้ามากที่สุด */
  const gaps = [];
  const pt = p.proteinPerKg*p.weight;
  if(cur.p < pt*0.85) gaps.push({ s:(pt-cur.p)/pt, t:'ทำโปรตีนให้ถึง <b>'+r0(pt)+' g/วัน</b> (ตอนนี้เฉลี่ย '+r0(cur.p)+')' });
  if(cur.na > p.naLimit) gaps.push({ s:(cur.na-p.naLimit)/p.naLimit, t:'กดโซเดียมให้ต่ำกว่า <b>'+p.naLimit+' mg</b> (ตอนนี้เฉลี่ย '+r0(cur.na)+' · เกิน '+cur.naOver+'/'+cur.n+' วัน)' });
  if(cur.fib < p.fibGoal*0.7) gaps.push({ s:(p.fibGoal-cur.fib)/p.fibGoal, t:'เพิ่มใยอาหารให้ถึง <b>'+p.fibGoal+' g/วัน</b> (ตอนนี้ '+r1(cur.fib)+')' });
  if(cur.slp !== null && cur.slp < (p.sleepNeed||8)-0.75) gaps.push({ s:((p.sleepNeed||8)-cur.slp)/8, t:'นอนให้ได้ <b>'+(p.sleepNeed||8)+' ชม.</b> (ตอนนี้เฉลี่ย '+r1(cur.slp)+')' });
  if(cur.over >= 3) gaps.push({ s:cur.over/cur.n, t:'ลดวันที่เกินงบให้เหลือไม่เกิน 2 วัน (สัปดาห์นี้เกิน '+cur.over+' วัน)' });
  gaps.sort(function(a,b2){ return b2.s - a.s; });

  return '<ul class="items">'
    + row('แคลเฉลี่ย', cur.kcal, prv?prv.kcal:null, ' kcal', false)
    + row('ขาดดุลเฉลี่ย', cur.net, prv?prv.net:null, ' kcal', true)
    + row('โปรตีนเฉลี่ย', cur.p, prv?prv.p:null, ' g', true)
    + row('โซเดียมเฉลี่ย', cur.na, prv?prv.na:null, ' mg', false)
    + row('น้ำตาลเฉลี่ย', cur.sug, prv?prv.sug:null, ' g', false)
    + row('ใยอาหารเฉลี่ย', cur.fib, prv?prv.fib:null, ' g', true, 1)
    + (cur.slp !== null ? row('นอนเฉลี่ย', cur.slp, (prv&&prv.slp!==null)?prv.slp:null, ' ชม.', true, 1) : '')
    + row('วันที่เกินงบ', cur.over, prv?prv.over:null, ' วัน', false)
  + '</ul>'
  + (gaps.length
      ? '<div class="adv bad" style="margin-top:10px"><h3>เป้า 1 ข้อสำหรับสัปดาห์หน้า<s>ONE THING</s></h3>'
        + '<p>'+gaps[0].t+'</p>'
        + '<ul><li>แก้ทีละเรื่องได้ผลกว่าแก้พร้อมกันหมด — เลือกข้อนี้ข้อเดียวก่อน แล้วค่อยว่ากันสัปดาห์ถัดไป</li></ul></div>'
      : '<div class="adv ok" style="margin-top:10px"><h3>สัปดาห์นี้เข้าเป้าหมดแล้ว<s>ALL GOOD</s></h3>'
        + '<p>ไม่มีจุดไหนห่างเป้าอย่างมีนัยสำคัญ รักษาระดับนี้ไว้</p></div>')
  + (prv ? '' : '<div class="note">ยังไม่มีข้อมูลสัปดาห์ก่อนให้เทียบ — บันทึกต่ออีกสัปดาห์แล้วลูกศรเปรียบเทียบจะขึ้น</div>');
}

/* ==========================================================
   WEIGHT AUDIT — น้ำหนักนิ่ง / ขาดดุลแล้วทำไมไม่ลง
   แนวคิด: ถ้าตัวเลขขัดกับตาชั่ง แปลว่า "ระบบวัดผิด" ไม่ใช่ฟิสิกส์ผิด
   ========================================================== */
function weighIns(n){
  const out = [];
  for(let i=0;i<(n||60);i++){
    const k = shiftKey(today(),-i);
    const d = S.days[k];
    if(d && d.weight) out.push({ k:k, w:d.weight });
  }
  return out;   /* ใหม่ -> เก่า */
}
function plateauInfo(){
  const ma = maSeries().filter(function(x){ return x.ma !== null; });
  if(ma.length < 4) return null;
  const cur = ma[ma.length-1].ma;
  let days = 0;
  for(let i=ma.length-1;i>=0;i--){
    if(Math.abs(ma[i].ma - cur) <= 0.25) days++;
    else break;
  }
  const w = weighIns(30);
  return { days:days, cur:cur, nWeigh:w.length,
           spread: w.length>1 ? Math.max.apply(null,w.map(function(x){return x.w;})) - Math.min.apply(null,w.map(function(x){return x.w;})) : 0 };
}
function weightRecon(win){
  win = win || 14;
  const from = shiftKey(today(), -(win-1));
  const w = weighIns(win).filter(function(x){ return x.k >= from; });
  if(w.length < 2) return null;
  const newest = w[0], oldest = w[w.length-1];
  const span = Math.max(1, Math.round((new Date(newest.k+'T12:00:00') - new Date(oldest.k+'T12:00:00'))/86400000));
  let sumDef = 0, logged = 0, unlogged = 0, estKcal = 0, allKcal = 0, watchSum = 0;
  for(let i=0;i<span+1;i++){
    const k = shiftKey(newest.k, -i);
    if(k < oldest.k) break;
    if(hasFood(k)){
      logged++;
      sumDef += net(k);
      watchSum += (S.days[k].watch||0);
      (S.days[k].foods||[]).forEach(function(x){
        const kc = x.kcal*(x.q||1); allKcal += kc;
        const src = FOODS.filter(function(f){ return f.n === x.n || x.n.indexOf(f.n) === 0; })[0];
        if(src && src.est) estKcal += kc;
      });
    } else unlogged++;
  }
  if(logged < 4) return null;
  const dW = newest.w - oldest.w;                       /* + = ขึ้น */
  const predKg = -sumDef/7700;                          /* ที่ควรจะเป็นตามตัวเลขที่จด */
  const gapKg = dW - predKg;                            /* ต่างกันเท่าไหร่ */
  const gapKcalDay = (gapKg * 7700) / span;             /* แปลงเป็น kcal/วันที่หายไปจากบัญชี */
  return { span:span, logged:logged, unlogged:unlogged, sumDef:sumDef,
           dW:dW, predKg:predKg, gapKg:gapKg, gapKcalDay:gapKcalDay,
           estShare: allKcal ? estKcal/allKcal : 0,
           watchShare: logged ? (watchSum/logged)/(bmr()*S.profile.baseFactor + (watchSum/logged)) : 0,
           from:oldest.k, to:newest.k };
}
function viewWeightAudit(){

  let out = '';

      tips = ['ให้ดู<b>เส้นค่าเฉลี่ย 7 วัน</b>ในกราฟ WEIGHT PROJECTION แทนตัวเลขรายวัน',

              'ยังไม่ต้องลดแคลเพิ่ม รอให้ครบ 2 สัปดาห์ก่อนค่อยตัดสิน'];
    } else {
      lv = 'bad'; title = 'นิ่งมา '+d+' วัน — ถึงเวลาตรวจระบบวัดจริงจัง';
      body = 'เกิน 7 วันแล้วเส้นค่าเฉลี่ยยังไม่ขยับ <b>น้ำอธิบายไม่ได้แล้ว</b> เพราะน้ำในร่างกายแกว่งไปมา ไม่สะสมค้างเป็นสัปดาห์ · '
        + 'สาเหตุจริงที่พบบ่อยที่สุดเรียงตามความน่าจะเป็นคือ <b>จดอาหารต่ำกว่าจริง</b> → <b>ประเมินการเผาผลาญสูงเกินจริง</b> → <b>NEAT ลดลง</b> (พอขาดดุลนานๆ ร่างกายจะขยับน้อยลงเองโดยไม่รู้ตัว)';
      tips = ['ดูผลตรวจบัญชีด้านล่าง มันบอกได้ว่าตัวเลขหายไปวันละกี่ kcal',
              'ใช้ <b>AUTO-CALIBRATE TDEE</b> ปรับตัวคูณจากน้ำหนักจริง แทนการเดาจากสูตร',
              'ชั่ง 2 สัปดาห์แล้วเทียบค่าเฉลี่ยต่อค่าเฉลี่ย จะแม่นกว่าเทียบจุดต่อจุด'];
    }
    out += '<div class="stat4">'
      + '<div><s>เส้นเฉลี่ยนิ่งมา</s><b style="color:'+(d<=3?'var(--p-hot)':(d<=7?'var(--amber)':'var(--rad)'))+'">'+d+'</b><i>วัน</i></div>'
      + '<div><s>ค่าเฉลี่ยตอนนี้</s><b>'+r1(p.cur)+'</b><i>kg</i></div>'
      + '<div><s>ชั่งไป</s><b>'+p.nWeigh+'</b><i>ครั้ง / 30 วัน</i></div>'
      + '<div><s>ช่วงแกว่ง</s><b>'+r1(p.spread)+'</b><i>kg</i></div>'
    + '</div>'
    + '<div class="adv '+lv+'" style="margin-top:10px"><h3>'+title+'<s>PLATEAU</s></h3><p>'+body+'</p>'
    + '<ul>'+tips.map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ul></div>';
  }

  /* ---------- ตรวจบัญชี: ขาดดุลที่จด vs ตาชั่ง ---------- */
  if(!r){
    out += '<div class="empty">ตรวจบัญชียังทำไม่ได้ — ต้องมีน้ำหนักอย่างน้อย 2 ครั้งและวันที่จดอาหารครบ 4 วันใน 14 วันล่าสุด</div>';
  } else {
    const agree = Math.abs(r.gapKcalDay) < 150;
    const worse = r.gapKcalDay > 0;   /* ขึ้นมากกว่าที่ควร = มีแคลที่ไม่ได้ถูกนับ */
    out += '<div style="margin-top:14px;border-top:1px solid var(--p-dim);padding-top:10px">'
      + '<div style="font-size:10px;letter-spacing:2px;color:var(--p-mid);margin-bottom:7px">ตรวจบัญชีพลังงาน '+r.span+' วัน ('+thDate(r.from)+' – '+thDate(r.to)+')</div>'
      + '<div class="stat4">'
        + '<div><s>ขาดดุลที่จดได้</s><b>'+r0(r.sumDef)+'</b><i>kcal รวม</i></div>'
        + '<div><s>ตามนั้นควรลด</s><b>'+r1(-r.predKg)+'</b><i>kg</i></div>'
        + '<div><s>ตาชั่งบอก</s><b style="color:'+(r.dW>0?'var(--rad)':'var(--p-hot)')+'">'+(r.dW>0?'+':'')+r1(r.dW)+'</b><i>kg</i></div>'
        + '<div><s>ส่วนที่หายไป</s><b style="color:'+(agree?'var(--p-lit)':'var(--rad)')+'">'+(r.gapKcalDay>0?'+':'')+r0(r.gapKcalDay)+'</b><i>kcal/วัน</i></div>'
      + '</div>';

    if(agree){
      out += '<div class="adv ok" style="margin-top:10px"><h3>ตัวเลขกับตาชั่งตรงกัน<s>VERIFIED</s></h3>'
        + '<p>ส่วนต่างแค่ '+r0(Math.abs(r.gapKcalDay))+' kcal/วัน ซึ่งอยู่ในช่วงคลาดเคลื่อนปกติ — <b>ระบบวัดของพี่เชื่อถือได้</b> '
        + 'ตัวเลขในแอปสะท้อนของจริง ใช้วางแผนต่อได้เลย</p></div>';
    } else {
      const hyp = [];
      if(r.unlogged > 0){
        hyp.push({ w: r.unlogged*3, t:'<b>มี '+r.unlogged+' วันที่ไม่ได้จดอาหารเลย</b> ในช่วงนี้ — '
          + 'แอปไม่ได้นับวันพวกนั้นเข้าค่าเฉลี่ย แต่<b>ร่างกายนับ</b> · ถ้าวันที่ไม่จดคือวันที่กินเยอะ (ซึ่งมักเป็นแบบนั้น) '
          + 'ตัวเลขขาดดุลที่เห็นจะสวยเกินจริงทันที — <b>นี่คือข้อที่น่าสงสัยที่สุด</b>' });
      }
      if(r.estShare > 0.3){
        hyp.push({ w: r.estShare*6, t:'<b>'+r0(r.estShare*100)+'% ของแคลมาจากรายการที่ติดธง ~ (ค่าประมาณ)</b> — '
          + 'ค่าประมาณมักต่ำกว่าจริง โดยเฉพาะน้ำมันที่ใช้ผัด ซอส และขนาดจานที่ร้านให้จริง' });
      }
      if(r.watchShare > 0.18){
        hyp.push({ w: r.watchShare*10, t:'<b>Active Energy คิดเป็น '+r0(r.watchShare*100)+'% ของงบทั้งวัน</b> — '
          + 'นาฬิกาข้อมือมักประเมินการเผาผลาญ<b>สูงกว่าจริง</b>ได้มาก ยิ่งตัวเลขนี้เยอะ งบที่แอปให้ยิ่งเฟ้อ' });
      }
      hyp.push({ w:5, t:'<b>ประเมินปริมาณอาหารต่ำกว่าจริง</b> — น้ำมันผัด 1 ช้อนโต๊ะ = 120 kcal · '
        + '"ข้าว 1 ทัพพี" ของแต่ละร้านต่างกันได้เท่าตัว · ของชิมระหว่างทำอาหารและเครื่องดื่มมักไม่ถูกจด · '
        + 'งานวิจัยพบว่าคนทั่วไปจดต่ำกว่าจริง 20–50% โดยไม่ได้ตั้งใจ' });
      hyp.push({ w:3, t:'<b>NEAT ลดลง</b> — พอขาดดุลนานๆ ร่างกายจะขยับน้อยลงเองโดยไม่รู้ตัว (เดินช้าลง ขยับน้อยลง) '
        + 'หายไปได้หลายร้อย kcal/วันโดยที่ตัวเลขในแอปไม่เปลี่ยน' });
      hyp.sort(function(a,b2){ return b2.w - a.w; });

      out += '<div class="adv bad" style="margin-top:10px"><h3>'
        + (worse ? 'ตัวเลขบอกว่าควรลด แต่ตาชั่งไม่เห็นด้วย' : 'ลดได้เร็วกว่าที่ตัวเลขบอก')
        + '<s>MISMATCH</s></h3>'
        + '<p>ต่างกัน <b>'+r0(Math.abs(r.gapKcalDay))+' kcal/วัน</b> รวม '+r.span+' วันคือ <b>'+r0(Math.abs(r.gapKcalDay*r.span))+' kcal</b> · '
        + (worse
          ? '<b>กฎพลังงานไม่ได้พัง</b> — ถ้าขาดดุลจริงตามที่จด น้ำหนักต้องลง · เมื่อมันไม่ลง แปลว่า<b>ตัวเลขที่จดไม่ตรงกับของจริง</b> ไม่ใช่ร่างกายผิดปกติ'
          : 'ลดเร็วกว่าที่คำนวณ อาจแปลว่าจดอาหารเกินจริง หรือเผาผลาญมากกว่าที่ประเมิน')
        + '</p><ul>'+hyp.slice(0,4).map(function(x){ return '<li>'+x.t+'</li>'; }).join('')+'</ul></div>';

      if(r28 && Math.abs(r28.gapKcalDay) >= 150 && (r28.gapKcalDay > 0) === worse){
        out += '<div class="adv bad"><h3>เป็นแบบนี้ต่อเนื่องถึง '+r28.span+' วัน<s>2 WEEKS+</s></h3>'
          + '<p>ตรวจย้อนไป '+r28.span+' วันก็ยังต่าง <b>'+r0(Math.abs(r28.gapKcalDay))+' kcal/วัน</b> ไปทางเดียวกัน · '
          + '<b>ถึงจุดนี้อธิบายด้วยน้ำหรือโซเดียมไม่ได้แล้ว</b> เพราะน้ำในร่างกายแกว่งขึ้นลง ไม่สะสมค้างเป็นเดือน — '
          + 'มันคือ<b>ความคลาดเคลื่อนของระบบวัด</b> ที่ต้องแก้ที่ต้นทาง</p>'
          + '<ul><li><b>ทางแก้ที่ตรงจุดที่สุด: กด AUTO-CALIBRATE TDEE</b> — มันย้อนคำนวณการเผาผลาญจริงจากน้ำหนักที่เปลี่ยนจริง แทนการเชื่อสูตร '
          + 'เหมือนสอบเทียบเครื่องมือวัดใหม่แทนที่จะเถียงกับชิ้นงาน</li>'
          + '<li>ลองชั่งอาหาร 3 วันด้วยตาชั่งครัว แล้วเทียบกับที่เคยกะด้วยตา จะเห็นช่องว่างทันที</li>'
          + '<li>จดให้ครบทุกวันรวมวันหยุด — วันที่หายไปคือจุดบอดที่ใหญ่ที่สุด</li></ul></div>';
      }
    }
    out += '</div>';
  }
  return out;
}

function viewData(){
  const wk = kgPerWeek(), avg = avgNet(7), nDays = loggedDays(7).length;
  const cur = currentWeight(), goal = S.profile.goal;
  let eta = '—', etaNote = 'ยังคำนวณไม่ได้';
  if(wk !== null && Math.abs(wk) > 0.01){
    const diff = cur - goal;
    if(diff > 0 && wk < 0){
      const weeks = diff / (-wk); const dte = new Date(); dte.setDate(dte.getDate() + weeks*7);
      eta = dte.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
      etaNote = 'อีก ~'+r1(weeks)+' สัปดาห์ ถ้ารักษาระดับนี้';
    } else if(diff <= 0){ eta = 'ถึงแล้ว'; etaNote = 'น้ำหนักถึงเป้าหมายแล้ว'; }
    else { eta = 'ไม่ถึง'; etaNote = 'เทรนด์ปัจจุบันน้ำหนักขึ้น ไม่ลด'; }
  }
  const cal = calibrate();
  const calHtml = cal
    ? '<div class="note">จากข้อมูลจริง '+cal.n+' วัน ในช่วง '+cal.days+' วัน: กินเฉลี่ย <b>'+r0(cal.avgIn)+'</b> kcal/วัน '
      + 'น้ำหนัก'+(cal.dW<0?'ลด':'ขึ้น')+' <b>'+r1(Math.abs(cal.dW))+'</b> กก.</div>'
      + '<div class="stat4" style="margin-top:10px">'
        + '<div><s>สูตรประเมินไว้</s><b>'+r0(cal.model)+'</b><i>kcal/วัน</i></div>'
        + '<div><s>ของจริง</s><b>'+r0(cal.real)+'</b><i>kcal/วัน</i></div>'
        + '<div><s>ต่างกัน</s><b>'+(cal.real>cal.model?'+':'')+r0(cal.real-cal.model)+'</b><i>kcal/วัน</i></div>'
        + '<div><s>ตัวคูณที่ควรใช้</s><b>'+(Math.round(cal.factor*100)/100)+'</b><i>จาก '+S.profile.baseFactor+'</i></div>'
      + '</div>'
      + '<div class="btnrow"><button class="btn pri" id="applyCal">ปรับตัวคูณเป็น '+(Math.round(cal.factor*100)/100)+'</button></div>'
      + '<div class="note">ระบบย้อนคำนวณจากน้ำหนักที่เปลี่ยนจริง ไม่ใช่จากสูตรมาตรฐาน — ยิ่งบันทึกครบ ยิ่งแม่น ถ้าตัวเลขต่างกันมาก มักแปลว่าประเมินแคลอาหารต่ำกว่าจริง หรือขยับตัวมากกว่าที่คิด</div>'
    : '<div class="empty">ต้องมี<b>วันที่บันทึกอาหารครบ</b>อย่างน้อย 10 วัน และชั่งน้ำหนักห่างกันอย่างน้อย 10 วัน ระบบถึงจะย้อนคำนวณ TDEE จริงได้<br>'
      + 'วันที่นำเข้าจาก Apple Health (มีน้ำหนัก/Active Energy แต่ไม่มีอาหาร) จะ<b>ไม่ถูกนับ</b> เพราะไม่รู้ว่ากินไปเท่าไหร่ — ถ้าคำนวณรวมจะได้ค่าที่ผิดจนใช้ไม่ได้</div>';

  const rows = loggedDays(7).slice().reverse().map(function(k){
    const t = totals(k), b = budget(k), n = b - t.kcal;
    return '<li><span class="nm">'+thDate(k,{weekday:'short',day:'numeric',month:'short'})
      + '<s>IN '+r0(t.kcal)+' · OUT '+r0(b)+' · P'+r0(t.p)+' F'+r0(t.f)+' C'+r0(t.c)+' · NA '+r0(t.na)+' · K '+r0(t.k)+'</s></span>'
      + '<span></span><span class="kc" style="color:'+(n>=0?'var(--p-lit)':'var(--rad)')+'">'+(n>=0?'−':'+')+r0(Math.abs(n))+'</span>'
      + '<span style="font-size:10px;color:var(--p-dim)">kcal</span></li>';
  }).join('');

  return ''
  + '<div class="grid g3">'
    + card('เทรนด์น้ำหนัก', wk===null?'—':(wk>0?'+':'')+r1(wk), 'กก. / สัปดาห์', wk!==null && wk<0)
    + card('ขาดดุลเฉลี่ย', avg===null?'—':r0(avg), 'kcal/วัน (จาก '+nDays+' วัน)', avg!==null && avg>0)
    + card('ถึงเป้า '+goal+' kg', eta, etaNote, true)
  + '</div>'

  + '<div class="box" style="margin-top:12px"><h2>AUTO-CALIBRATE TDEE<span>หาค่าเผาผลาญจริงจากน้ำหนักที่เปลี่ยน</span></h2>'+calHtml+'</div>'

  + '<div class="box" style="margin-top:12px"><h2>INTAKE vs BURN<span>14 วันล่าสุด</span></h2>'
    + '<canvas id="cIntake" height="220"></canvas>'
    + '<div class="legend"><s style="color:var(--p-lit)">กินเข้า</s><s style="color:var(--amber)">งบเผาผลาญ</s><s style="color:var(--rad)">วันที่เกินงบ</s></div></div>'

  + '<div class="box" style="margin-top:12px"><h2>SODIUM &amp; SUGAR TREND<span>14 วันล่าสุด · เส้นประคือเพดาน</span></h2>'
    + '<canvas id="cNaSug" height="230"></canvas>'
    + '<div class="legend"><s style="color:var(--p-lit)">โซเดียม (mg)</s><s style="color:var(--amber)">น้ำตาล (g)</s><s class="dash" style="color:var(--rad)">เพดาน</s></div>'
    + '<div class="note">แกนซ้าย = โซเดียม · แกนขวา = น้ำตาล · แท่งที่ทะลุเส้นประคือวันที่เกิน</div></div>'

  + '<div class="box" style="margin-top:12px"><h2>ตัวการประจำ<span>อะไรทำให้เกินซ้ำๆ</span></h2>'
    + (allDayKeys().length
        ? trendAdvice(limitTrend('na', function(){ return S.profile.naLimit; }, 'mg', 'โซเดียม'))
          + trendAdvice(limitTrend('sug', function(){ return S.profile.sugLimit; }, 'g', 'น้ำตาล'))
          + trendAdvice(limitTrend('kcal', function(k){ return budget(k); }, 'kcal', 'แคลอรี่'))
        : '<div class="empty">ยังไม่มีข้อมูล — บันทึกอาหารสักสองสามวันก่อน แล้วระบบจะไล่หาตัวการซ้ำให้</div>')
    + '<div class="note">ระบบไล่ย้อนดูเฉพาะ<b>วันที่เกินเพดานจริง</b> แล้วนับว่าเมนูไหนโผล่ซ้ำมากที่สุดในวันเหล่านั้น — ไม่ใช่แค่เมนูที่กินบ่อย</div></div>'

  + '<div class="box" style="margin-top:12px"><h2>WEIGHT PROJECTION<span>ย้อนหลัง + พยากรณ์ 28 วัน</span></h2>'
    + '<canvas id="cWeight" height="240"></canvas>'
    + '<div class="legend"><s style="color:var(--p-mid)">น้ำหนักที่ชั่ง</s><s style="color:var(--p-lit)">ค่าเฉลี่ย 7 วัน</s><s class="dash" style="color:var(--amber)">พยากรณ์</s><s class="dash" style="color:var(--rad)">เป้าหมาย</s></div>'
    + '<div class="note">น้ำหนักรายวันเหวี่ยงจากน้ำและอาหารในท้อง ±1 กก. เป็นเรื่องปกติ — ให้ดู<b>เส้นค่าเฉลี่ย 7 วัน</b>เป็นหลัก เหมือนดู control chart ไม่ใช่จุดเดียว</div></div>'

  + '<div class="box" style="margin-top:12px;border-color:var(--amber)"><h2 style="color:var(--amber)">WEIGHT AUDIT<span>น้ำหนักนิ่ง · ขาดดุลแล้วทำไมไม่ลง</span></h2>'
    + viewWeightAudit() + '</div>'

  + '<div class="box" style="margin-top:12px;border-color:var(--p-lit)"><h2 style="color:var(--p-lit)">WEEKLY REVIEW<span>สัปดาห์นี้ เทียบสัปดาห์ก่อน</span></h2>'
    + weeklyReview() + '</div>'

  + '<div class="box" style="margin-top:12px"><h2>PROTEIN VALUE<span>ต้นทุนต่อกรัมโปรตีน</span></h2>'
    + viewProteinValue() + '</div>'

  + '<div class="box" style="margin-top:12px"><h2>รายงานสำหรับหมอ / เภสัชกร<span>พิมพ์ หรือบันทึกเป็น PDF</span></h2>'
    + '<div class="note">รวมค่าพลังงาน ค่าเฉลี่ย 7 วัน รายการอาหารเสริมพร้อมขนาดที่กินจริง และประเด็นที่ควรถาม — '
    + 'กดแล้วเครื่องจะเปิดหน้าต่างพิมพ์ บน iPhone เลือก <b>ตัวเลือกเพิ่มเติม → บันทึกเป็น PDF</b> ได้เลย</div>'
    + '<div class="btnrow"><button class="btn sm pri" id="doPrint">สร้างรายงาน / บันทึก PDF</button></div></div>'

  + '<div class="box" style="margin-top:12px"><h2>WEEKLY REPORT<span>สรุปสัปดาห์</span></h2>'
    + '<pre id="wkRep">'+esc(weeklyReport())+'</pre>'
    + '<div class="btnrow"><button class="btn sm" id="copyRep">คัดลอกรายงาน</button></div></div>'

  + '<div class="box" style="margin-top:12px"><h2>DAILY LEDGER<span>7 วันที่บันทึก</span></h2>'
    + (rows ? '<ul class="items">'+rows+'</ul>' : '<div class="empty">— ยังไม่มีข้อมูล —</div>') + '</div>';
}
function card(t, big, sub, good){
  return '<div class="box" style="text-align:center"><h2 style="justify-content:center">'+t+'</h2>'
    + '<div style="font-size:30px;line-height:1.1;color:'+(good?'var(--p-hot)':'var(--amber)')+';text-shadow:var(--glow)">'+big+'</div>'
    + '<div class="note" style="text-align:center">'+sub+'</div></div>';
}
function weeklyReport(){
  const ks = loggedDays(7);
  if(!ks.length) return 'ยังไม่มีข้อมูลพอสำหรับสรุปสัปดาห์';
  const p = S.profile;
  const agg = { kcal:0,b:0,p:0,f:0,c:0,sug:0,na:0,fib:0,k:0 };
  let naOver = 0, sugOver = 0, overDays = 0, best = null, worst = null;
  ks.forEach(function(k){
    const t = totals(k), b = budget(k), n = b - t.kcal;
    agg.kcal += t.kcal; agg.b += b; agg.p += t.p; agg.f += t.f; agg.c += t.c;
    agg.sug += t.sug; agg.na += t.na; agg.fib += t.fib; agg.k += t.k;
    if(t.na > p.naLimit) naOver++;
    if(t.sug > p.sugLimit) sugOver++;
    if(n < 0) overDays++;
    if(!best || n > best.n) best = {k:k,n:n};
    if(!worst || n < worst.n) worst = {k:k,n:n};
  });
  const N = ks.length;
  const ws = ks.filter(function(k){ return S.days[k].weight; });
  const wLine = ws.length >= 2
    ? r1(S.days[ws[ws.length-1]].weight)+' → '+r1(S.days[ws[0]].weight)+' กก. ('+((S.days[ws[0]].weight-S.days[ws[ws.length-1]].weight)>=0?'+':'')+r1(S.days[ws[0]].weight-S.days[ws[ws.length-1]].weight)+')'
    : 'ข้อมูลไม่พอ';
  const avgN = agg.b/N - agg.kcal/N;
  return ''
+ '=== NUTRI-BOY WEEKLY REPORT ===\n'
+ 'ช่วง        : '+thDate(ks[ks.length-1])+' – '+thDate(ks[0])+'  ('+N+' วันที่บันทึก)\n'
+ 'แคลเฉลี่ย   : '+r0(agg.kcal/N)+' kcal/วัน\n'
+ 'งบเฉลี่ย    : '+r0(agg.b/N)+' kcal/วัน\n'
+ 'ขาดดุลเฉลี่ย: '+r0(avgN)+' kcal/วัน  (เป้า '+(p.cycleOn?p.trainDeficit+'/'+p.restDeficit:p.targetDeficit)+')\n'
+ 'คาดการณ์    : '+(avgN>0?'-':'+')+r1(Math.abs(avgN*7/7700))+' กก./สัปดาห์\n'
+ 'น้ำหนัก     : '+wLine+'\n'
+ '\n'
+ 'โปรตีนเฉลี่ย: '+r0(agg.p/N)+' g  (เป้า '+r0(p.proteinPerKg*p.weight)+')\n'
+ 'ไขมันเฉลี่ย : '+r0(agg.f/N)+' g\n'
+ 'คาร์บเฉลี่ย : '+r0(agg.c/N)+' g\n'
+ 'ใยอาหาร     : '+r1(agg.fib/N)+' g/วัน  (เป้า '+p.fibGoal+')\n'
+ 'โซเดียม     : '+r0(agg.na/N)+' mg/วัน  — เกินเพดาน '+naOver+'/'+N+' วัน\n'
+ 'น้ำตาล      : '+r0(agg.sug/N)+' g/วัน   — เกินเพดาน '+sugOver+'/'+N+' วัน\n'
+ 'โพแทสเซียม  : '+r0(agg.k/N)+' mg/วัน  (เป้า '+p.kGoal+')\n'
+ 'สัดส่วน K:Na : '+(agg.na?r1(agg.k/agg.na):'—')+'  (ควร ≥ 1.75)\n'
+ '\n'
+ 'วันที่เกินงบ : '+overDays+'/'+N+' วัน\n'
+ 'ดีที่สุด     : '+thDate(best.k)+'  (ขาดดุล '+r0(best.n)+' kcal)\n'
+ 'หลุดมากสุด  : '+thDate(worst.k)+'  ('+(worst.n>=0?'ขาดดุล ':'เกิน ')+r0(Math.abs(worst.n))+' kcal)';
}
function currentWeight(){
  for(let i=0;i<60;i++){ const k = shiftKey(today(),-i); if(S.days[k] && S.days[k].weight) return S.days[k].weight; }
  return S.profile.weight;
}
function maSeries(){
  const arr = [];
  for(let i=29;i>=0;i--){
    const k = shiftKey(today(),-i);
    arr.push({ k:k, w:(S.days[k] && S.days[k].weight) ? S.days[k].weight : null });
  }
  arr.forEach(function(o,i){
    const win = arr.slice(Math.max(0,i-6), i+1).filter(function(x){ return x.w; });
    o.ma = win.length ? win.reduce(function(a,x){ return a + x.w; },0)/win.length : null;
  });
  return arr;
}

/* ---------- CHARTS ---------- */
function ctxOf(id, h){
  const cv = el(id); if(!cv) return null;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 600;
  cv.width = w*dpr; cv.height = h*dpr; cv.style.height = h+'px';
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  return { c:c, w:w, h:h };
}
function gridLines(c,w,h,pl,pr,pt,pb,rows){
  c.strokeStyle = 'rgba(30,148,85,.28)'; c.lineWidth = 1;
  for(let i=0;i<=rows;i++){ const y = pt + (h-pt-pb)*i/rows;
    c.beginPath(); c.moveTo(pl, y+.5); c.lineTo(w-pr, y+.5); c.stroke(); }
}
function drawCharts(){ drawIntake(); drawNaSug(); drawWeight(); }
function drawNaSug(){
  const o = ctxOf('cNaSug', 230); if(!o) return;
  const c = o.c, w = o.w, h = o.h, pl = 44, pr = 40, pt = 14, pb = 26;
  const p = S.profile;
  const ks = []; for(let i=13;i>=0;i--) ks.push(shiftKey(today(),-i));
  const rows = ks.map(function(k){ const t = totals(k); return { k:k, na:t.na, sug:t.sug, on:hasData(k) }; });
  const naMax  = Math.max(p.naLimit*1.6, Math.max.apply(null, rows.map(function(r){ return r.na; }))*1.15, 1000);
  const sugMax = Math.max(p.sugLimit*1.6, Math.max.apply(null, rows.map(function(r){ return r.sug; }))*1.15, 30);
  gridLines(c,w,h,pl,pr,pt,pb,4);
  c.font = '10px "Share Tech Mono",monospace';
  c.fillStyle = 'rgba(60,255,142,.85)'; c.textAlign = 'right';
  for(let i=0;i<=4;i++){ const y = pt+(h-pt-pb)*i/4; c.fillText(r0(naMax - naMax*i/4), pl-6, y+3); }
  c.fillStyle = 'rgba(255,176,0,.9)'; c.textAlign = 'left';
  for(let i=0;i<=4;i++){ const y = pt+(h-pt-pb)*i/4; c.fillText(r0(sugMax - sugMax*i/4), w-pr+5, y+3); }

  const bw = (w-pl-pr)/rows.length;
  const Yna  = function(v){ return h-pb-(clamp(v/naMax,0,1))*(h-pt-pb); };
  const Ysug = function(v){ return h-pb-(clamp(v/sugMax,0,1))*(h-pt-pb); };

  /* sodium bars */
  rows.forEach(function(r,i){
    if(!r.on || r.na <= 0) return;
    const x = pl+bw*i+bw*0.2, bwid = bw*0.44, y = Yna(r.na);
    const overNa = r.na > p.naLimit;
    c.fillStyle = overNa ? 'rgba(255,80,51,.7)' : 'rgba(60,255,142,.55)';
    c.fillRect(x, y, bwid, h-pb-y);
    c.strokeStyle = overNa ? '#FF5033' : '#3CFF8E'; c.lineWidth = 1;
    c.strokeRect(x+.5, y+.5, bwid-1, h-pb-y-1);
  });
  /* sugar line + dots */
  c.beginPath(); c.strokeStyle = '#FFB000'; c.lineWidth = 1.8;
  let started = false;
  rows.forEach(function(r,i){
    if(!r.on) return;
    const x = pl+bw*i+bw/2, y = Ysug(r.sug);
    started ? c.lineTo(x,y) : (c.moveTo(x,y), started = true);
  });
  c.stroke();
  rows.forEach(function(r,i){
    if(!r.on) return;
    const x = pl+bw*i+bw/2, y = Ysug(r.sug);
    c.fillStyle = r.sug > p.sugLimit ? '#FF5033' : '#FFB000';
    c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill();
  });
  /* limit lines */
  c.save(); c.setLineDash([5,4]); c.lineWidth = 1.3;
  c.strokeStyle = 'rgba(255,80,51,.75)';
  c.beginPath(); c.moveTo(pl, Yna(p.naLimit)); c.lineTo(w-pr, Yna(p.naLimit)); c.stroke();
  c.strokeStyle = 'rgba(255,176,0,.6)';
  c.beginPath(); c.moveTo(pl, Ysug(p.sugLimit)); c.lineTo(w-pr, Ysug(p.sugLimit)); c.stroke();
  c.restore();
  c.font = '9px "Share Tech Mono",monospace'; c.textAlign = 'left';
  c.fillStyle = 'rgba(255,80,51,.9)'; c.fillText('NA '+p.naLimit, pl+3, Yna(p.naLimit)-4);
  c.fillStyle = 'rgba(255,176,0,.9)'; c.fillText('SUG '+p.sugLimit, pl+3, Ysug(p.sugLimit)-4);
  /* date labels */
  c.textAlign = 'center'; c.fillStyle = 'rgba(30,148,85,.9)';
  rows.forEach(function(r,i){
    if(i % 2 !== 0) return;
    c.fillText(r.k.slice(8), pl+bw*i+bw/2, h-9);
  });
}
function drawIntake(){
  const o = ctxOf('cIntake', 220); if(!o) return;
  const c = o.c, w = o.w, h = o.h, pl = 42, pr = 10, pt = 12, pb = 26;
  const ks = []; for(let i=13;i>=0;i--) ks.push(shiftKey(today(),-i));
  const vals = ks.map(function(k){ return { k:k, in:totals(k).kcal, b:budget(k) }; });
  const max = Math.max(3000, Math.max.apply(null, vals.map(function(v){ return Math.max(v.in, v.b); }))*1.1);
  gridLines(c,w,h,pl,pr,pt,pb,4);
  c.fillStyle = 'rgba(30,148,85,.85)'; c.font = '10px "Share Tech Mono",monospace'; c.textAlign = 'right';
  for(let i=0;i<=4;i++){ const y = pt + (h-pt-pb)*i/4; c.fillText(r0(max - max*i/4), pl-6, y+3); }
  const bw = (w-pl-pr)/vals.length;
  vals.forEach(function(v,i){
    const x = pl + bw*i + bw*0.18, bwid = bw*0.64, hh = (v.in/max)*(h-pt-pb);
    if(v.in > 0){
      c.fillStyle = v.in > v.b ? 'rgba(255,80,51,.75)' : 'rgba(60,255,142,.6)';
      c.fillRect(x, h-pb-hh, bwid, hh);
      c.strokeStyle = v.in > v.b ? '#FF5033' : '#3CFF8E'; c.lineWidth = 1;
      c.strokeRect(x+.5, h-pb-hh+.5, bwid-1, hh-1);
    }
    if(i % 2 === 0){ c.fillStyle = 'rgba(30,148,85,.9)'; c.textAlign = 'center'; c.font = '9px "Share Tech Mono",monospace';
      c.fillText(v.k.slice(8), x+bwid/2, h-9); }
  });
  c.beginPath(); c.strokeStyle = '#FFB000'; c.lineWidth = 1.6;
  vals.forEach(function(v,i){ const x = pl + bw*i + bw/2, y = h-pb-(v.b/max)*(h-pt-pb); i ? c.lineTo(x,y) : c.moveTo(x,y); });
  c.stroke();
}
function drawWeight(){
  const o = ctxOf('cWeight', 240); if(!o) return;
  const c = o.c, w = o.w, h = o.h, pl = 42, pr = 10, pt = 14, pb = 26;
  const hist = maSeries(), cur = currentWeight(), wk = kgPerWeek();
  const proj = []; for(let i=1;i<=28;i++) proj.push(cur + (wk===null?0:wk)*(i/7));
  const all = hist.map(function(x){ return x.w; }).filter(Boolean).concat(proj, [S.profile.goal, cur]);
  let lo = Math.min.apply(null, all) - 1, hi = Math.max.apply(null, all) + 1;
  if(hi - lo < 3){ const m = (hi+lo)/2; lo = m-1.5; hi = m+1.5; }
  const N = hist.length + proj.length;
  const X = function(i){ return pl + (w-pl-pr)*i/(N-1); };
  const Y = function(v){ return h-pb - (v-lo)/(hi-lo)*(h-pt-pb); };
  gridLines(c,w,h,pl,pr,pt,pb,4);
  c.fillStyle = 'rgba(30,148,85,.85)'; c.font = '10px "Share Tech Mono",monospace'; c.textAlign = 'right';
  for(let i=0;i<=4;i++){ const y = pt + (h-pt-pb)*i/4; c.fillText(r1(hi - (hi-lo)*i/4), pl-6, y+3); }
  c.save(); c.setLineDash([5,5]); c.strokeStyle = 'rgba(255,80,51,.8)'; c.lineWidth = 1.4;
  c.beginPath(); c.moveTo(pl, Y(S.profile.goal)); c.lineTo(w-pr, Y(S.profile.goal)); c.stroke(); c.restore();
  c.fillStyle = 'rgba(255,80,51,.9)'; c.textAlign = 'left'; c.font = '9px "Share Tech Mono",monospace';
  c.fillText('GOAL '+S.profile.goal, pl+4, Y(S.profile.goal)-4);
  c.save(); c.setLineDash([2,4]); c.strokeStyle = 'rgba(207,255,228,.35)';
  c.beginPath(); c.moveTo(X(hist.length-1), pt); c.lineTo(X(hist.length-1), h-pb); c.stroke(); c.restore();
  c.fillStyle = 'rgba(30,148,85,.95)';
  hist.forEach(function(o2,i){ if(o2.w){ c.beginPath(); c.arc(X(i), Y(o2.w), 2.6, 0, 7); c.fill(); } });
  c.beginPath(); c.strokeStyle = '#3CFF8E'; c.lineWidth = 2; c.shadowColor = 'rgba(60,255,142,.6)'; c.shadowBlur = 6;
  let started = false;
  hist.forEach(function(o2,i){ if(o2.ma === null) return; const x = X(i), y = Y(o2.ma);
    started ? c.lineTo(x,y) : (c.moveTo(x,y), started = true); });
  c.stroke(); c.shadowBlur = 0;
  c.save(); c.setLineDash([6,4]); c.beginPath(); c.strokeStyle = '#FFB000'; c.lineWidth = 1.8;
  c.moveTo(X(hist.length-1), Y(cur));
  proj.forEach(function(v,i){ c.lineTo(X(hist.length+i), Y(v)); });
  c.stroke(); c.restore();
  c.fillStyle = '#FFB000'; c.textAlign = 'right'; c.font = '11px "Share Tech Mono",monospace';
  c.fillText(r1(proj[proj.length-1])+' kg', w-pr-4, clamp(Y(proj[proj.length-1])-10, pt+11, h-pb-14));
  c.textAlign = 'center'; c.fillStyle = 'rgba(207,255,228,.5)'; c.font = '9px "Share Tech Mono",monospace';
  c.fillText('วันนี้', X(hist.length-1), h-9); c.fillText('+28 วัน', X(N-1)-16, h-9);
}

/* ---------- CSV EXPORT ---------- */
const WD_TH = ['อา','จ','อ','พ','พฤ','ศ','ส'];
function csvCell(v){
  v = (v === null || v === undefined) ? '' : String(v);
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
}
function csvRow(arr){ return arr.map(csvCell).join(',') + '\r\n'; }
function dailyCSV(){
  let out = csvRow(['วันที่','วัน','แคลกินเข้า_kcal','งบเผาผลาญ_kcal','ขาดดุล_บวก_เกิน_ลบ_kcal',
    'โปรตีน_g','ไขมัน_g','คาร์บ_g','น้ำตาล_g','โซเดียม_mg','โพแทสเซียม_mg','ใยอาหาร_g',
    'น้ำหนัก_kg','น้ำ_ml','ActiveEnergy_kcal','ออกกำลังกาย_kcal','นอน_ชม','ไข้_C']);
  allDayKeys().forEach(function(k){
    const t = totals(k), b = budget(k), d = S.days[k];
    out += csvRow([k, WD_TH[new Date(k+'T12:00:00').getDay()], r0(t.kcal), r0(b), r0(b-t.kcal),
      r1(t.p), r1(t.f), r1(t.c), r1(t.sug), r0(t.na), r0(t.k), r1(t.fib),
      (d.weight!==null && d.weight!==undefined) ? r1(d.weight) : '',
      waterMl(k), d.watch||0, r0(sumEx(d)),
      (d.sleep && d.sleep.h) ? r1(d.sleep.h) : '',
      (d.sick && d.sick.temp) ? d.sick.temp : '']);
  });
  return out;
}
function itemsCSV(){
  let out = csvRow(['วันที่','เวลา','มื้อ','ชื่ออาหาร','จำนวน','หน่วย','แคล_kcal',
    'โปรตีน_g','ไขมัน_g','คาร์บ_g','น้ำตาล_g','โซเดียม_mg','โพแทสเซียม_mg','ใยอาหาร_g']);
  allDayKeys().forEach(function(k){
    (S.days[k].foods||[]).forEach(function(x){
      const q = x.q||1;
      out += csvRow([k, x.t||'', MEALS[x.meal]||x.meal||'', x.n, r1(q), x.u||'', r0(x.kcal*q),
        r1(x.p*q), r1(x.f*q), r1(x.c*q), r1((x.sug||0)*q), r0((x.na||0)*q), r0((x.k||0)*q), r1((x.fib||0)*q)]);
    });
  });
  return out;
}
function downloadCSV(content, filename){
  const blob = new Blob(['\uFEFF' + content], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
}

  let h = 0;
  for(let i=0;i<t.length;i++){ h = ((h<<5)-h+t.charCodeAt(i))|0; }
  return 'c'+Math.abs(h).toString(36);
}

    const title = (h2.childNodes[0] && h2.childNodes[0].textContent || h2.textContent).trim();
    if(!title) return;
    const id = colId(title);
    box.dataset.colReady = '1';
    box.dataset.colId = id;
    let shut;
    if(st[id] === undefined){
      shut = COL_DEFAULT_SHUT.some(function(k){ return title.indexOf(k) >= 0; });
    } else { shut = !!st[id]; }
    box.classList.toggle('shut', shut);
    h2.classList.add('colh');
    h2.insertAdjacentHTML('beforeend','<em class="chev">'+(shut?'▸':'▾')+'</em>');
    h2.addEventListener('click', function(e){
      if(e.target.closest('button,input,select')) return;
      const now = !box.classList.contains('shut');
      box.classList.toggle('shut', now);
      colState()[id] = now ? 1 : 0;
      const c = h2.querySelector('.chev'); if(c) c.textContent = now ? '▸' : '▾';

      Store.save(S);
      if(!now && ACTIVE === 'data') drawCharts();

    });
  });

function importMyFoods(raw){
  let data;
  try{ data = JSON.parse((raw||'').trim()); }
  catch(e){ toast('JSON ไม่ถูกต้อง — ตรวจวงเล็บกับเครื่องหมายคำพูดอีกที'); return; }
  const arr = Array.isArray(data) ? data : (data.foods || data.items || []);
  if(!Array.isArray(arr) || !arr.length){ toast('ไม่พบรายการอาหารใน JSON นี้'); return; }
  let added = 0, updated = 0;
  arr.forEach(function(x){
    const n = x.n || x.name; if(!n) return;
    const rec = { n:n, u:x.u||'', cat:MYCATS.indexOf(x.cat)>=0 ? x.cat : 'โปรตีน', tag:x.tag||'',
      kcal:+(x.kcal||0), p:+(x.p||0), f:+(x.f||0), c:+(x.c||0),
      sug:+(x.sug||0), na:+(x.na||0), fib:+(x.fib||0), sa:+(x.sa||0), k:+(x.k||0) };
    const i = myFoods().map(function(y){ return y.n; }).indexOf(n);
    if(i >= 0){ rec.id = myFoods()[i].id; myFoods()[i] = rec; updated++; }
    else { rec.id = uid(); myFoods().push(rec); added++; }
  });
  beep(1318,.09); save();
  toast('นำเข้าคลัง: เพิ่ม '+added+' · อัปเดต '+updated+' รายการ');

async function boot(){
  const log = el('bootlog');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el('boot').style.display = 'none'; return; }
  for(let i=0;i<BOOT_LINES.length;i++){
    const line = BOOT_LINES[i];
    log.innerHTML += (i ? '\n' : '') + '<b>' + esc(line) + '</b>';
    if(line) beep(240 + i*32, .022, .02);
    await new Promise(function(r){ setTimeout(r, line ? 95 : 40); });
  }
  await new Promise(function(r){ setTimeout(r, 400); });
  el('boot').classList.add('done');
  setTimeout(function(){ el('boot').style.display = 'none'; }, 520);
}

  long:  { t:'กินยาวได้',      cls:'ok'  },

function suppState(){
  if(!S.supp) S.supp = { on:[], dose:{}, start:{}, log:{} };
  if(!S.supp.on) S.supp.on = [];
  if(!S.supp.dose) S.supp.dose = {};
  if(!S.supp.start) S.supp.start = {};
  if(!S.supp.log) S.supp.log = {};
  return S.supp;
}
function suppById(id){ return SUPPS.filter(function(x){ return x.id === id; })[0]; }
function suppDose(id){ const st = suppState(); const s = suppById(id);
  return (st.dose[id] !== undefined && st.dose[id] !== null) ? st.dose[id] : (s ? s.dose : 0); }
function tookToday(id){ const st = suppState(); return !!(st.log[today()] && st.log[today()][id]); }
function daysOn(id){
  const st = suppState(); const from = st.start[id];
  if(!from) return 0;
  return Math.round((new Date(today()+'T12:00:00') - new Date(from+'T12:00:00'))/86400000) + 1;
}

/* ---------- SODIUM ↔ POTASSIUM ---------- */
function naK(k){
  const t = totals(k || today()), p = S.profile;
  const ideal = Math.max(p.kGoal, t.na * 1.75);        /* WHO: Na<2000, K>3510 → K ≈ 1.75 × Na */
  const target = clamp(ideal, p.kGoal, 4700);          /* 4700 mg = เพดานที่กินจากอาหารได้จริง */
  const gap = Math.max(0, target - t.k);
  return { na:t.na, k:t.k, target:target, ideal:ideal, gap:gap, capped:ideal > 4700,
           ratio: t.k > 0 ? t.k / t.na : null };
}

/* ==========================================================
   FOCUS — โมเดลค่าสติ (Two-Process Model + ตัวปรับ)
   Process S = แรงกดดันการนอนที่สะสมตามชั่วโมงที่ตื่น
   Process C = จังหวะเซอร์คาเดียนตามเวลาของวัน
   ค่าที่ได้เป็น "ดัชนีประมาณการ" ไม่ใช่การวัดจริง
   ========================================================== */

/* ---------- time helpers ---------- */
function nowMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function nowHM(){ const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function hm2min(s){ if(!s || typeof s !== 'string') return null;
  const p = s.split(':'); const h = +p[0], m = +p[1];
  return (isNaN(h)||isNaN(m)) ? null : h*60+m; }
function min2hm(m){ m = ((Math.round(m)%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

/* ---------- sleep record ---------- */
function sleepRec(k){ const d = S.days[k||today()]; return (d && d.sleep) ? d.sleep : null; }
function sleepHours(k){ const s = sleepRec(k); return s && s.h ? s.h : null; }
function wakeMin(k){
  const s = sleepRec(k || today());
  const w = s && s.wake ? hm2min(s.wake) : null;
  return w === null ? 7*60 : w;               /* ค่าตั้งต้น 07:00 ถ้ายังไม่กรอก */
}
function sleepDebt7(k){
  k = k || today();
  const need = S.profile.sleepNeed || 8;
  let debt = 0, n = 0;
  for(let i=1;i<=7;i++){
    const h = sleepHours(shiftKey(k,-i));
    if(h === null) continue;
    debt += Math.max(0, need - h); n++;
  }
  return { debt:debt, nights:n };
}
function sleepBase(k){
  k = k || today();
  const need = S.profile.sleepNeed || 8;
  const h = sleepHours(k);
  const dbt = sleepDebt7(k);
  const parts = [];
  let base = 100;
  if(h === null){
    parts.push({ n:'ยังไม่ได้กรอกเวลานอน', v:0, note:'ใช้ค่าสมมติว่านอนครบ' });
  } else {
    const short = Math.max(0, need - h);
    const pen = short * 12;
    if(pen > 0) parts.push({ n:'นอนขาด '+r1(short)+' ชม.', v:-r0(pen) });
    base -= pen;
    if(h > need + 1.5){ base -= 3; parts.push({ n:'นอนเกินจนเบลอ', v:-3 }); }
  }
  const dpen = Math.min(25, dbt.debt * 3);
  if(dpen > 0){ base -= dpen; parts.push({ n:'หนี้การนอนสะสม '+r1(dbt.debt)+' ชม.', v:-r0(dpen) }); }
  return { base: clamp(base, 25, 100), parts: parts, debt: dbt };
}

/* ---------- Process C : circadian alertness ---------- */
const CIRC = [-22,-26,-30,-32,-33,-30,-20,-8,0,6,9,9,5,-1,-6,-7,-4,0,4,6,4,0,-6,-14];
function circadian(min){
  const h = (min/60) % 24, i = Math.floor(h), f = h - i;
  return CIRC[i%24]*(1-f) + CIRC[(i+1)%24]*f;
}
/* ---------- Process S : homeostatic pressure ---------- */
function pressure(min, k){
  let awake = min - wakeMin(k);
  if(awake < 0) awake += 1440;
  return -32 * Math.min(1.25, awake/(16*60));
}
function hoursAwake(min, k){
  let a = (min === undefined ? nowMin() : min) - wakeMin(k);
  if(a < 0) a += 1440;
  return a/60;
}

/* ---------- caffeine pharmacokinetics ---------- */
const CAFMAP = {
 'กาแฟดำ/อเมริกาโน่':120,'กาแฟเย็น':150,'ลาเต้เย็น':120,'ชาเย็น':50,'ชาเขียวเย็น':35,
 'ชานมไข่มุก':50,'โอเลี้ยง':110,'น้ำอัดลม 1 กระป๋อง':35,'Sprite กระป๋อง 325ml':0
};
function cafOfName(n){
  if(CAFMAP[n] !== undefined) return CAFMAP[n];
  const keys = Object.keys(CAFMAP);

/* เหตุการณ์ที่มีคาเฟอีนวันนี้: {min, mg, src} */
function cafEvents(k){
  k = k || today();
  const d = day(k), out = [];
  d.foods.forEach(function(x){
    const mg = cafOfName(x.n) * (x.q||1);
    if(mg > 0 && x.t) out.push({ min:hm2min(x.t), mg:mg, src:x.n });
  });
  const st = suppState(), lg = st.log[k] || {};
  if(lg['caffeine'] && typeof lg['caffeine'] === 'string')
    out.push({ min:hm2min(lg['caffeine']), mg:suppDose('caffeine'), src:'Caffeine (เม็ด)' });
  return out.filter(function(e){ return e.min !== null; });
}
/* ระดับคาเฟอีนโดยประมาณ (mg) : ขึ้น 30 นาที แล้วครึ่งชีวิต 5 ชม. */
function cafLevel(min, k){
  return cafEvents(k).reduce(function(a,e){
    const dt = min - e.min;
    if(dt < 0) return a;
    const ramp = dt < 30 ? dt/30 : 1;
    const decay = dt < 30 ? 1 : Math.pow(0.5, (dt-30)/300);
    return a + e.mg * ramp * decay;
  }, 0);
}
function cafTotalToday(){ return cafEvents().reduce(function(a,e){ return a+e.mg; },0); }

/* ---------- theanine window ---------- */
function theanineActive(min, k){
  const st = suppState(), lg = st.log[k || today()] || {};
  if(!lg['theanine'] || typeof lg['theanine'] !== 'string') return false;
  const t0 = hm2min(lg['theanine']); if(t0 === null) return false;
  return min >= t0 + 30 && min <= t0 + 240;
}

/* ---------- meals grouped into eating events ---------- */
function mealEvents(k){
  const d = day(k || today()), ev = [];
  d.foods.forEach(function(x){
    if(!x.t) return;
    const m = hm2min(x.t); if(m === null) return;
    const q = x.q||1, kc = x.kcal*q, cb = x.c*q;
    const hit = ev.filter(function(e){ return Math.abs(e.min - m) <= 45; })[0];
    if(hit){ hit.kcal += kc; hit.c += cb; hit.min = Math.min(hit.min, m); }
    else ev.push({ min:m, kcal:kc, c:cb });
  });
  return ev;
}
function exEvents(k){
  return day(k || today()).ex.filter(function(x){ return x.t; })
    .map(function(x){ return { min:hm2min(x.t), mins:x.mins }; })
    .filter(function(e){ return e.min !== null; });
}
function alcoholEvents(k){

    .map(function(x){ return { min:hm2min(x.t), q:(x.q||1) }; })
    .filter(function(e){ return e.min !== null; });
}

/* ==========================================================
   DIGESTION — เวลาย่อย / ความอิ่ม / ระยะห่างก่อนนอน
   ค่าประมาณจากช่วงเวลาการระบายอาหารออกจากกระเพาะที่รายงานในงานวิจัย
   ========================================================== */
function digestOf(e){
  /* e = {min, kcal, c, p, f, fib} — ประเมินเป็นชั่วโมง */
  const kcal = e.kcal || 0, fat = e.f || 0, pro = e.p || 0, fib = e.fib || 0;
  /* กระเพาะระบายอาหาร: ยิ่งแคลเยอะและไขมันสูง ยิ่งช้า */
  let empty = 1.0 + kcal/450 + fat/28 + fib/40;
  empty = clamp(empty, 0.7, 5.5);
  /* ความอิ่ม: โปรตีนกับใยอาหารยืดได้จริง คาร์บล้วนสั้นสุด */
  let full = 1.2 + kcal/330 + pro/22 + fib/9 - (e.c && kcal ? ((e.c*4)/kcal > 0.6 ? 0.6 : 0) : 0);
  full = clamp(full, 0.8, 6.5);
  /* ก่อนนอนควรห่างเท่าไหร่ */
  let bedGap = clamp(empty * 0.85, 1.0, 3.5);
  if(kcal > 700) bedGap = Math.max(bedGap, 3);
  return { empty:empty, full:full, bedGap:bedGap };
}
function mealEventsFull(k){
  const d = day(k||today()), ev = [];
  d.foods.forEach(function(x){
    if(!x.t) return;
    const m = hm2min(x.t); if(m === null) return;
    const q = x.q||1;
    const hit = ev.filter(function(e){ return Math.abs(e.min - m) <= 45; })[0];
    const add = { kcal:x.kcal*q, c:x.c*q, p:x.p*q, f:x.f*q, fib:(x.fib||0)*q };
    if(hit){ hit.kcal+=add.kcal; hit.c+=add.c; hit.p+=add.p; hit.f+=add.f; hit.fib+=add.fib;
             hit.min = Math.min(hit.min, m); hit.names.push(x.n); }
    else ev.push(Object.assign({ min:m, names:[x.n] }, add));
  });
  return ev.sort(function(a,b){ return a.min - b.min; });
}

              'ดูตัวเลขในกล่องนี้ว่าวันที่ข้ามเช้า แคลรวมสูงกว่าหรือต่ำกว่าวันปกติ'] });
    }
    if(lateHeavy >= 3){
      out.push({ lv:'warn', tag:'LATE', title:'พลังงานกระจุกตอนเย็น '+lateHeavy+' วัน',
        body:'มีวันที่ได้แคลเกินครึ่งหลัง 18:00 อยู่ '+lateHeavy+' ใน '+st.length+' วัน · เรื่องนี้<b>ไม่ได้ทำให้อ้วนโดยตรง</b> (แคลรวมยังเป็นตัวตัดสิน) แต่กระทบสองอย่างที่วัดได้จริง: <b>กรดไหลย้อนกับคุณภาพการนอน</b> เพราะมื้อใหญ่ใกล้เวลานอน และ<b>ค่าสติช่วงบ่าย</b>ที่ตกเพราะยังไม่ได้กินอะไร',
        tips:['ถ้าเลี่ยงไม่ได้จริงๆ ให้ย้ายแค่ 300–400 kcal มาเป็นมื้อบ่าย จะช่วยทั้งความหิวและการนอน',
              'ดูกล่อง DIGESTION TIMELINE ว่ามื้อเย็นห่างเวลานอนพอมั้ย'] });
    }
    if(oneMeal >= 3 && avgP < pt*0.8){
      out.push({ lv:'bad', tag:'PROTEIN', title:'กินวันละ 1–2 มื้อ + โปรตีนไม่ถึงเป้า',
        body:'นี่คือชุดที่<b>อันตรายที่สุดต่อกล้ามเนื้อ</b>ในช่วงลดน้ำหนัก — เฉลี่ยได้โปรตีน '+r0(avgP)+' g จากเป้า '+r0(pt)+' g · '
          + 'การกินโปรตีนก้อนใหญ่ครั้งเดียวร่างกายใช้ได้ก็จริง แต่งานวิจัยชี้ว่า<b>การกระจายโปรตีนราว 3–4 มื้อ (มื้อละ ~0.4 g/kg) รักษากล้ามได้ดีกว่า</b>กินรวบมื้อเดียว · พอบวกกับขาดดุลแคล น้ำหนักที่หายจะเป็นกล้ามมากขึ้น',
        tips:['ถ้าจะกินน้อยมื้อจริงๆ อย่างน้อยแทรกโปรตีนล้วนสักตัว เช่น ISO SOY 1 แก้ว (30 g / 130 kcal) ตอนบ่าย',
              'เป้าง่ายๆ: มื้อละอย่างน้อย '+r0(p.weight*0.4)+' g โปรตีน'] });
    }
    /* เทียบวันข้ามเช้า vs วันปกติ — วัดจากข้อมูลจริง */
    const A = st.filter(function(d){ return d.noBreak; }), B = st.filter(function(d){ return !d.noBreak; });
    if(A.length >= 2 && B.length >= 2){
      const ak = A.reduce(function(a,d){ return a+d.kcal; },0)/A.length;
      const bk = B.reduce(function(a,d){ return a+d.kcal; },0)/B.length;
      const dif = ak - bk;
      out.push({ lv: Math.abs(dif) < 120 ? 'ok' : (dif > 0 ? 'warn' : 'ok'), tag:'YOUR DATA',
        title:'ข้อมูลของพี่เอง: วันข้ามเช้า กินมากขึ้นหรือน้อยลง',
        body:'วันที่ข้ามเช้า เฉลี่ย <b>'+r0(ak)+' kcal</b> ('+A.length+' วัน) · วันปกติ <b>'+r0(bk)+' kcal</b> ('+B.length+' วัน) — ต่างกัน <b>'+(dif>0?'+':'')+r0(dif)+' kcal</b>',
        tips:[ Math.abs(dif) < 120
            ? 'แทบไม่ต่าง แปลว่าการข้ามเช้าไม่ได้ทำให้พี่กินชดเชย — ทำต่อได้ถ้าสะดวก'
            : (dif > 0
              ? 'วันข้ามเช้ากลับกินมากกว่า แปลว่า<b>ชดเชยเกิน</b> การกินเช้าเบาๆ อาจช่วยคุมทั้งวันได้ดีกว่า'
              : 'วันข้ามเช้ากินน้อยกว่าจริง ใช้เป็นเครื่องมือคุมแคลได้ แต่ต้องเช็คว่าโปรตีนยังถึงเป้า') ] });
    }
  } else {
    out.push({ lv:'warn', tag:'NEED DATA', title:'ข้อมูลยังไม่พอวิเคราะห์แพทเทิร์น',
      body:'ต้องมีวันที่บันทึกอาหารพร้อมเวลาอย่างน้อย 4 วัน ตอนนี้มี <b>'+st.length+'</b> วัน', tips:[] });
  }

  return head + out.map(function(a){
    return '<div class="adv '+a.lv+'"><h3>'+a.title+'<s>'+a.tag+'</s></h3><p>'+a.body+'</p>'
      + (a.tips.length ? '<ul>'+a.tips.map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ul>' : '')+'</div>';
  }).join('')
  + '<div class="note">สรุปหลักฐานสั้นๆ: <b>จำนวนมื้อไม่ได้กำหนดน้ำหนัก แคลรวมทั้งวันต่างหาก</b> — งานวิเคราะห์รวมพบว่าการกินแบบจำกัดเวลา (IF) ลดน้ำหนักได้พอๆ กับการคุมแคลแบบปกติเมื่อแคลเท่ากัน · สิ่งที่การอดมื้อกระทบจริงคือ<b>ความหิวสะสม การกระจายโปรตีน และคุณภาพการนอน</b> ไม่ใช่ตัวเลขบนตาชั่งโดยตรง</div>';
}

/* ==========================================================

function debtIfTonight(h){
  /* หนี้สะสมของ 7 คืนที่จะจบลงคืนนี้ */
  const need = S.profile.sleepNeed || 8;
  let debt = Math.max(0, need - h);
  for(let i=0;i<6;i++){
    const v = sleepHours(shiftKey(today(),-i));
    if(v === null) continue;
    debt += Math.max(0, need - v);
  }
  return debt;
}
function focusIfTonight(h){
  const need = S.profile.sleepNeed || 8;
  let base = 100 - Math.max(0, need - h) * 12;
  if(h > need + 1.5) base -= 3;
  base -= Math.min(25, debtIfTonight(h) * 3);
  base = clamp(base, 25, 100);
  /* ค่าเฉลี่ยคร่าวๆ ของวันถัดไป: หัก Process S เฉลี่ยตลอดวันตื่น */
  return clamp(base - 16, 0, 100);
}

function sleepVsIntake(){
  const need = S.profile.sleepNeed || 8;
  const lo = [], hi = [];
  for(let i=0;i<45;i++){
    const k = shiftKey(today(),-i);
    const h = sleepHours(k);
    if(h === null || !hasData(k)) continue;
    const t = totals(k);
    if(!t.kcal) continue;
    (h < need - 0.5 ? lo : hi).push({ kcal:t.kcal, sug:t.sug, net:net(k) });
  }
  const avg = function(a,f){ return a.reduce(function(x,y){ return x+y[f]; },0)/a.length; };
  if(lo.length < 3 || hi.length < 3){
    return '<div class="empty">ต้องมีข้อมูลอย่างน้อย 3 วันในแต่ละกลุ่ม (คืนที่นอนพอ กับคืนที่นอนน้อย) ระบบถึงจะเทียบให้ได้ — ตอนนี้มี '
      + hi.length+' / '+lo.length+' วัน</div>'
      + '<div class="note">งานวิจัยพบว่าการนอนน้อยเพิ่มฮอร์โมนเกรลิน (หิว) และลดเลปติน (อิ่ม) ทำให้กินมากขึ้นโดยเฉพาะของหวานและของทอด · และในงานที่ควบคุมแคลเท่ากัน กลุ่มที่นอน 5.5 ชม. <b>ลดไขมันได้น้อยกว่ากลุ่มที่นอน 8.5 ชม. อย่างมีนัยสำคัญ และเสียกล้ามเนื้อมากกว่า</b> — แปลว่าการนอนไม่ได้เปลี่ยนสมการแคลโดยตรง แต่เปลี่ยนว่าน้ำหนักที่หายไปเป็นไขมันหรือกล้าม</div>';
  }
  const dk = avg(lo,'kcal') - avg(hi,'kcal');
  const ds = avg(lo,'sug') - avg(hi,'sug');
  return '<div class="stat4">'
    + '<div><s>คืนที่นอนพอ ('+hi.length+' วัน)</s><b>'+r0(avg(hi,'kcal'))+'</b><i>kcal เฉลี่ย</i></div>'
    + '<div><s>คืนที่นอนน้อย ('+lo.length+' วัน)</s><b>'+r0(avg(lo,'kcal'))+'</b><i>kcal เฉลี่ย</i></div>'
    + '<div><s>ต่างกัน</s><b style="color:'+(dk>0?'var(--rad)':'var(--p-lit)')+'">'+(dk>0?'+':'')+r0(dk)+'</b><i>kcal/วัน</i></div>'
    + '<div><s>น้ำตาลต่างกัน</s><b style="color:'+(ds>0?'var(--amber)':'var(--p-lit)')+'">'+(ds>0?'+':'')+r0(ds)+'</b><i>g/วัน</i></div>'
  + '</div>'
  + '<div class="note">'
    + (dk > 100
      ? 'ข้อมูลของพี่เองบอกว่า <b>คืนที่นอนน้อย วันรุ่งขึ้นกินมากกว่าเฉลี่ย '+r0(dk)+' kcal</b> ซึ่งตรงกับที่งานวิจัยพบ (นอนน้อย → เกรลินขึ้น เลปตินลง → หิวมากขึ้นโดยเฉพาะของหวานของทอด) · ถ้าคิดเป็นสัปดาห์ที่นอนน้อย 3 คืน = '+r0(dk*3)+' kcal ≈ '+r1(dk*3/7700)+' กก. ที่ไม่ได้ลด'
      : (dk < -100
        ? 'ข้อมูลของพี่กลับด้านกับงานวิจัย — คืนที่นอนน้อยกลับกินน้อยกว่า อาจเป็นเพราะวันที่ยุ่งจนนอนน้อยคือวันที่ไม่มีเวลากินด้วย ระวังเรื่องกินไม่พอมากกว่ากินเกิน'
        : 'ยังไม่เห็นความต่างชัดเจนระหว่างสองกลุ่ม บันทึกต่อไปเรื่อยๆ ตัวเลขจะนิ่งขึ้น'))
  + '</div>'
  + '<div class="note">นอกจากปริมาณที่กิน การนอนยังเปลี่ยน<b>องค์ประกอบของน้ำหนักที่หายไป</b> — ในงานที่ให้ขาดดุลแคลเท่ากัน กลุ่มที่นอน 5.5 ชม. ลดไขมันได้น้อยกว่าและเสียกล้ามมากกว่ากลุ่มที่นอน 8.5 ชม. อย่างชัดเจน</div>';
}

/* ---------- FOCUS CURVE CHART ---------- */
function drawFocus(){
  const o = ctxOf('cFocus', 230); if(!o) return;
  const c = o.c, w = o.w, h = o.h, pl = 34, pr = 34, pt = 12, pb = 26;
  const w0 = wakeMin(), bed = (hm2min(S.profile.bedTime||'23:00') || 1380);
  const start = Math.max(0, w0 - 30), end = Math.max(start+180, bed + 30);
  const now = nowMin();
  const X = function(m){ return pl + (w-pl-pr)*(m-start)/(end-start); };
  const Y = function(v){ return h-pb - (v/100)*(h-pt-pb); };
  gridLines(c,w,h,pl,pr,pt,pb,4);
  c.fillStyle='rgba(30,148,85,.85)'; c.font='10px "Share Tech Mono",monospace'; c.textAlign='right';
  for(let i=0;i<=4;i++){ const y=pt+(h-pt-pb)*i/4; c.fillText(100-i*25, pl-6, y+3); }
  /* zone bands */
  c.fillStyle='rgba(255,80,51,.07)'; c.fillRect(pl, Y(45), w-pl-pr, h-pb-Y(45));
  c.fillStyle='rgba(60,255,142,.06)'; c.fillRect(pl, pt, w-pl-pr, Y(70)-pt);
  /* hour ticks */
  c.textAlign='center'; c.font='9px "Share Tech Mono",monospace';
  for(let m=Math.ceil(start/120)*120; m<=end; m+=120){
    c.strokeStyle='rgba(30,148,85,.2)'; c.beginPath(); c.moveTo(X(m),pt); c.lineTo(X(m),h-pb); c.stroke();
    c.fillStyle='rgba(30,148,85,.9)'; c.fillText(min2hm(m), X(m), h-9);
  }
  /* caffeine curve (right axis 0-400mg) */
  c.beginPath(); c.strokeStyle='rgba(255,176,0,.75)'; c.lineWidth=1.4;
  let st2=false;
  for(let m=start;m<=end;m+=10){
    const y = h-pb-(clamp(cafLevel(m),0,400)/400)*(h-pt-pb);
    st2 ? c.lineTo(X(m),y) : (c.moveTo(X(m),y), st2=true);
  }
  c.stroke();
  c.fillStyle='rgba(255,176,0,.9)'; c.textAlign='left'; c.font='9px "Share Tech Mono",monospace';
  c.fillText('400mg', w-pr+3, pt+8); c.fillText('0', w-pr+3, h-pb+3);
  /* focus: solid up to now, dashed after */
  const seg = function(a,b,dash){
    c.save(); if(dash) c.setLineDash([5,4]);
    c.beginPath(); c.strokeStyle = dash ? 'rgba(30,148,85,.95)' : '#3CFF8E';
    c.lineWidth = dash ? 1.8 : 2.4;
    if(!dash){ c.shadowColor='rgba(60,255,142,.6)'; c.shadowBlur=7; }
    let s0=false;
    for(let m=a;m<=b;m+=6){ const y=Y(focusAt(m)); s0 ? c.lineTo(X(m),y) : (c.moveTo(X(m),y), s0=true); }
    c.stroke(); c.shadowBlur=0; c.restore();
  };
  seg(start, Math.min(now,end), false);
  if(now < end) seg(Math.min(now,end), end, true);
  /* now marker */
  if(now>=start && now<=end){
    c.save(); c.setLineDash([2,3]); c.strokeStyle='rgba(207,255,228,.5)';
    c.beginPath(); c.moveTo(X(now),pt); c.lineTo(X(now),h-pb); c.stroke(); c.restore();
    const fy=Y(focusAt(now));
    c.fillStyle='#CFFFE4'; c.beginPath(); c.arc(X(now),fy,4,0,7); c.fill();
  }
}

      + '<div><s>ต่างกัน</s><b>'+r0(best.v-worst.v)+'</b><i>จุด</i></div>'
    + '</div>'
    + '<div class="note">เอาไปวางแผนได้เลย — ประชุมที่ต้องตัดสินใจหรืองานวิเคราะห์ควรลงวันที่ค่าสติสูง '
    + 'ส่วนวันที่ต่ำเก็บไว้ทำงานเอกสารหรืองานประจำ · <b>ตัวแปรที่ขยับค่านี้มากที่สุดคือชั่วโมงนอน</b> ลองเทียบเส้นสองเส้นดู</div>';
}
function drawFocusHist(){
  const o = ctxOf('cFocusHist', 190); if(!o) return;
  const c = o.c, w = o.w, h = o.h, pl = 34, pr = 34, pt = 14, pb = 30;
  const rows = focusHist();
  const bw = (w-pl-pr)/rows.length;
  gridLines(c,w,h,pl,pr,pt,pb,4);
  c.font = '10px "Share Tech Mono",monospace'; c.textAlign = 'right';
  c.fillStyle = 'rgba(60,255,142,.85)';
  for(let i=0;i<=4;i++){ const y = pt+(h-pt-pb)*i/4; c.fillText(100-i*25, pl-6, y+3); }
  c.textAlign='left'; c.fillStyle='rgba(255,176,0,.9)';
  for(let i=0;i<=4;i++){ const y = pt+(h-pt-pb)*i/4; c.fillText(r1(12-i*3), w-pr+5, y+3); }
  const Y  = function(v){ return h-pb-(clamp(v,0,100)/100)*(h-pt-pb); };
  const Ys = function(v){ return h-pb-(clamp(v,0,12)/12)*(h-pt-pb); };
  /* แท่งค่าสติ */
  rows.forEach(function(r,i){
    if(r.v === null) return;
    const x = pl+bw*i+bw*0.22, bwid = bw*0.56, y = Y(r.v);
    c.fillStyle = r.v >= 70 ? 'rgba(60,255,142,.55)' : (r.v >= 50 ? 'rgba(255,176,0,.5)' : 'rgba(255,80,51,.55)');
    c.fillRect(x, y, bwid, h-pb-y);
    c.strokeStyle = r.v >= 70 ? '#3CFF8E' : (r.v >= 50 ? '#FFB000' : '#FF5033');
    c.lineWidth = 1; c.strokeRect(x+.5, y+.5, bwid-1, h-pb-y-1);
  });
  /* เส้นชั่วโมงนอน */
  c.save(); c.setLineDash([5,4]); c.beginPath(); c.strokeStyle='#FFB000'; c.lineWidth=1.6;
  let st2=false;
  rows.forEach(function(r,i){
    if(!r.sl) return;
    const x = pl+bw*i+bw/2, y = Ys(r.sl);
    st2 ? c.lineTo(x,y) : (c.moveTo(x,y), st2=true);
  });
  c.stroke(); c.restore();
  /* labels */
  c.textAlign='center'; c.font='9px "Share Tech Mono",monospace';
  const WD = ['อา','จ','อ','พ','พฤ','ศ','ส'];
  rows.forEach(function(r,i){
    c.fillStyle = (r.k === today()) ? '#CFFFE4' : 'rgba(30,148,85,.9)';
    c.fillText(WD[new Date(r.k+'T12:00:00').getDay()], pl+bw*i+bw/2, h-16);
    c.fillText(r.k.slice(8), pl+bw*i+bw/2, h-5);
  });
}
function bindFocus(m){
  m.querySelectorAll('[data-slq]').forEach(function(b){ b.onclick = function(){
    const d = day(); if(!d.sleep) d.sleep = {};
    d.sleep.q = b.dataset.slq; beep(700,.04); save(); }; });
  m.querySelectorAll('[data-slq2]').forEach(function(b){ b.onclick = function(){
    const d = day(); if(!d.sleep) d.sleep = {};
    d.sleep.h = clamp(Math.round(((d.sleep.h||7) + (+b.dataset.slq2))*4)/4, 0, 16);
    beep(660,.04); save(); }; });
  on('saveSleep', function(){
    const hv = +el('slH').value, wv = (el('slW').value||'').trim();
    if(hv <= 0 || hv > 16){ toast('กรอกจำนวนชั่วโมงให้ถูกต้องก่อน'); return; }
    const d = day(); if(!d.sleep) d.sleep = {};
    d.sleep.h = hv;
    if(wv && hm2min(wv) !== null) d.sleep.wake = wv;
    beep(880,.09); save(); toast('บันทึกการนอน '+r1(hv)+' ชม.');
  });
  on('saveSleepCfg', function(){
    S.profile.sleepNeed = +el('slNeed').value || 8;
    const bt = (el('slBed').value||'').trim();
    if(bt && hm2min(bt) !== null) S.profile.bedTime = bt;
    beep(880,.09); save(); toast('บันทึกค่าตั้งต้นแล้ว');
  });
}

/* ---------- ICS ---------- */
function icsFold(line){
  const out = [];
  let s = line;
  while(s.length > 72){ out.push(s.slice(0,72)); s = ' ' + s.slice(72); }
  out.push(s);
  return out.join('\r\n');
}
function icsEsc(t){ return String(t).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
function icsStamp(){
  const d = new Date();
  return d.getUTCFullYear()
    + String(d.getUTCMonth()+1).padStart(2,'0') + String(d.getUTCDate()).padStart(2,'0')
    + 'T' + String(d.getUTCHours()).padStart(2,'0') + String(d.getUTCMinutes()).padStart(2,'0')
    + String(d.getUTCSeconds()).padStart(2,'0') + 'Z';
}
function icsEvent(uid, hm, title, desc){
  const t = shiftKey(today(), 1).replace(/-/g,'');   /* เริ่มพรุ่งนี้ */
  const hhmm = hm.replace(':','') + '00';
  return ['BEGIN:VEVENT',
    'UID:'+uid+'@nutriboy',
    'DTSTAMP:'+icsStamp(),
    'DTSTART:'+t+'T'+hhmm,          /* floating local time — iOS อ่านเป็นเวลาเครื่อง */
    'DURATION:PT5M',
    'RRULE:FREQ=DAILY',
    icsFold('SUMMARY:'+icsEsc(title)),
    icsFold('DESCRIPTION:'+icsEsc(desc||title)),
    'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0S',
    icsFold('DESCRIPTION:'+icsEsc(title)),
    'END:VALARM','END:VEVENT'].join('\r\n');
}
function buildICS(opt){
  const r = remindState(), st = suppState(), ev = [];
  if(opt.water) r.water.forEach(function(hm,i){
    ev.push(icsEvent('nb-water-'+i, hm, 'ดื่มน้ำ 1 แก้ว',
      'เป้าวันละ '+waterGoalMl()+' ml (≈ '+mlToGulp(waterGoalMl())+' อึก) — NUTRI-BOY'));
  });
  if(opt.weigh) ev.push(icsEvent('nb-weigh', r.weigh, 'ชั่งน้ำหนัก + กรอกเวลานอน',
    'ชั่งตอนตื่น หลังเข้าห้องน้ำ ก่อนกินอะไร แล้วบันทึกในแอป'));
  if(opt.supp){
    const bySlot = {};
    st.on.forEach(function(id){
      const sp = suppById(id); if(!sp) return;
      const hm = SUPP_SLOT[id] || '12:00';
      if(!bySlot[hm]) bySlot[hm] = [];
      bySlot[hm].push(sp.n + ' ' + r1(suppDose(id)) + ' ' + sp.u);
    });
    Object.keys(bySlot).forEach(function(hm,i){
      ev.push(icsEvent('nb-supp-'+i, hm, 'อาหารเสริม ('+bySlot[hm].length+' ตัว)',
        bySlot[hm].join('\n')));
    });
  }
  if(opt.caf){
    const bed = hm2min(S.profile.bedTime||'23:00') || 1380;
    ev.push(icsEvent('nb-caf', min2hm(bed - 9*60), 'หมดเวลาคาเฟอีนแล้ว',
      'หลังจากนี้งดกาแฟ เพื่อให้ deep sleep ครบ'));
  }
  if(opt.meal){
    const bed = hm2min(S.profile.bedTime||'23:00') || 1380;
    ev.push(icsEvent('nb-meal', min2hm(bed - 3*60), 'มื้อสุดท้ายของวัน',
      'หลังจากนี้ควรเลี่ยงมื้อหนัก เพื่อลดกรดไหลย้อนและให้หลับลึก'));
  }
  if(!ev.length) return null;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//NUTRI-BOY 3000//TH','CALSCALE:GREGORIAN','METHOD:PUBLISH']
    .concat(ev).concat(['END:VCALENDAR']).join('\r\n');
}
function downloadICS(){
  const opt = {
    water: !!(el('rmWater')||{}).checked,
    supp:  !!(el('rmSupp') ||{}).checked,
    weigh: !!(el('rmWeigh')||{}).checked,
    caf:   !!(el('rmCaf')  ||{}).checked,

  };

  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);

}

/* ---------- in-app notification (ใช้ได้เฉพาะตอนเปิดแอปอยู่) ---------- */
function notifSupported(){ return typeof Notification !== 'undefined'; }
function notifState(){ return notifSupported() ? Notification.permission : 'unsupported'; }
async function askNotif(){
  if(!notifSupported()){ toast('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน'); return; }
  try{
    const r = await Notification.requestPermission();
    remindState().notifOn = (r === 'granted');
    save();
    toast(r === 'granted' ? 'อนุญาตแล้ว — จะเตือนตอนเปิดแอปอยู่' : 'ไม่ได้รับอนุญาต');
  }catch(e){ toast('ขออนุญาตไม่สำเร็จ'); }
}
function fireNotif(title, body){
  if(!notifSupported() || Notification.permission !== 'granted') return;
  try{ new Notification(title, { body:body, tag:'nutriboy', renotify:false }); }catch(e){}
}
/* ตรวจทุกนาทีขณะเปิดแอป */
let NOTIFIED = {};
function notifTick(){
  const r = remindState();
  if(!r.notifOn || Notification.permission !== 'granted') return;
  const now = min2hm(nowMin()), d = day();
  const key2 = today()+'|'+now;
  if(NOTIFIED[key2]) return;
  if(r.water.indexOf(now) >= 0 && waterMl() < waterGoalMl()){
    NOTIFIED[key2] = 1;
    fireNotif('ดื่มน้ำ', 'ตอนนี้ '+waterMl()+'/'+waterGoalMl()+' ml · เหลืออีก '+mlToGulp(waterGoalMl()-waterMl())+' อึก');
  }
  const st = suppState();
  st.on.forEach(function(id){
    if((SUPP_SLOT[id]||'12:00') !== now || tookToday(id)) return;
    NOTIFIED[key2+id] = 1;
    const sp = suppById(id); if(sp) fireNotif('อาหารเสริม', sp.n);
  });
}

/* ---------- catch-up: สรุปสิ่งที่ค้างตอนเปิดแอป ---------- */
function catchUp(){
  const d = day(), p = S.profile, out = [];
  const h = new Date().getHours();
  if(h >= 10 && (d.weight === null || d.weight === undefined)) out.push('ยังไม่ได้ชั่งน้ำหนัก');
  if(h >= 10 && !(d.sleep && d.sleep.h)) out.push('ยังไม่ได้กรอกเวลานอน');
  if(h >= 14 && !d.foods.length) out.push('ยังไม่ได้บันทึกอาหารเลย');
  if(h >= 18 && waterMl() < waterGoalMl()*0.6) out.push('น้ำยังขาด '+mlToGulp(waterGoalMl()-waterMl())+' อึก');
  const st = suppState();
  const miss = st.on.filter(function(id){
    return !tookToday(id) && nowMin() > (hm2min(SUPP_SLOT[id]||'12:00')+120);
  });
  if(miss.length) out.push('อาหารเสริมยังไม่ได้ติ๊ก '+miss.length+' ตัว');
  return out;
}

function findFoodByName(n){
  if(!n) return null;
  const q = n.trim().toLowerCase();
  const pool = myFoods().concat(FOODS);
  let hit = pool.filter(function(f){ return f.n.toLowerCase() === q; })[0];
  if(!hit) hit = pool.filter(function(f){ return f.n.toLowerCase().indexOf(q) === 0; })[0];
  if(!hit) hit = pool.filter(function(f){ return f.n.toLowerCase().indexOf(q) >= 0; })[0];
  return hit || null;
}
async function handleQuickAdd(){
  let qs;
  try{ qs = new URLSearchParams(location.search); }catch(e){ return false; }
  if(!qs || !qs.toString()) return false;
  let acted = [], dirty = false;

  const addName = qs.get('add');
  if(addName){
    const f = findFoodByName(decodeURIComponent(addName));
    if(f){
      const ml = qs.get('meal');
      MEAL = MEALS[ml] ? ml : mealByClock();
      const q = Math.max(0.5, +qs.get('q') || 1);
      pushFood(variant(f,{size:'normal',sweet:'normal'}), q);
      acted.push(f.n + (q!==1 ? ' ×'+r1(q) : ''));
      dirty = true;
    } else {
      acted.push('ไม่พบ "'+decodeURIComponent(addName)+'" ในฐานข้อมูล');
    }
  }
  if(qs.get('water')){
    const n = Math.max(1, +qs.get('water') || 1);
    const d = day(); d.water = Math.max(0,(d.water||0) + n);
    acted.push('น้ำ +'+n+' แก้ว'); dirty = true;

  const sid = qs.get('supp');
  if(sid && suppById(sid)){
    const st = suppState(), k = today();
    if(!st.log[k]) st.log[k] = {};
    st.log[k][sid] = nowHM();
    acted.push('ติ๊ก '+suppById(sid).n); dirty = true;
  }
  const tb = qs.get('tab');
  if(tb && ['stat','inv','perks','aid','focus','data','radio'].indexOf(tb) >= 0){
    ACTIVE = tb;
    document.querySelectorAll('#nav button').forEach(function(x){ x.classList.toggle('on', x.dataset.p === tb); });
  }
  /* ล้าง query ออกจาก URL เพื่อไม่ให้บันทึกซ้ำตอนรีเฟรช */
  try{ history.replaceState({}, '', location.pathname); }catch(e){}

    render();
    beep(1318,.09);
    setTimeout(function(){ toast('เพิ่มให้แล้ว: ' + acted.join(' · ')); }, 600);

  return dirty;
}

/* ==========================================================
   APPLE HEALTH IMPORT
   export.xml มักใหญ่ 50–500 MB — อ่านทีเดียวทั้งไฟล์จะทำให้เครื่องค้าง
   จึงอ่านทีละก้อน 4 MB แล้วสแกนหาเฉพาะ record ที่ต้องใช้
   ========================================================== */
let HEALTH = null;   /* ผลการอ่านล่าสุด รอผู้ใช้ยืนยันก่อนเขียนจริง */

const HK = {
  energy:'HKQuantityTypeIdentifierActiveEnergyBurned',
  mass:'HKQuantityTypeIdentifierBodyMass',
  sleep:'HKCategoryTypeIdentifierSleepAnalysis'
};
function attr(tag, name){
  const m = tag.match(new RegExp(name + '="([^"]*)"'));
  return m ? m[1] : null;
}
function hkDate(s){ return s ? s.slice(0,10) : null; }   /* Apple ส่งเป็นเวลาเครื่องอยู่แล้ว */

async function scanHealth(file, onProg){
  const CH = 4 * 1024 * 1024;
  const dec = new TextDecoder('utf-8');
  const energy = {}, mass = {}, sleepMin = {};
  let carry = '', off = 0, recs = 0;

  while(off < file.size){
    const buf = await file.slice(off, off + CH).arrayBuffer();
    let text = carry + dec.decode(buf, { stream: true });
    /* กันแท็กถูกตัดกลางคัน: เก็บส่วนหลัง '<' ตัวสุดท้ายไว้รอบถัดไป */
    const cut = text.lastIndexOf('<');
    if(cut > 0){ carry = text.slice(cut); text = text.slice(0, cut); }
    else { carry = text; text = ''; }

    const re = /<Record\b[^>]*>/g;
    let m;
    while((m = re.exec(text)) !== null){
      const tag = m[0];
      if(tag.indexOf('HKQuantityTypeIdentifierActiveEnergyBurned') < 0 &&
         tag.indexOf('HKQuantityTypeIdentifierBodyMass') < 0 &&
         tag.indexOf('HKCategoryTypeIdentifierSleepAnalysis') < 0) continue;
      const type = attr(tag,'type');
      recs++;
      if(type === HK.energy){
        const k = hkDate(attr(tag,'startDate'));
        let v = parseFloat(attr(tag,'value')) || 0;
        const u = (attr(tag,'unit')||'kcal').toLowerCase();
        if(u === 'kj') v = v / 4.184;
        if(k) energy[k] = (energy[k] || 0) + v;
      } else if(type === HK.mass){
        const k = hkDate(attr(tag,'startDate'));
        let v = parseFloat(attr(tag,'value')) || 0;
        const u = (attr(tag,'unit')||'kg').toLowerCase();
        if(u === 'lb') v = v * 0.45359237;
        if(k && v > 20 && v < 300) mass[k] = v;      /* ค่าล่าสุดของวันนั้นชนะ */
      } else if(type === HK.sleep){
        const val = attr(tag,'value') || '';
        if(val.indexOf('Asleep') < 0) continue;      /* ตัด InBed / Awake ออก */
        const st = attr(tag,'startDate'), en = attr(tag,'endDate');
        if(!st || !en) continue;
        const t0 = new Date(st.replace(' ','T').replace(/ ([+-]\d{2})(\d{2})$/,'$1:$2'));
        const t1 = new Date(en.replace(' ','T').replace(/ ([+-]\d{2})(\d{2})$/,'$1:$2'));
        const mins = (t1 - t0) / 60000;
        if(!(mins > 0) || mins > 900) continue;
        const k = hkDate(en);                        /* นับเข้าวันที่ตื่น */
        if(k) sleepMin[k] = (sleepMin[k] || 0) + mins;
      }
    }
    off += CH;
    if(onProg) onProg(Math.min(1, off / file.size), recs);
    await new Promise(function(r){ setTimeout(r, 0); });   /* ปล่อยให้จอวาดได้ */
  }
  const sleep = {};
  Object.keys(sleepMin).forEach(function(k){
    const h = Math.round(sleepMin[k] / 60 * 4) / 4;
    if(h >= 2 && h <= 15) sleep[k] = h;
  });
  return { energy:energy, mass:mass, sleep:sleep, recs:recs };
}

function healthApply(mode){
  if(!HEALTH) return { days:0, w:0, e:0, s:0 };
  let dn = 0, w = 0, e = 0, sc = 0;
  const touched = {};
  const upd = function(k, fn){
    if(k > today()) return;                          /* ไม่เขียนอนาคต */
    const d = day(k); fn(d); touched[k] = 1;
  };
  Object.keys(HEALTH.energy).forEach(function(k){
    const v = Math.round(HEALTH.energy[k]);
    if(v < 20) return;
    upd(k, function(d){
      if(mode === 'fill' && d.watch) return;
      d.watch = v; e++;
    });
  });
  Object.keys(HEALTH.mass).forEach(function(k){
    upd(k, function(d){
      if(mode === 'fill' && d.weight) return;
      d.weight = Math.round(HEALTH.mass[k] * 10) / 10; w++;
    });
  });
  Object.keys(HEALTH.sleep).forEach(function(k){
    upd(k, function(d){
      if(!d.sleep) d.sleep = {};
      if(mode === 'fill' && d.sleep.h) return;
      d.sleep.h = HEALTH.sleep[k];
      if(!d.sleep.wake) d.sleep.wake = '07:00';
      sc++;
    });
  });
  dn = Object.keys(touched).length;
  /* น้ำหนักล่าสุดที่นำเข้า อัปเดตเข้าโปรไฟล์ด้วย */
  const mk = Object.keys(HEALTH.mass).filter(function(k){ return k <= today(); }).sort();
  if(mk.length) S.profile.weight = Math.round(HEALTH.mass[mk[mk.length-1]] * 10) / 10;
  return { days:dn, w:w, e:e, s:sc };
}

function viewHealth(){
  const h = HEALTH;
  const sum = function(o){ return Object.keys(o).length; };
  let preview = '';
  if(h){
    const eks = Object.keys(h.energy).filter(function(k){ return k <= today(); }).sort();
    const avgE = eks.length ? eks.reduce(function(a,k){ return a + h.energy[k]; },0)/eks.length : 0;
    const mks = Object.keys(h.mass).sort();
    preview = '<div class="stat4" style="margin-top:10px">'
      + '<div><s>Active Energy</s><b>'+sum(h.energy)+'</b><i>วัน · เฉลี่ย '+r0(avgE)+' kcal</i></div>'
      + '<div><s>น้ำหนัก</s><b>'+sum(h.mass)+'</b><i>ครั้ง'+(mks.length?' · ล่าสุด '+r1(h.mass[mks[mks.length-1]])+' kg':'')+'</i></div>'
      + '<div><s>การนอน</s><b>'+sum(h.sleep)+'</b><i>คืน</i></div>'
      + '<div><s>อ่านทั้งหมด</s><b>'+h.recs.toLocaleString()+'</b><i>รายการ</i></div>'
      + '</div>'
      + (eks.length ? '<div class="note">ช่วงข้อมูล: '+thDate(eks[0])+' – '+thDate(eks[eks.length-1])+'</div>' : '')
      + '<div class="btnrow"><button class="btn sm pri" id="hApplyFill">เติมเฉพาะช่องที่ว่าง (ปลอดภัย)</button>'
      + '<button class="btn sm danger" id="hApplyAll">เขียนทับทั้งหมด</button></div>'
      + '<div class="note">"เติมเฉพาะช่องว่าง" จะไม่แตะข้อมูลที่พี่กรอกเองไว้แล้ว — แนะนำอันนี้</div>';
  }
  return '<div class="box" style="margin-top:12px"><h2>นำเข้าจาก Apple Health<span>เติมข้อมูลย้อนหลังทีเดียว</span></h2>'
  + '<div class="note"><b>วิธีเอาไฟล์ออกมา</b><br>'
  + '1. เปิดแอป <b>Health</b> → กดรูปโปรไฟล์มุมขวาบน → เลื่อนลงสุด → <b>ส่งออกข้อมูลสุขภาพทั้งหมด</b><br>'
  + '2. รอสักครู่ (ไฟล์ใหญ่) → เลือก <b>บันทึกลงในไฟล์</b><br>'
  + '3. เปิดแอป <b>ไฟล์</b> หาไฟล์ <code>ส่งออก.zip</code> → กดค้าง → <b>คลายการบีบอัด</b><br>'
  + '4. เข้าโฟลเดอร์ที่ได้ แล้วเลือกไฟล์ <code>export.xml</code> ด้านล่างนี้</div>'
  + '<label class="f">เลือกไฟล์ export.xml</label>'
  + '<input type="file" id="hFile" accept=".xml,text/xml">'
  + '<div class="btnrow"><button class="btn sm pri" id="hScan">อ่านไฟล์</button></div>'
  + '<div id="hProg" class="note"></div>'
  + preview
  + '<div class="warnbox">ไฟล์ถูกอ่าน<b>ในเครื่องพี่เท่านั้น</b> ไม่ได้อัปโหลดไปไหน · ระบบอ่านทีละก้อนเพื่อไม่ให้เครื่องค้าง '
  + 'และดึงมาเฉพาะ 3 อย่าง: Active Energy, น้ำหนัก, ชั่วโมงการนอน · ข้อมูลอื่นไม่ถูกแตะ<br>'
  + '<b>แนะนำให้กดสำรองข้อมูลก่อนนำเข้า</b> เผื่ออยากย้อนกลับ</div>'
  + '</div>';
}
function bindHealth(m){
  on('hScan', async function(){
    const inp = el('hFile');
    if(!inp || !inp.files || !inp.files[0]){ toast('เลือกไฟล์ export.xml ก่อน'); return; }
    const f = inp.files[0];
    const pr = el('hProg');
    if(f.size > 900*1024*1024){ toast('ไฟล์ใหญ่เกิน 900 MB อ่านไม่ไหว'); return; }
    pr.innerHTML = 'กำลังอ่าน... 0%';
    try{
      HEALTH = await scanHealth(f, function(p, n){
        pr.innerHTML = 'กำลังอ่าน... <b>'+r0(p*100)+'%</b> · พบ '+n.toLocaleString()+' รายการ';
      });
      pr.innerHTML = 'อ่านเสร็จแล้ว — ตรวจสรุปด้านล่างก่อนกดนำเข้า';
      beep(1046,.09); render();
    }catch(e){
      pr.innerHTML = 'อ่านไฟล์ไม่สำเร็จ — ตรวจว่าเป็นไฟล์ export.xml ที่คลาย zip แล้วหรือยัง';
    }
  });
  const doApply = function(mode){
    if(!HEALTH){ toast('อ่านไฟล์ก่อน'); return; }
    const r = healthApply(mode);
    HEALTH = null;
    beep(1318,.1); save();
    toast('นำเข้าแล้ว '+r.days+' วัน · พลังงาน '+r.e+' · น้ำหนัก '+r.w+' · การนอน '+r.s);
  };
  on('hApplyFill', function(){ doApply('fill'); });
  on('hApplyAll', function(){
    if(confirm('เขียนทับข้อมูลเดิมทั้งหมดในช่วงที่นำเข้า? กู้คืนไม่ได้ถ้าไม่ได้สำรองไว้')) doApply('all');
  });
}
